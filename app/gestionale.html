function fattReady(){

  [...D.jobs].filter(j=>j.status=='Completato').sort((a,b)=>a.due.localeCompare(b.due)||a.code.localeCompare(b.code)).forEach(j=>{
    const r=rootOf(j); if(seen.has(r))return; seen.add(r);
    const jobs=grpDone(j), open=D.jobs.filter(x=>rootOf(x)==r&&x.status!='Completato'&&x.status!='Fatturata');

    const rows=jobs.map(j=>{const m=Array(12).fill(0);mine.filter(h=>h.job==j).forEach(h=>m[+h.date.slice(5,7)-1]+=h.h);return{job:j,m,tot:m.reduce((a,b)=>a+b,0)}}).sort((a,b)=>jcode(a.job).localeCompare(jcode(b.job)));

const rcvJobQty=(jid,item)=>D.rcv.reduce((a,r)=>a+(r.jx?r.lines.filter(l=>l.job==jid&&l.item==item).reduce((b,l)=>b+l.qty,0):0),0);
function syncOrders(j){
  const need=new Map(), res={c:0,u:0,r:0};
  [...(j.bom||[]),...(j.xBom||[])].forEach(l=>{
    const it=l.item?D.items.find(x=>x.id==l.item):null;
    if(!it&&!String(l.desc||'').trim())return;
    const key=it?'i'+it.id:'f|'+String(l.desc).trim().toLowerCase()+'|'+(l.um||'');
    if(!need.has(key))need.set(key,{it,desc:String(l.desc||'').trim(),um:l.um||'pz',qty:0,cost:+l.cost||0});
    need.get(key).qty+=it?lqB(l):(+l.qty||0);
  });
  const drafts=D.orders.filter(o=>o.auto&&o.job==j.id&&o.status=='Bozza');
  const kept=o=>(o.status=='Ordinato')||(o.status=='Bozza'&&!o.auto), cov=o=>o.split?(o.split[j.id]||0):(o.job==j.id?o.qty:0);
  need.forEach((n,key)=>{
    let cover;
    if(n.it){
      const taken=D.moves.filter(m=>m.job==j.id&&m.item==n.it.id).reduce((a,m)=>a+m.qty,0);
      n.qty=Math.max(0,n.qty-taken-rcvJobQty(j.id,n.it.id));
      // la giacenza serve prima alle commesse create prima di questa e ancora aperte
      const resv=D.jobs.slice(0,Math.max(0,D.jobs.findIndex(x=>x.id==j.id))).filter(k=>!LOCKED.includes(k.status)).reduce((a,k)=>{
        const nd=[...(k.bom||[]),...(k.xBom||[])].filter(l=>l.item==n.it.id).reduce((t,l)=>t+lqB(l),0),tk=D.moves.filter(m=>m.job==k.id&&m.item==n.it.id).reduce((t,m)=>t+m.qty,0);
        return a+Math.max(0,nd-tk-rcvJobQty(k.id,n.it.id))},0);
      cover=Math.max(0,n.it.stock-resv)+D.orders.filter(o=>o.item==n.it.id&&kept(o)).reduce((a,o)=>a+cov(o),0);
    }else cover=D.orders.filter(o=>!o.item&&o.key==key&&(kept(o)||o.status=='Ricevuto')).reduce((a,o)=>a+cov(o),0);
    const short=Math.round((n.qty-cover)*1000)/1000, dr=drafts.find(o=>o.key==key);
    if(short>0){
      if(dr){if(dr.qty!=short){dr.qty=short;res.u++}}
      else{const d=new Date(j.due+'T12:00:00');d.setDate(d.getDate()-7);const due=d.toISOString().slice(0,10)<TODAY?TODAY:d.toISOString().slice(0,10);
        const dsp=n.it?(n.it.sup||0):0, ex=D.orders.find(o=>o.auto&&o.job==j.id&&o.status=='Bozza'&&o.po&&ordSup(o)==dsp&&D.orders.filter(x=>x.po==o.po).every(x=>x.job==j.id));
        let pp,pn0,pd;if(ex){pp=ex.po;pn0=ex.poNum;pd=ex.poDate}else{pp=Date.now()+Math.floor(Math.random()*1e6);pn0=poNext();pd=TODAY}
        D.orders.push({po:pp,poNum:pn0,poDate:pd,id:Date.now()+Math.floor(Math.random()*1e6),item:n.it?n.it.id:0,desc:n.it?'':n.desc,um:n.it?'':n.um,sup:n.it?0:0,qty:short,price:n.it?n.it.cost:n.cost,job:j.id,due,status:'Bozza',auto:true,key,note:'Creato dai materiali della commessa '+j.code});res.c++}
    }else if(dr){D.orders=D.orders.filter(o=>o!==dr);res.r++}
  });
  drafts.forEach(dr=>{if(!need.has(dr.key)&&D.orders.includes(dr)){D.orders=D.orders.filter(o=>o!==dr);res.r++}});
  return res;
}

  const mx=Math.max(0,...src.map(n=>{const m=re.exec(String(n||''));return m?+m[1]:0}));
  return K.pre+'-'+y+'-'+String(mx+1).padStart(3,'0');
}

function sdSave(){
  const err=[], names=k=>SD[k].map(x=>x.n.trim());
  const base=(k,lab)=>{const n=names(k);
    if(!n.length)err.push(lab+': deve restare almeno una voce.');
    if(n.some(x=>!x))err.push(lab+': c’è una voce senza nome.');
    if(new Set(n.map(x=>x.toLowerCase())).size!=n.length)err.push(lab+': ci sono nomi uguali.');};
  base('st','Stati');base('prio','Priorità');base('ph','Fasi');base('ops','Personale');
  LOCKED.forEach(l=>{if(!SD.st.some(x=>x.o==l))err.push('Stati: «'+l+'» è usato dal programma e non può essere eliminato.')});
  SD.st.forEach(x=>{if(x.o&&LOCKED.includes(x.o)&&x.n.trim()!=x.o)err.push('Stati: «'+x.o+'» non può essere rinominato.')});
  ST.filter(o=>!SD.st.some(x=>x.o==o)).forEach(o=>{const c=D.jobs.filter(j=>j.status==o).length;if(c)err.push('Stati: «'+o+'» è usato da '+c+(c==1?' commessa':' commesse')+'. Cambia prima lo stato di quelle commesse.')});
  PRIO.filter(o=>!SD.prio.some(x=>x.o==o)).forEach(o=>{const c=D.jobs.filter(j=>j.prio==o).length;if(c)err.push('Priorità: «'+o+'» è usata da '+c+(c==1?' commessa':' commesse')+'. Cambiala prima in quelle commesse.')});
  OPS.filter(o=>!SD.ops.some(x=>x.o==o.n)).forEach(o=>{const c=D.hours.filter(h=>h.op==o.n).length;if(c)err.push('Personale: '+o.n+' ha '+c+' registrazioni di ore e non può essere eliminato.')});
  if(SD.rc<0||SD.rs<0||SD.rcc<0||SD.rcs<0||SD.vat<0)err.push('Costi orari, prezzi orari e IVA non possono essere negativi.');
  if(err.length){SDmsg={err};render();window.scrollTo(0,0);return}
  const ren=k=>SD[k].filter(x=>x.o!=null&&x.o!=x.n.trim());
  ren('st').forEach(x=>{D.jobs.forEach(j=>{if(j.status==x.o)j.status=x.n.trim()});if(fs==x.o)fs=x.n.trim()});
  ren('prio').forEach(x=>D.jobs.forEach(j=>{if(j.prio==x.o)j.prio=x.n.trim()}));
  const oldPH=[...PH];
  D.jobs.forEach(j=>{j.ph=SD.ph.map(x=>x.o==null?0:(j.ph[oldPH.indexOf(x.o)]||0))});
  ren('ph').forEach(x=>D.hours.forEach(h=>{if(h.phase==x.o)h.phase=x.n.trim()}));
  ren('ops').forEach(x=>D.hours.forEach(h=>{if(h.op==x.o)h.op=x.n.trim()}));
  ST.splice(0,ST.length,...names('st'));PRIO.splice(0,PRIO.length,...names('prio'));PH.splice(0,PH.length,...names('ph'));
  OPS.splice(0,OPS.length,...SD.ops.map(x=>({n:x.n.trim(),t:x.t})));
  D.rates={c:SD.rc,s:SD.rs,cc:SD.rcc,cs:SD.rcs};D.co=JSON.parse(JSON.stringify(SD.co));['name','addr','cap','city','prov','piva','cf','rea','tel','email','pec','web','sdi','iban'].forEach(k=>{if(D.co[k])D.co[k]=String(D.co[k]).trim()});
  D.cfg={...D.cfg,vat:SD.vat,mk:SD.mk,vd:SD.vd,st:[...ST],prio:[...PRIO],ph:[...PH],ops:OPS.map(o=>({...o}))};
  save();SD=null;applyBrand();SDmsg={ok:'Impostazioni salvate.'};render();window.scrollTo(0,0);
}

function sv(k,id){
  const e=E[k], old=id?D[e.c].find(x=>x.id==id):null, r={};
  for(const f of e.f){
    const v=$('#'+f.k).value;
    if(f.t=='item'){const it=findItem(v);if(!it){alert('Articolo non trovato: digita un codice presente in Inventario.');return}r[f.k]=it.id}
    else r[f.k]=(f.t=='number'||f.id)?+v:v;
  }
  if(e.c=='items'&&r.uc!==undefined){
    if(String(r.uc).trim()&&nu(r.uc)==nu(r.um)){r.uc='';r.fc=0;r.pc=0}
    if(String(r.uc).trim()){
      if(!(+r.pc>0)&&!(+r.fc>0)&&nu(r.uc)=='kg'&&+r.kg>0)r.pc=+r.kg;
      if(+r.pc>0)r.fc=1/+r.pc;
      else if(+r.fc>0)r.pc=0;
      else{alert('Indica la conversione: quante '+String(r.uc).trim()+' ci sono in 1 '+r.um+' (oppure quante '+r.um+' sono 1 '+String(r.uc).trim()+').');return}
    }else{r.pc=0;r.fc=0}
  }
  if(r.ca!==undefined)r.cost=(r.uc&&+r.fc>0)?r4((+r.ca||0)/+r.fc):(+r.ca||0);
  if(e.req&&!String(r[e.req]).trim()){alert('Compila il campo obbligatorio prima di salvare.');return}
  if(e.c=='items'&&D.items.some(x=>x.id!=id&&x.code.trim().toLowerCase()==String(r.code).trim().toLowerCase())){alert('Esiste già un articolo con il codice «'+String(r.code).trim()+'»: scegli un codice diverso.');return}
  if(old){e.ap&&e.ap(old,-1);Object.assign(old,r);e.ap&&e.ap(old,1)}else{r.id=Date.now();D[e.c].push(r);e.ap&&e.ap(r,1)}
  save();$('#dlg').close();render();
}

function priceCalc(src){

}

const CODE_PFX=[['TUBOL','TUB'],['TUBO','TUB'],['LAMIER','LAM'],['PIATT','PIA'],['TOND','TON'],['ANGOL','ANG'],['GRIGLIAT','GRIG'],['BULLON','BUL'],['VITE','VIT'],['VITI','VIT'],['DAD','DAD'],['RONDEL','RON'],['FILO','FIL'],['SCATOL','SCA'],['FLANG','FLA'],['TIRAFOND','TIR'],['PROFIL','PRO'],['RETE','RET'],['BARRA','BAR'],['QUADR','QUA'],['CANAL','CAN'],['ELETTROD','ELE'],['DISCO','DIS'],['VERNIC','VER'],['ZINC','ZIN'],['PIASTR','PIA'],['STAFF','STA'],['CERNIER','CER'],['CANCELL','CAN'],['GRIGL','GRIG']];
const CODE_STOP=new Set(['DI','DA','IN','CON','PER','SP','SPESSORE','CL','TIPO','DEL','DELLA','E','A','IL','LA']);
function smartCode(desc){
  const t=String(desc||'').toUpperCase().replace(/[×*]/g,'X').replace(/,/g,'.').replace(/\s+/g,' ').trim();
  if(!t)return '';
  const num=n=>String(parseFloat(n));
  const prof=/\b(HEA|HEB|HEM|IPE|IPN|UPN|UPE|UNP|NP)\s*-?\s*(\d{2,4})\b/.exec(t);
  if(prof)return prof[1]+'-'+prof[2];
  const words=t.replace(/[^A-Z0-9ØÀ-Ü ]/g,' ').split(' ').filter(w=>w.length>=3&&!CODE_STOP.has(w)&&!/^\d/.test(w));
  let pfx='';
  for(const w of words){const m=CODE_PFX.find(p=>w.startsWith(p[0]));if(m){pfx=m[1];break}}
  if(!pfx&&words[0])pfx=words[0].slice(0,3);
  let suf='';
  let m=/\bM\s?(\d{1,3})(?:\s*X\s*(\d+(?:\.\d+)?))?\b/.exec(t);
  if(m)suf='M'+m[1]+(m[2]?'X'+num(m[2]):'');
  else if((m=/(\d+(?:\.\d+)?(?:\s*X\s*\d+(?:\.\d+)?)+)/.exec(t))){let p=m[1].split(/\s*X\s*/).map(num);if(p.length>1&&p[0]==p[1])p.splice(1,1);suf=p.join('X')}
  else if((m=/(?:\bSP\.?|SPESSORE|\bS\.)\s*(\d+(?:\.\d+)?)/.exec(t)))suf=num(m[1]);
  else if((m=/[Ø]\s*(\d+(?:\.\d+)?)|\bD(?:IAM)?\.?\s*(\d+(?:\.\d+)?)/.exec(t)))suf='D'+num(m[1]||m[2]);
  else{const toks=(t.match(/\b[A-Z]{1,3}\d{1,3}\b/g)||[]).filter(x=>!/^S\d{3}/.test(x));
    if(toks.length)suf=toks[0];else if((m=/\b(\d+(?:\.\d+)?)\b/.exec(t)))suf=num(m[1])}
  return (pfx+(suf?'-'+suf:'')).replace(/[^A-Z0-9Ø.\-X]/g,'').slice(0,20)||'';
}

const genCode=d=>smartCode(d)||String(d||'').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,14).replace(/-+$/,'')||'ART-NUOVO';
function uniqCode(base,exceptId){let c=base||'ART',n=2;while(D.items.some(x=>x.id!=exceptId&&x.code.toLowerCase()==c.toLowerCase()))c=base+'-'+(n++);return c}
let CODE_AUTO='';
function codeAuto(force){
  const c=$('#code'),d=$('#desc');if(!c||!d)return;
  const id=PRID||0;
  if(force||!c.value.trim()||c.value==CODE_AUTO){const g=genCode(d.value);CODE_AUTO=g?uniqCode(g,id):'';c.value=CODE_AUTO}
}
let PRID=0;
function matchItem(code,desc,hint){
  let it=exactItem(hint)||exactItem(code); if(it)return it;
  const nc=norm(code), nd=norm(desc);
  if(nc){it=D.items.find(x=>norm(x.code)==nc);if(it)return it}
  if(nd){
    it=D.items.find(x=>norm(x.desc)==nd);if(it)return it;
    const m=D.items.filter(x=>{const k=norm(x.desc);return k.length>=5&&(k.includes(nd)||nd.includes(k))});
    if(m.length==1)return m[0];
  }
  return null;
}
function matchSup(name){
  const n=norm(name); if(n.length<3)return 0;
  const s=D.sup.find(x=>{const k=norm(x.n);return k&&(k.includes(n)||n.includes(k))});
  return s?s.id:0;
}
// legge il PDF: anteprime delle pagine (per l'operatore e per Claude) e testo, se presente
async function pdfRead(file){
  if(!window.pdfjsLib)throw new Error('pdfjs');
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const use=Math.min(pdf.numPages,4), pages=[], blobs=[], out=[];
  for(let p=1;p<=use;p++){
    const pg=await pdf.getPage(p), vp=pg.getViewport({scale:1.5});
    const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    pages.push(cv.toDataURL('image/jpeg',.85));
    blobs.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)));
    const tc=await pg.getTextContent(), rows={};
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)});
    out.push(Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean).join('\n'));
  }
  return {name:file.name,n:pdf.numPages,pages,blobs,text:out.join('\n\n')};
}
async function rcvExtract(pg,signal){
  const sample=(window.claude&&claude.use)?await claude.use('sample'):null;
  if(!sample)return {unavailable:true};
  let imgs=null;
  try{const lim=await sample.limits();if(lim&&lim.images)imgs=pg.blobs.slice(0,lim.images.maxCount||4)}catch(e){}
  const hasText=pg.text.replace(/\s/g,'').length>120;
  if(!imgs&&!hasText)return {unavailable:true,why:'Il PDF sembra una scansione e questa vista non può inviare immagini a Claude: inserisci le righe a mano.'};
  const known=D.items.slice(0,300).map(i=>i.code+' = '+i.desc+' ('+i.um+')').join('\n');
  const prompt=[
    'Sei l\'addetto al ricevimento merci di una carpenteria metallica. Leggi la bolla di consegna (DDT) di un fornitore e estrai i dati.',
    imgs?'Le immagini allegate sono le pagine del documento.':'',
    hasText?'Testo estratto dal PDF (può essere disordinato):\n'+pg.text.slice(0,60000):'',
    'Articoli già presenti a magazzino (codice = descrizione (unità)):\n'+(known||'(nessuno)'),
    'Commesse aperte (codice = cliente, lavoro). Per il campo commessa usa solo un codice di questa lista, e solo se il documento la richiama chiaramente (riferimento commessa, cantiere, ordine cliente):\n'+(D.jobs.filter(open_).map(j=>j.code+' = '+cn(j.client)+', '+j.desc).join('\n')||'(nessuna)'),
    'Rispondi solo con un oggetto JSON di questa forma:',
    '{"fornitore":"ragione sociale del mittente","numero":"numero del documento","data":"AAAA-MM-GG o vuoto","commessa":"codice commessa se il documento la richiama per tutta la consegna, altrimenti vuoto","righe":[{"codice":"codice articolo in bolla","descrizione":"descrizione","quantita":0,"um":"m, kg, pz, m² ...","prezzo":null,"commessa":"codice commessa se la riga ne richiama una, altrimenti vuoto","magazzino":"codice dell\'articolo a magazzino se corrisponde con sicurezza, altrimenti vuoto"}]}',
    'Regole: includi solo righe di merce consegnata, non trasporto, imballi, note, totali o dati del destinatario. La quantità è un numero con il punto come separatore decimale. Il prezzo è il prezzo unitario se indicato, altrimenti null. Non inventare dati: se qualcosa non è leggibile lascia vuoto o 0.'
  ].filter(Boolean).join('\n\n');
  return await sample.json(prompt,{signal,modelTier:'default',...(imgs?{images:imgs}:{})});
}
function rcvErr(e){
  const c=e&&e.code;
  if(c=='not_granted')return 'Non hai consentito alla pagina di usare Claude: inserisci le righe a mano.';
  if(c=='rate_limited')return 'Limite di utilizzo raggiunto o troppe richieste: riprova più tardi oppure inserisci le righe a mano.';
  if(c=='invalid_json')return 'La lettura automatica non ha prodotto un risultato leggibile: controlla il documento e inserisci le righe a mano.';
  if(c=='image_rejected'||c=='images_unavailable')return 'Le immagini del PDF non sono state accettate: inserisci le righe a mano.';
  return 'Lettura automatica non riuscita'+(c?' ('+c+')':'')+': inserisci le righe a mano.';
}

async function rcvImport(file){
  if(!/\.pdf$/i.test(file.name)&&file.type!='application/pdf'){alert('Seleziona un file PDF.');return}
  const ctl=rcvCtl=new AbortController();
  rcvProc('Lettura del PDF in corso…');
  let pg=null,note='';
  try{pg=await pdfRead(file)}catch(e){note='Non è stato possibile aprire il PDF (file protetto o libreria non caricata): inserisci le righe a mano.'}
  if(ctl.signal.aborted)return;
  let data=null;
  if(pg){
    $('#rvst').textContent='Lettura delle righe in corso. Può richiedere fino a un minuto: al primo utilizzo compare la richiesta di consenso a usare Claude.';
    try{data=await rcvExtract(pg,ctl.signal)}catch(e){if(ctl.signal.aborted||(e&&e.code=='cancelled'))return;note=rcvErr(e)}
    if(ctl.signal.aborted)return;
  }
  rcvCtl=null;
  rcvOpenReview(file.name,pg,data,note);
}
function rcvOpenReview(name,pg,data,note){
  const lines=[]; let sup=0,doc='',date=TODAY;
  if(data&&data.unavailable)note=data.why||'Lettura automatica non disponibile in questa vista: inserisci le righe a mano.';
  else if(data&&typeof data=='object'){
    sup=matchSup(data.fornitore); doc=String(data.numero||'').trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(String(data.data||'')))date=data.data;
    (Array.isArray(data.righe)?data.righe:[]).forEach(r=>{
      if(!r)return;
      const desc=String(r.descrizione||'').trim(), code=String(r.codice||'').trim(); if(!desc&&!code)return;
      const it=matchItem(code,desc,r.magazzino);
      lines.push({on:true,code,desc,qty:toNum(r.quantita),um:String(r.um||'').trim()||(it?it.um:'pz'),price:toNum(r.prezzo),target:it?it.code:(code||genCode(desc)),job:matchJob(r.commessa)});
    });
    if(!lines.length&&!note)note='Nessuna riga di merce riconosciuta nel documento: aggiungile a mano.';
  }
  const dj=data&&!data.unavailable&&typeof data=='object'?matchJob(data.commessa):0;
  const pre=OPRE; OPRE=null;
  if(pre&&pre.manual&&!lines.length)pre.orders.forEach(id=>{const o=D.orders.find(x=>x.id==id);if(o)lines.push({on:true,code:o.item?ordName(o):'',desc:o.item?itm(o.item).desc:o.desc,qty:o.qty,um:ordUm(o),price:o.price||0,target:o.item?ordName(o):genCode(o.desc),job:o.job||0,ord:o.id})});
  if(pre&&pre.sup)sup=pre.sup;
  const tg=new Set(lines.map(l=>String(l.target||'').trim().toLowerCase()));
  const autoOrd=pre&&pre.manual?[...pre.orders]:D.orders.filter(o=>o.status=='Ordinato'&&(!pre||pre.orders.includes(o.id))&&o.item&&(!sup||ordSup(o)==sup)&&tg.has(itm(o.item).code.toLowerCase())).map(o=>o.id);
  R={orders:autoOrd,name,pages:pg?pg.pages:[],more:pg&&pg.n>pg.pages.length?pg.n:0,sup,doc,date,orders:[],upd:false,lines,note,job:dj,jmode:dj?'doc':(lines.some(l=>l.job)?'line':'none')};
  rvAuto();rvRender();
}

function rvAlloc(l){
  const t=String(l.target||'').trim().toLowerCase();
  const byCode=f=>D.orders.filter(o=>f(o)&&o.item&&itm(o.item).code.toLowerCase()==t);
  let os=l.ord?D.orders.filter(o=>o.id==l.ord):(t?byCode(o=>R.orders.includes(o.id)):[]);
  if(!os.length&&!l.ord&&t&&R.sup)os=byCode(o=>o.status=='Ordinato'&&ordSup(o)==R.sup);
  if(!os.length)return null;
  const m={};os.forEach(o=>{const sp=o.split||{[o.job||0]:o.qty};Object.keys(sp).forEach(k=>m[k]=(m[k]||0)+sp[k])});
  const ks=Object.keys(m);return ks.length?ks.map(k=>({job:+k,q:m[k]})):null;
}

const SH_TYPES=['Montante','Traverso','Profilo','Piatto','Lamiera','Tubo','Decoro','Accessorio','Foro','Altro'];
const SH_OFF=/quot|dim|www|rights|defpoints|text|testo|titol|cartig|tratteg|hatch|axis|asse|centro|copyright/i;
const shSteps=()=>['Controllo disegno e materiale in arrivo','Taglio a misura (vedi distinta)','Sbavatura e controllo misure','Assemblaggio e puntatura','Saldatura e finitura cordoni',...PH.slice(1),'Controllo finale','Imballo ed etichetta commessa'];
const ebb=e=>{if(e.t=='C')return[e.p[0]-e.r,e.p[1]-e.r,e.p[0]+e.r,e.p[1]+e.r];let a=1e18,b=1e18,c=-1e18,d=-1e18;for(let i=0;i<e.p.length;i+=2){const x=e.p[i],y=e.p[i+1];if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y}return[a,b,c,d]};
// ---- lettura file DXF (testo)
function bulgePts(x1,y1,x2,y2,b){
  const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy);if(!d)return[];
  const f=(d/2)*(1-b*b)/(2*b),cx=(x1+x2)/2+(-dy/d)*f,cy=(y1+y2)/2+(dx/d)*f,r=Math.hypot(x1-cx,y1-cy),a1=Math.atan2(y1-cy,x1-cx),sw=4*Math.atan(b);
  const n=Math.max(2,Math.ceil(Math.abs(sw)/(Math.PI/18))),o=[];for(let i=1;i<n;i++){const a=a1+sw*i/n;o.push(cx+r*Math.cos(a),cy+r*Math.sin(a))}return o}
function dxfParse(txt){
  if(/^AutoCAD Binary DXF/.test(txt))throw new Error('Il file è un DXF binario: salvalo come DXF in formato testo (ASCII).');
  const L=txt.split(/\r?\n/),ents=[],layers={},skip={},SK=new Set(['SPLINE','ELLIPSE','INSERT','HATCH','SOLID','3DFACE','TRACE','RAY','XLINE','LEADER']);
  let sec='',cur=null,pol=null,z='';
  const add=e=>{ents.push(e);layers[e.ly]=(layers[e.ly]||0)+1};
  const polyEnt=(ly,v,cl)=>{
    if(v.length<2)return;const p=[],n=v.length;
    for(let i=0;i<n;i++){p.push(v[i].x,v[i].y);if(v[i].b&&(i<n-1||cl)){const w=v[(i+1)%n];p.push(...bulgePts(v[i].x,v[i].y,w.x,w.y,v[i].b))}}
    if(!cl&&n>2&&Math.hypot(v[0].x-v[n-1].x,v[0].y-v[n-1].y)<1e-9){p.length-=2;cl=1}
    add({t:'P',ly,c:cl?1:0,p})};
  const fin=()=>{
    if(!cur)return;const c=cur;cur=null;
    if(c.t=='LINE')add({t:'P',ly:c.ly,c:0,p:[c.x1,c.y1,c.x2,c.y2]});
    else if(c.t=='LWPOLYLINE')polyEnt(c.ly,c.v,c.f&1);
    else if(c.t=='POLYLINE'){c.v=[];pol=c}
    else if(c.t=='VERTEX'){if(pol&&!((c.f||0)&(16|64|128)))pol.v.push({x:c.x,y:c.y,b:c.b||0})}
    else if(c.t=='CIRCLE')add({t:'C',ly:c.ly,p:[c.x,c.y],r:c.r});
    else if(c.t=='ARC'){let s=((c.a2-c.a1)%360+360)%360;if(!s)s=360;const n=Math.max(2,Math.ceil(s/10)),p=[];for(let i=0;i<=n;i++){const a=(c.a1+s*i/n)*Math.PI/180;p.push(c.x+c.r*Math.cos(a),c.y+c.r*Math.sin(a))}add({t:'P',ly:c.ly,c:0,p})}};
  for(let i=0;i+1<L.length;i+=2){
    const code=parseInt(L[i]),val=L[i+1].trim();
    if(code===0){
      fin();
      if(val=='SEQEND'){if(pol){polyEnt(pol.ly,pol.v,pol.f&1);pol=null}}
      else if(val=='SECTION'){z='SECTION'}
      else if(val=='ENDSEC'){sec='';pol=null}
      else if(sec=='ENTITIES'){
        if(['LINE','LWPOLYLINE','POLYLINE','VERTEX','CIRCLE','ARC'].includes(val))cur={t:val,ly:'0',v:[],f:0};
        else if(SK.has(val))skip[val]=(skip[val]||0)+1}
      if(val!='SECTION')z='';
    }else if(z=='SECTION'&&code===2){sec=val;z=''}
    else if(cur){
      const n=parseFloat(val),t=cur.t;
      if(code===8)cur.ly=val;else if(code===70)cur.f=parseInt(val)||0;
      else if(t=='LINE'){if(code==10)cur.x1=n;else if(code==20)cur.y1=n;else if(code==11)cur.x2=n;else if(code==21)cur.y2=n}
      else if(t=='LWPOLYLINE'){if(code==10)cur.v.push({x:n,y:0,b:0});else if(code==20&&cur.v.length)cur.v[cur.v.length-1].y=n;else if(code==42&&cur.v.length)cur.v[cur.v.length-1].b=n}
      else if(t=='VERTEX'){if(code==10)cur.x=n;else if(code==20)cur.y=n;else if(code==42)cur.b=n}
      else if(t=='CIRCLE'||t=='ARC'){if(code==10)cur.x=n;else if(code==20)cur.y=n;else if(code==40)cur.r=n;else if(code==50)cur.a1=n;else if(code==51)cur.a2=n}
    }
  }
  fin();
  if(!ents.length)throw new Error('Nel file non ho trovato linee, polilinee, cerchi o archi da leggere.');
  return{ents,layers,skip};
}
// ---- viste (più disegni nello stesso file)
function shViews(ents){
  const bbs=ents.map(ebb),all=ents.map((e,i)=>i);if(!all.length)return[];
  const ext=ix=>{let a=1e18,b=1e18,c=-1e18,d=-1e18;ix.forEach(i=>{const q=bbs[i];a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3])});return[a,b,c,d]};
  const cl=(ix,ax,gap)=>{const s=[...ix].sort((p,q)=>bbs[p][ax]-bbs[q][ax]),o=[];let g=[s[0]],end=bbs[s[0]][ax+2];
    for(let k=1;k<s.length;k++){const i=s[k];if(bbs[i][ax]-end>gap){o.push(g);g=[i];end=bbs[i][ax+2]}else{g.push(i);end=Math.max(end,bbs[i][ax+2])}}o.push(g);return o};
  const sp=(ix,dep)=>{const b=ext(ix),gap=.05*Math.max(b[2]-b[0],b[3]-b[1]);if(dep>3||!(gap>0))return[ix];
    for(const ax of[1,0]){const g=cl(ix,ax,gap);if(g.length>1)return g.flatMap(x=>sp(x,dep+1))}return[ix]};
  let vs=sp(all,0).filter(g=>g.length>=Math.max(3,ents.length*.02));
  if(!vs.length||vs.length>12)vs=[all];

const FDB=()=>new Promise((ok,ko)=>{try{const r=indexedDB.open('gc_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}});
const fPut=(id,b)=>FDB().then(db=>new Promise((ok,ko)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(b,id);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error)}));
const fGet=id=>FDB().then(db=>new Promise((ok,ko)=>{const q=db.transaction('f').objectStore('f').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)}));
const fDel=id=>FDB().then(db=>new Promise((ok,ko)=>{const t=db.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error)}));
async function shPdfAdd(f){
  if(f.size>SH_MAXF){SHW.err='File troppo grande (massimo 20 MB).';shRender();return}
  try{const fid=shFid();await fPut(fid,f);if(!SHW.s)SHW.s=shNew();SHW.s.pdfs=SHW.s.pdfs||[];SHW.s.pdfs.push({fid,name:f.name,size:f.size,type:f.type||'application/pdf',date:new Date().toISOString().slice(0,10)});
    SHW.start=false;SHW.imp=false;SHW.add=false;SHW.page='sheet';SHW.err='';shSave(true);shRender();toast('Disegno PDF archiviato nella scheda.');
  }catch(e){SHW.err='Impossibile salvare il file in questo browser.';shRender()}
}
async function shFilesAdd(list){
  const L=[...list];let n=0;
  for(const f of L){if(f.size>SH_MAXF){toast(f.name+': troppo grande (massimo 20 MB).');continue}
    try{const fid=shFid();await fPut(fid,f);SHW.s.files.push({fid,name:f.name,size:f.size,type:f.type,date:new Date().toISOString().slice(0,10)});n++}catch(e){toast('Impossibile salvare '+f.name+' in questo browser.')}}

}

// ---------- cambio password personale
function pwdOpen(forced){
  const d=$('#dlg');d.oninput=null;d.classList.remove('wide');d.oncancel=forced?e=>e.preventDefault():null;
  d.innerHTML=`<div class="dh"><h2>Cambia password</h2>${forced?'<div class="mut">L’amministratore richiede di scegliere una nuova password prima di continuare.</div>':''}</div><div class="db">
  <label class="full">Password attuale<input id="pw0" type="password" autocomplete="current-password"></label>
  <label>Nuova password<input id="pw1" type="password" autocomplete="new-password"></label>
  <label>Ripeti nuova password<input id="pw2" type="password" autocomplete="new-password"></label><div class="full neg" id="pwe"></div></div>
  <div class="df">${forced?'<button class="b" onclick="logout()">Esci</button>':'<button class="b" onclick="$(\'#dlg\').close()">Annulla</button>'}<button class="b pri" onclick="pwdSave()">Salva password</button></div>`;
  d.showModal();$('#pw0').focus();
}
async function pwdSave(){
  const e=m=>{$('#pwe').textContent=m},a=$('#pw0').value,p=$('#pw1').value,p2=$('#pw2').value;
  if((await hashPw(a,ME.salt))!=ME.hash)return e('La password attuale non è corretta.');
  if(p.length<D.sec.minLen)return e('La nuova password deve avere almeno '+D.sec.minLen+' caratteri.');
  if(p!=p2)return e('Le due password non coincidono.');
  if(p==a)return e('Scegli una password diversa dalla precedente.');
  ME.salt=newSalt();ME.hash=await hashPw(p,ME.salt);ME.must=0;addLog('Password cambiata');saveRaw();
  const d=$('#dlg');d.oncancel=null;d.close();toast('Password aggiornata.');
}

// ---------- pagina amministrazione
let UMSG=null;
const uHtml=()=>{
  const s=D.sec,card=(t,note,body)=>`<div class="tw" style="padding:14px 16px;margin-bottom:16px"><h3 style="margin:0 0 4px">${t}</h3><div class="mut" style="margin-bottom:10px">${note}</div>${body}</div>`;
  const num=(id,l,v,mn,mx)=>`<label style="display:flex;flex-direction:column;font-size:13px;gap:4px;min-width:170px">${l}<input id="${id}" type="number" min="${mn}" max="${mx}" value="${v}"></label>`;
  const nAdm=D.users.filter(u=>u.role=='admin'&&u.on).length;
  const users=`<div class="tw"><table><thead><tr><th>Utente</th><th>Nome</th><th>Ruolo</th><th>Stato</th><th>Ultimo accesso</th><th></th></tr></thead><tbody>${D.users.map(u=>`<tr><td><b>${esc(u.user)}</b>${u.id==ME.id?' <span class="tag">tu</span>':''}</td><td>${esc(u.name)}</td><td>${esc(roleName(u.role))}</td><td>${u.lock>Date.now()?'<span class="tag late">bloccato</span>':u.on?'Attivo':'<span class="mut">Disattivato</span>'}${u.must?' <span class="tag">cambio pwd</span>':''}</td><td>${u.last?nowIt(u.last):'<span class="mut">mai</span>'}</td><td style="white-space:nowrap"><button class="b" onclick="userEdit(${u.id})">Modifica</button> ${u.id==ME.id?'':`<button class="b dng" onclick="userDel(${u.id})">Elimina</button>`}</td></tr>`).join('')}</tbody></table></div><div class="tools" style="margin-top:10px"><button class="b pri" onclick="userEdit(0)">+ Nuovo utente</button></div>`;
  const roles=D.roles.map(r=>`<div style="border:1px solid var(--line);border-radius:4px;padding:12px;margin:10px 0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input id="rn_${r.id}" value="${esc(r.name)}" style="flex:1;min-width:180px;font-weight:700">
   <span class="mut">${D.users.filter(u=>u.role==r.id).length==1?'1 utente':D.users.filter(u=>u.role==r.id).length+' utenti'}</span><button class="b pri" onclick="roleSave('${r.id}')">Salva ruolo</button><button class="b dng" onclick="roleDel('${r.id}')">Elimina ruolo</button></div>
   <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:10px 0">${SECS.map(([k,l])=>`<label style="display:flex;flex-direction:column;font-size:13px;gap:3px">${l}<select id="rp_${r.id}_${k}">${LVN.map((n,i)=>`<option value="${i}" ${(r.perm[k]||0)==i?'selected':''}>${n}</option>`).join('')}</select></label>`).join('')}</div>
   <label style="margin-right:16px"><input type="checkbox" id="rd_${r.id}" ${r.del?'checked':''}> Può eliminare dati</label><label><input type="checkbox" id="rf_${r.id}" ${r.pdf?'checked':''}> Può esportare PDF</label></div>`).join('');
  const log=`<div class="tw"><table><thead><tr><th>Data e ora</th><th>Utente</th><th>Evento</th></tr></thead><tbody>${D.log.slice(0,40).map(l=>`<tr><td>${nowIt(l.t)}</td><td>${esc(l.u)}</td><td>${esc(l.ev)}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">Nessun evento.</td></tr>'}</tbody></table></div>`;
  return (UMSG?`<div class="tag" style="margin-bottom:12px;display:inline-block">${esc(UMSG)}</div>`:'')+
  card('Utenti','Crea, modifica, disattiva gli utenti e reimposta le password. Il ruolo Amministratore ha sempre accesso completo e non è modificabile.',users)+
  card('Ruoli e permessi','Per ogni ruolo scegli, sezione per sezione, se l’utente non vede nulla, può solo consultare o può anche modificare. In sola lettura i pulsanti di modifica vengono nascosti e i campi bloccati.',roles+`<div style="display:flex;gap:8px;margin-top:6px"><input id="nrole" placeholder="Nome nuovo ruolo" style="flex:1"><button class="b pri" onclick="roleAdd()">Aggiungi ruolo</button></div>`)+
  card('Parametri di sicurezza','Valgono per tutti gli utenti.',`<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">${num('s_len','Lunghezza minima password',s.minLen,4,32)}${num('s_fail','Tentativi errati prima del blocco',s.maxFail,2,20)}${num('s_lock','Durata blocco (minuti)',s.lockMin,1,1440)}${num('s_idle','Uscita automatica dopo (minuti, 0 = mai)',s.idle,0,720)}<button class="b pri" onclick="secSave()">Salva parametri</button></div>`)+
  card('Registro accessi','Ultimi 40 eventi.',log);
};
const usersView=()=>{const h=uHtml();UMSG=null;return h};
const uRefresh=m=>{UMSG=m||null;saveRaw();render()};
function secSave(){
  const g=id=>Math.floor(+$('#'+id).value);const v={minLen:g('s_len'),maxFail:g('s_fail'),lockMin:g('s_lock'),idle:g('s_idle')};
  if(!(v.minLen>=4&&v.maxFail>=2&&v.lockMin>=1&&v.idle>=0))return toast('Valori non validi.');
  D.sec=v;addLog('Parametri di sicurezza modificati');uRefresh('Parametri salvati.');
}
function roleSave(id){
  const r=D.roles.find(x=>x.id==id),n=$('#rn_'+id).value.trim();if(!r)return;
  if(!n)return toast('Il nome del ruolo non può essere vuoto.');
  if(D.roles.some(x=>x.id!=id&&x.name.toLowerCase()==n.toLowerCase())||n.toLowerCase()=='amministratore')return toast('Esiste già un ruolo con questo nome.');
  r.name=n;SECS.forEach(([k])=>r.perm[k]=+$(`#rp_${id}_${k}`).value);r.del=$('#rd_'+id).checked?1:0;r.pdf=$('#rf_'+id).checked?1:0;
  addLog('Ruolo modificato: '+n);uRefresh('Ruolo «'+n+'» salvato.');
}
function roleDel(id){
  const r=D.roles.find(x=>x.id==id),c=D.users.filter(u=>u.role==id).length;
  if(c)return toast('Impossibile eliminare: '+c+' utenti hanno questo ruolo. Assegna prima un altro ruolo.');
  askConfirm('Eliminare il ruolo «'+r.name+'»?',()=>{D.roles=D.roles.filter(x=>x.id!=id);addLog('Ruolo eliminato: '+r.name);uRefresh('Ruolo eliminato.')});
}
function roleAdd(){
  const n=$('#nrole').value.trim();if(!n)return toast('Scrivi il nome del ruolo.');
  if(D.roles.some(x=>x.name.toLowerCase()==n.toLowerCase())||n.toLowerCase()=='amministratore')return toast('Esiste già un ruolo con questo nome.');
  D.roles.push({id:'r'+Date.now().toString(36),name:n,del:0,pdf:0,perm:P({dash:1})});addLog('Ruolo creato: '+n);uRefresh('Ruolo creato: imposta ora i permessi e salva.');
}
function userEdit(id){
  const u=id?D.users.find(x=>x.id==id):null,d=$('#dlg');d.oninput=null;d.oncancel=null;d.classList.remove('wide');
  d.innerHTML=`<div class="dh"><h2>${u?'Modifica utente':'Nuovo utente'}</h2></div><div class="db">
  <label>Nome utente (per l’accesso)<input id="uu" value="${esc(u?u.user:'')}" autocapitalize="off"></label>
  <label>Nome e cognome<input id="un" value="${esc(u?u.name:'')}"></label>
  <label>Ruolo<select id="ur"><option value="admin" ${u&&u.role=='admin'?'selected':''}>Amministratore</option>${D.roles.map(r=>`<option value="${r.id}" ${u&&u.role==r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>
  <label>Stato<select id="uo"><option value="1" ${!u||u.on?'selected':''}>Attivo</option><option value="0" ${u&&!u.on?'selected':''}>Disattivato</option></select></label>
  <label>${u?'Nuova password (vuoto = invariata)':'Password iniziale'}<input id="up" type="text" autocomplete="off"></label>
  <label style="justify-content:flex-end;flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="um" ${!u||u.must?'checked':''}> Chiedi di cambiarla al prossimo accesso</label>
  <div class="full neg" id="ue"></div></div>
  <div class="df"><button class="b" onclick="$('#dlg').close()">Annulla</button><button class="b pri" onclick="userSave(${id})">Salva utente</button></div>`;
  d.showModal();
}
async function userSave(id){
  const e=m=>{$('#ue').textContent=m},us=$('#uu').value.trim().toLowerCase(),nm=$('#un').value.trim(),ro=$('#ur').value,on=$('#uo').value=='1',p=$('#up').value,must=$('#um').checked;
  const u=id?D.users.find(x=>x.id==id):null;
  if(!us||!nm)return e('Nome utente e nome sono obbligatori.');
  if(/\s/.test(us))return e('Il nome utente non può contenere spazi.');
  if(D.users.some(x=>x.id!=id&&x.user==us))return e('Nome utente già in uso.');
  if((!u||p)&&p.length<D.sec.minLen)return e('La password deve avere almeno '+D.sec.minLen+' caratteri.');
  if(u&&u.id==ME.id&&(ro!='admin'||!on))return e('Non puoi togliere il tuo ruolo di amministratore né disattivarti.');
  if(u&&u.role=='admin'&&u.on&&(ro!='admin'||!on)&&D.users.filter(x=>x.role=='admin'&&x.on).length<2)return e('Deve restare almeno un amministratore attivo.');
  if(!u){const salt=newSalt();D.users.push({id:Math.max(0,...D.users.map(x=>x.id))+1,user:us,name:nm,role:ro,salt,hash:await hashPw(p,salt),on:on?1:0,must:must?1:0,last:'',fails:0,lock:0});addLog('Utente creato: '+us)}
  else{if(u.user!=us)addLog('Utente rinominato: '+u.user+' → '+us);u.user=us;u.name=nm;u.role=ro;u.on=on?1:0;u.fails=0;u.lock=0;
    if(p){u.salt=newSalt();u.hash=await hashPw(p,u.salt);u.must=must?1:0;addLog('Password reimpostata: '+us)}else if(must)u.must=1;
    addLog('Utente modificato: '+us)}
  $('#dlg').close();uRefresh('Utente salvato.');
}
function userDel(id){
  const u=D.users.find(x=>x.id==id);if(!u||u.id==ME.id)return;
  if(u.role=='admin'&&u.on&&D.users.filter(x=>x.role=='admin'&&x.on).length<2)return toast('Deve restare almeno un amministratore attivo.');
  askConfirm('Eliminare l’utente «'+u.user+'»? In alternativa puoi disattivarlo.',()=>{D.users=D.users.filter(x=>x.id!=id);addLog('Utente eliminato: '+u.user);uRefresh('Utente eliminato.')});
}

// ---------- avvio
(function(){AUTH_READY=true;authInit();let sid=null;try{sid=+sessionStorage.getItem('carp_sess')}catch(e){}
  const u=D.users.find(x=>x.id==sid&&x.on);
  if(u){ME=u;lockUI(false);buildNav();view=firstView();render()}else showLogin()})();
</script>
</body>
</html>
