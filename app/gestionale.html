// Per ogni materiale della commessa non coperto dalla giacenza (o non presente in inventario) si tiene una bozza d'ordine.
const rcvJobQty=(jid,item)=>D.rcv.reduce((a,r)=>a+(r.jx?r.lines.filter(l=>l.job==jid&&l.item==item).reduce((b,l)=>b+l.qty,0):0),0);
function syncOrders(j){
  const need=new Map(), res={c:0,u:0,r:0};
  [...(j.bom||[]),...(j.xBom||[])].forEach(l=>{
    const it=l.item?D.items.find(x=>x.id==l.item):null;
    if(!it&&!String(l.desc||'').trim())return;
    const key=it?'i'+it.id:'f|'+String(l.desc).trim().toLowerCase()+'|'+(l.um||'');
    if(!need.has(key))need.set(key,{it,desc:String(l.desc||'').trim(),um:l.um||'pz',qty:0,cost:+l.cost||0});
    need.get(key).qty+=it?lqB(l):(+l.qty||0);
  });
  const drafts=D.orders.filter(o=>o.auto&&o.job==j.id&&o.status=='Bozza');
  const kept=o=>(o.status=='Ordinato')||(o.status=='Bozza'&&!o.auto), cov=o=>o.split?(o.split[j.id]||0):(o.job==j.id?o.qty:0);
  need.forEach((n,key)=>{
    let cover;
    if(n.it){
      const taken=D.moves.filter(m=>m.job==j.id&&m.item==n.it.id).reduce((a,m)=>a+m.qty,0);
      n.qty=Math.max(0,n.qty-taken-rcvJobQty(j.id,n.it.id));
      // la giacenza serve prima alle commesse create prima di questa e ancora aperte
      const resv=D.jobs.slice(0,Math.max(0,D.jobs.findIndex(x=>x.id==j.id))).filter(k=>!LOCKED.includes(k.status)).reduce((a,k)=>{
        const nd=[...(k.bom||[]),...(k.xBom||[])].filter(l=>l.item==n.it.id).reduce((t,l)=>t+lqB(l),0),tk=D.moves.filter(m=>m.job==k.id&&m.item==n.it.id).reduce((t,m)=>t+m.qty,0);
        return a+Math.max(0,nd-tk-rcvJobQty(k.id,n.it.id))},0);
      cover=Math.max(0,n.it.stock-resv)+D.orders.filter(o=>o.item==n.it.id&&kept(o)).reduce((a,o)=>a+cov(o),0);
    }else cover=D.orders.filter(o=>!o.item&&o.key==key&&(kept(o)||o.status=='Ricevuto')).reduce((a,o)=>a+cov(o),0);
    const short=Math.round((n.qty-cover)*1000)/1000, dr=drafts.find(o=>o.key==key);
    if(short>0){
      if(dr){if(dr.qty!=short){dr.qty=short;res.u++}}
      else{const d=new Date(j.due+'T12:00:00');d.setDate(d.getDate()-7);const due=d.toISOString().slice(0,10)<TODAY?TODAY:d.toISOString().slice(0,10);
        const dsp=n.it?(n.it.sup||0):0, ex=D.orders.find(o=>o.auto&&o.job==j.id&&o.status=='Bozza'&&o.po&&ordSup(o)==dsp&&D.orders.filter(x=>x.po==o.po).every(x=>x.job==j.id));
        let pp,pn0,pd;if(ex){pp=ex.po;pn0=ex.poNum;pd=ex.poDate}else{pp=Date.now()+Math.floor(Math.random()*1e6);pn0=poNext();pd=TODAY}
        D.orders.push({po:pp,poNum:pn0,poDate:pd,id:Date.now()+Math.floor(Math.random()*1e6),item:n.it?n.it.id:0,desc:n.it?'':n.desc,um:n.it?'':n.um,sup:n.it?0:0,qty:short,price:n.it?n.it.cost:n.cost,job:j.id,due,status:'Bozza',auto:true,key,note:'Creato dai materiali della commessa '+j.code});res.c++}
    }else if(dr){D.orders=D.orders.filter(o=>o!==dr);res.r++}
  });
  drafts.forEach(dr=>{if(!need.has(dr.key)&&D.orders.includes(dr)){D.orders=D.orders.filter(o=>o!==dr);res.r++}});
  return res;
}

let OM=new Set();
function omOpen(){

function omTog(po,v){if(v===undefined)v=!OM.has(po);v?OM.add(po):OM.delete(po);const e=$('#omc'+po);if(e)e.checked=v}
function omMerge(){
  if(OM.size<2){toast('Spunta almeno due ordini da unire.');return}
  const ids=[...OM],ls=D.orders.filter(o=>OM.has(o.po)&&o.status=='Bozza');
  const keep=ls.slice().sort((a,b)=>(a.poNum||'').localeCompare(b.poNum||''))[0];
  const sps=[...new Set(ls.map(ordSup))],cs=sps.length==1?sps[0]:0;
  ls.forEach(o=>{o.po=keep.po;o.poNum=keep.poNum;o.poDate=keep.poDate;o.sup=cs});
  // articoli con lo stesso codice (o stessa voce libera): una sola riga con le quantità sommate
  const mk=o=>o.item?'i'+o.item:'f|'+(o.code?'c'+String(o.code).trim().toLowerCase():'d'+String(o.desc||'').trim().toLowerCase())+'|'+nu(o.um||'');
  const gm=new Map();ls.forEach(o=>{const k=mk(o);if(!gm.has(k))gm.set(k,[]);gm.get(k).push(o)});
  let nm0=0;
  gm.forEach(a=>{if(a.length<2)return;const k0=a[0];nm0+=a.length-1;
    const q=a.reduce((t,o)=>t+o.qty,0),tot=a.reduce((t,o)=>t+o.qty*o.price,0),sp={};
    a.forEach(o=>{const m=o.split||{[o.job||0]:o.qty};Object.keys(m).forEach(j=>sp[j]=r4((sp[j]||0)+m[j]))});
    const same=a.every(o=>o.uIn!==undefined&&nu(o.uIn)==nu(a[0].uIn));
    if(same){const qi=a.reduce((t,o)=>t+o.qIn,0);k0.qIn=r4(qi);k0.pIn=r4(a.reduce((t,o)=>t+o.qIn*o.pIn,0)/qi)}else{delete k0.qIn;delete k0.uIn;delete k0.pIn}
    k0.qty=r4(q);k0.price=q?r4(tot/q):k0.price;
    k0.lnote=[...new Set(a.map(o=>o.lnote).filter(Boolean))].join(' / ');
    k0.due=a.map(o=>o.due).sort()[0];
    const js=Object.keys(sp);k0.job=js.length==1?+js[0]:0;if(js.length>1)k0.split=sp;else delete k0.split;
    k0.auto=false;k0.src=1;
    a.slice(1).forEach(o=>{D.orders=D.orders.filter(x=>x!==o)})});
  save();const pid=keep.po;$('#dlg').close();render();ordView(pid);if(!cs){PO.sup=0;poForm()}toast('Ordini uniti in '+keep.poNum+(nm0?': '+nm0+(nm0==1?' riga con lo stesso codice è stata sommata':' righe con lo stesso codice sono state sommate'):'')+(cs?'.':'. Fornitori diversi: scegli il fornitore e salva.'));
}

async function impRead(f){
  if(/\.xls$/i.test(f.name))throw new Error('Il vecchio formato .xls non è supportato: in Excel scegli «Salva con nome» e poi .xlsx (oppure CSV).');
  const buf=await f.arrayBuffer();

}

const CAT_DEF=['Profilati','Lamiere','Tubolari','Piatti e tondi','Bulloneria','Saldatura e consumabili','Vernici e trattamenti','Ferramenta','Altro'];
let catF='';
const catKey=c=>String(c||'').trim().toLowerCase();
const catName=c=>{const k=catKey(c);if(!k)return '';const d=CAT_DEF.find(x=>catKey(x)==k);if(d)return d;const l=D.items.filter(i=>catKey(i.cat)==k).map(i=>String(i.cat).trim());return l.find(x=>x!==x.toLowerCase())||l[0]||String(c).trim()};
function catList(){const m=new Map();CAT_DEF.forEach(c=>m.set(catKey(c),c));D.items.forEach(i=>{const k=catKey(i.cat);if(k&&!m.has(k))m.set(k,String(i.cat).trim())});return [...m.values()].sort((a,b)=>a.localeCompare(b,'it'))}
function catGroups(a){const g=new Map();a.forEach(x=>{const k=catKey(x.cat);if(!g.has(k))g.set(k,{n:k?catName(x.cat):'Senza categoria',a:[]});g.get(k).a.push(x)});
  return [...g.entries()].sort((p,q)=>(p[0]===''?1:0)-(q[0]===''?1:0)||p[1].n.localeCompare(q[1].n,'it')).map(e=>{e[1].a.sort((x,y)=>String(x.code).localeCompare(String(y.code),'it',{numeric:true}));return e[1]})}
function catSet(c){catF=catF===c?'':c;render()}
function list(k){
  const e=E[k]; let a=[...D[e.c]]; if(k=='items')a=a.filter(invVisible); if(k=='sup')a=a.filter(x=>!x.man);
  if(['moves','hours'].includes(k))a.sort((x,y)=>y.date.localeCompare(x.date)); if(k=='orders')a.sort((x,y)=>x.due.localeCompare(y.due));
  const grp=(k=='items'||k=='prod');let chips='',gh=null;
  if(grp){const gs=catGroups(a);if(catF&&!gs.some(g=>g.n==catF))catF='';
    chips=gs.length>1?`<div class="cchips"><button class="${catF?'':'on'}" onclick="catSet('${catF.replace(/'/g,"\\'")}')">Tutte (${a.length})</button>${gs.map(g=>`<button class="${catF==g.n?'on':''}" onclick="catSet('${g.n.replace(/'/g,"\\'")}')">${esc(g.n)} (${g.a.length})</button>`).join('')}</div>`:'';
    gh=gs.filter(g=>!catF||g.n==catF)}
  const rowH=x=>`<tr ${k=='items'?'':`class="row" onclick="${k=='cl'||k=='sup'?'anOpen':'ed'}('${k}',${x.id})"`} ${k=='items'&&incoming(x).length?'style="background:rgba(255,212,59,.35)" title="Ordinato al fornitore: merce in arrivo"':''}>${e.r(x).map(c=>`<td>${c}</td>`).join('')}</tr>`;
  const rows=grp&&gh?gh.map(g=>`<tr class="grp"><td colspan="${e.h.length}">${esc(g.n)}<small>${g.a.length} ${g.a.length==1?'articolo':'articoli'}</small></td></tr>`+g.a.map(rowH).join('')).join(''):a.map(rowH).join('');
  return `${chips}<div class="tools"><input id="lq" placeholder="Cerca" style="flex:1;min-width:200px"><button class="b" onclick="pdfSection('${k}')">Esporta PDF</button>${k=='items'?`${lv('rcv')>0?'<button class="b" onclick="goView(\'rcv\')">Carico merce</button>':''}${lv('moves')>0?'<button class="b" onclick="goView(\'moves\')">Scarico merce</button>':''}<button class="b" onclick="rtOpen()">Rettifica giacenze</button><button class="b" onclick="invOpen()">Inventario a una data</button><button class="b" onclick="slOpen()">Storico movimenti</button><label style="display:inline-flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" ${invZ?'checked':''} onchange="invZ=this.checked;render()"> Mostra anche esauriti</label>`:''}${k=='items'?'':`<button class="b pri" onclick="ed('${k}')">${e.nw}</button>`}</div>${k=='items'?'<div class="mut" style="margin:0 0 6px">Sono mostrati solo gli articoli con giacenza di almeno 1. Le giacenze si modificano solo con «Rettifica giacenze», «Carico merce» e «Scarico merce». Le caratteristiche dei prodotti si cambiano da Magazzino › Prodotti.</div>':''}
  <div class="tw"><table id="lt"><thead><tr>${e.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${a.length?rows:`<tr><td colspan="${e.h.length}" class="empty">Ancora nessun dato. Usa il pulsante in alto per aggiungerne.</td></tr>`}</tbody></table></div>`;
}

function ed(k,id){
  if(k=='orders')return editOrder(id);

  const e=E[k], old=id?D[e.c].find(x=>x.id==id):null, rec=old||{};

  if(k=='prod'&&rec.ca===undefined)rec.ca=(rec.uc&&+rec.fc>0)?r4((+rec.cost||0)*rec.fc):(+rec.cost||0);
  const blocked=old&&e.use&&e.use(old);
  $('#dlg').oninput=null;
  $('#dlg').innerHTML=`<div class="dh"><h2>${old?'Modifica':e.nw}</h2></div><div class="db">${e.f.map(f=>f.t=='sel'?S(f.k,f.l,f.o(),rec[f.k]):f.t=='item'?IC(f.k,f.l,rec[f.k]):(k=='prod'&&f.k=='cat'?F(f.k,f.l,rec[f.k],'text','').replace('<input ','<input list="catdl" autocomplete="off" '):F(f.k,f.l,rec[f.k],f.t||'text',f.full?'class="full"':''))).join('')}<datalist id="catdl">${catList().map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="artlist">${D.items.map(i=>`<option value="${esc(i.code)}">${esc(i.desc)}</option>`).join('')}</datalist></div>

  $('#dlg').showModal();
  if(k=='prod'){const cp=()=>{const g=i=>$('#'+i).value,ca=+g('ca')||0,uc=g('uc').trim(),pc=+g('pc')||0,fc=pc>0?1/pc:(+g('fc')||0),um=g('um');const el=$('#costprev');if(el)el.textContent=(uc&&fc>0&&nu(uc)!=nu(um))?'Costo in inventario (per '+um+'): '+eur2(ca/fc):''};
    $('#ca').insertAdjacentHTML('afterend','<small class="mut" id="costprev"></small>');$('#dlg').oninput=cp;cp();
    PRID=id||0;CODE_AUTO=old?'\u0000':'';const c=$('#code'),d=$('#desc');

    d.addEventListener('input',()=>codeAuto(false));
    $('#dlg .df').insertAdjacentHTML('afterbegin','<button class="b l" type="button" onclick="codeAuto(true)">Genera codice dalla descrizione</button>')}
}
function sv(k,id){
  const e=E[k], old=id?D[e.c].find(x=>x.id==id):null, r={};
  for(const f of e.f){
    const v=$('#'+f.k).value;
    if(f.t=='item'){const it=findItem(v);if(!it){alert('Articolo non trovato: digita un codice presente in Inventario.');return}r[f.k]=it.id}
    else r[f.k]=(f.t=='number'||f.id)?+v:v;
  }
  if(e.c=='items'&&r.uc!==undefined){
    if(String(r.uc).trim()&&nu(r.uc)==nu(r.um)){r.uc='';r.fc=0;r.pc=0}
    if(String(r.uc).trim()){
      if(!(+r.pc>0)&&!(+r.fc>0)&&nu(r.uc)=='kg'&&+r.kg>0)r.pc=+r.kg;
      if(+r.pc>0)r.fc=1/+r.pc;
      else if(+r.fc>0)r.pc=0;
      else{alert('Indica la conversione: quante '+String(r.uc).trim()+' ci sono in 1 '+r.um+' (oppure quante '+r.um+' sono 1 '+String(r.uc).trim()+').');return}
    }else{r.pc=0;r.fc=0}
  }
  if(r.ca!==undefined)r.cost=(r.uc&&+r.fc>0)?r4((+r.ca||0)/+r.fc):(+r.ca||0);
  if(e.req&&!String(r[e.req]).trim()){alert('Compila il campo obbligatorio prima di salvare.');return}
  if(e.c=='items'&&D.items.some(x=>x.id!=id&&x.code.trim().toLowerCase()==String(r.code).trim().toLowerCase())){alert('Esiste già un articolo con il codice «'+String(r.code).trim()+'»: scegli un codice diverso.');return}
  if(old){e.ap&&e.ap(old,-1);Object.assign(old,r);e.ap&&e.ap(old,1)}else{r.id=Date.now();D[e.c].push(r);e.ap&&e.ap(r,1)}
  save();$('#dlg').close();render();
}

function smartCode(desc){

  if(!pfx&&words[0])pfx=words[0].slice(0,3);
  let suf='';
  let m=/\bM\s?(\d{1,3})(?:\s*X\s*(\d+(?:\.\d+)?))?\b/.exec(t);
  if(m)suf='M'+m[1]+(m[2]?'X'+num(m[2]):'');

function bulgePts(x1,y1,x2,y2,b){

function dxfParse(txt){

  let sec='',cur=null,pol=null,z='';

  const polyEnt=(ly,v,cl)=>{
    if(v.length<2)return;const p=[],n=v.length;
    for(let i=0;i<n;i++){p.push(v[i].x,v[i].y);if(v[i].b&&(i<n-1||cl)){const w=v[(i+1)%n];p.push(...bulgePts(v[i].x,v[i].y,w.x,w.y,v[i].b))}}

    add({t:'P',ly,c:cl?1:0,p})};

    if(!cur)return;const c=cur;cur=null;
    if(c.t=='LINE')add({t:'P',ly:c.ly,c:0,p:[c.x1,c.y1,c.x2,c.y2]});
    else if(c.t=='LWPOLYLINE')polyEnt(c.ly,c.v,c.f&1);
    else if(c.t=='POLYLINE'){c.v=[];pol=c}
    else if(c.t=='VERTEX'){if(pol&&!((c.f||0)&(16|64|128)))pol.v.push({x:c.x,y:c.y,b:c.b||0})}
    else if(c.t=='CIRCLE')add({t:'C',ly:c.ly,p:[c.x,c.y],r:c.r});

      else if(val=='SECTION'){z='SECTION'}
      else if(val=='ENDSEC'){sec='';pol=null}
      else if(sec=='ENTITIES'){
        if(['LINE','LWPOLYLINE','POLYLINE','VERTEX','CIRCLE','ARC'].includes(val))cur={t:val,ly:'0',v:[],f:0};
        else if(SK.has(val))skip[val]=(skip[val]||0)+1}
      if(val!='SECTION')z='';
    }else if(z=='SECTION'&&code===2){sec=val;z=''}
    else if(cur){
      const n=parseFloat(val),t=cur.t;
      if(code===8)cur.ly=val;else if(code===70)cur.f=parseInt(val)||0;
      else if(t=='LINE'){if(code==10)cur.x1=n;else if(code==20)cur.y1=n;else if(code==11)cur.x2=n;else if(code==21)cur.y2=n}
      else if(t=='LWPOLYLINE'){if(code==10)cur.v.push({x:n,y:0,b:0});else if(code==20&&cur.v.length)cur.v[cur.v.length-1].y=n;else if(code==42&&cur.v.length)cur.v[cur.v.length-1].b=n}
      else if(t=='VERTEX'){if(code==10)cur.x=n;else if(code==20)cur.y=n;else if(code==42)cur.b=n}
      else if(t=='CIRCLE'||t=='ARC'){if(code==10)cur.x=n;else if(code==20)cur.y=n;else if(code==40)cur.r=n;else if(code==50)cur.a1=n;else if(code==51)cur.a2=n}
    }
  }
  fin();
  if(!ents.length)throw new Error('Nel file non ho trovato linee, polilinee, cerchi o archi da leggere.');
  return{ents,layers,skip};
}

function shViews(ents){

  const cl=(ix,ax,gap)=>{const s=[...ix].sort((p,q)=>bbs[p][ax]-bbs[q][ax]),o=[];let g=[s[0]],end=bbs[s[0]][ax+2];
    for(let k=1;k<s.length;k++){const i=s[k];if(bbs[i][ax]-end>gap){o.push(g);g=[i];end=bbs[i][ax+2]}else{g.push(i);end=Math.max(end,bbs[i][ax+2])}}o.push(g);return o};

function shSuggest(ents,W,H){

    const L=Math.max(c.w,c.h),S=Math.min(c.w,c.h);

    out.push({inc:1,desc:ty=='Traverso'?'Traverso '+R(L):'Elemento '+R(c.w)+' x '+R(c.h),type:ty,qty:c.n,len:R(L),sec:R(c.w)+' x '+R(c.h),mat:'',note:'',_r:c.r})});

        let pr=null;for(let k=0;k<=36;k++){const t=k*Math.PI/18,px=e.p[0]+e.r*Math.cos(t),py=e.p[1]+e.r*Math.sin(t);if(pr){const q=clipR(pr[0],pr[1],px,py,x0,y0,x1,y1);if(q)LN(X(q[0]),Y(q[1]),X(q[2]),Y(q[3]),lw)}pr=[px,py]}return}

  const dimV=(vx,oy,dh,txt)=>{LN(vx,oy,vx,oy+dh,.3);LN(vx-1.8,oy,vx+1.8,oy,.3);LN(vx-1.8,oy+dh,vx+1.8,oy+dh,.3);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(txt,vx-1.2,oy+dh/2+tw(txt,8)/2,{angle:90})};

    doc.setDrawColor(0,0,0);doc.setTextColor(0,0,0);

    // note
    if(nw){const nx=PW-M-NW;LN(nx,M,nx,cy,.5);T('NOTE',nx+3,M+7,10,1);let y=M+14;
      for(const par of nw.split('\n')){for(const ln of doc.splitTextToSize(par||' ',NW-6)){if(y>cy-4)break;T(ln,nx+3,y,9,0);y+=4.6}}}

  });

async function labPdf(){
  const j=shJob(SHW.id),s=SHW.s,L=SHW.lab,P=LAB_FMT.find(x=>x.id==L.fmt)||LAB_FMT[0];
  if(!j||!pdfReady())return;LK_OK=lkSet(j);
  const items=[];
  labList().forEach(({r,i,n})=>{const c=+L.c[i]||0;for(let k=1;k<=c;k++)items.push({r,n,k,c})});
  if(!items.length){toast('Imposta almeno un’etichetta da stampare.');return}
  const roll=!!P.roll,ori=P.w>P.h?'landscape':'portrait';
  const doc=new window.jspdf.jsPDF(roll?{unit:'mm',format:[P.w,P.h],orientation:ori}:{unit:'mm',format:'a4',orientation:'portrait'});
  const per=roll?1:P.cols*P.rows,skip=roll?0:Math.min(L.skip||0,per-1);let pg=0;
  items.forEach((it,idx)=>{
    const slot=skip+idx,page=Math.floor(slot/per);
    while(pg<page){roll?doc.addPage([P.w,P.h],ori):doc.addPage();pg++}
    const q=slot%per,x=roll?0:P.x0+(q%P.cols)*P.px,y=roll?0:P.y0+Math.floor(q/P.cols)*P.py;
    (labPl()?labDrawPl:labDraw)(doc,x,y,P.w,P.h,j,it,L.border);
  });
  await pdfSave(doc,(labPl()?'Etichette_piastre_':'Etichette_')+String(j.code).replace(/[^\w-]+/g,'-')+'.pdf',true);
}
function labDraw(doc,x,y,w,h,j,it,border){
  const r=it.r,sc=Math.max(.7,Math.min(1.6,Math.min(w/70,h/36))),pad=2.2*sc;
  const tx=(t,px,py,sz,b,al)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(sz);doc.setTextColor(0);doc.text(String(t),px,py,al?{align:al}:undefined)};
  const fit=(t,mw,sz,b)=>{t=String(t||'');doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(sz);if(doc.getTextWidth(t)<=mw)return t;while(t.length>1&&doc.getTextWidth(t+'.')>mw)t=t.slice(0,-1);return t+'.'};
  doc.setDrawColor(0);doc.setTextColor(0);
  if(border){doc.setLineWidth(.2);doc.rect(x+.4,y+.4,w-.8,h-.8)}
  const L0=x+pad,R0=x+w-pad,cnt=it.k+'/'+it.c;
  // riga alta: commessa, cliente e numero del pezzo
  tx(cnt,R0,y+h*.15,8.5*sc,1,'right');
  const cw=R0-L0-doc.getTextWidth(cnt)-2;
  tx(fit(j.code+(shCli(j)?'  '+shCli(j):''),cw,8*sc,1),L0,y+h*.15,8*sc,1);
  doc.setLineWidth(.25);doc.line(L0,y+h*.2,R0,y+h*.2);
  // posizione e descrizione
  const bn=String(it.n);tx(bn,L0,y+h*.46,Math.min(22*sc,h*1.05),1);
  const dx=L0+doc.getTextWidth(bn)+2.2*sc;
  const cd=r.code||'',lk=lkOk(r);let cw2=0;if(cd){doc.setFont('helvetica','bold');doc.setFontSize(9*sc);cw2=doc.getTextWidth(cd)+2}
  tx(fit(r.desc||'-',R0-dx-cw2,10*sc,1),dx,y+h*.35,10*sc,1);if(cd)tx(cd,R0,y+h*.35,9*sc,1,'right');
  if(lk.length)tx(fit('COLLEGATO A: '+lk.join(', '),R0-L0,7.5*sc,1),L0,y+h*.95,7.5*sc,1);
  tx(fit([r.type,r.mat,r.sec].filter(Boolean).join(' · '),R0-dx,7.5*sc,0),dx,y+h*.455,7.5*sc,0);
  // schizzo del pezzo con misura e angoli
  const Ln=r.len===''||r.len==null?'':String(r.len).trim(),ay=y+h*.53,ah=lk.length?h*.3:h*.42;
  if(!Ln){tx('misura da definire',(L0+R0)/2,ay+ah/2,7.5*sc,0,'center');return}
  const cl=+r.cl||0,cr=+r.cr||0,hb=Math.min(5*sc,ah*.34),x0=L0+8*sc,x1=R0-8*sc,yb=ay+ah-hb-.8,
    t=a=>Math.min(Math.abs(Math.tan(Math.min(Math.abs(a),80)*Math.PI/180))*hb,(x1-x0)*.3),oL=t(cl),oR=t(cr),
    tl=x0+(cl<0?oL:0),bl=x0+(cl>0?oL:0),tr=x1-(cr<0?oR:0),br=x1-(cr>0?oR:0);
  doc.setLineWidth(.45);doc.line(tl,yb,tr,yb);doc.line(bl,yb+hb,br,yb+hb);doc.line(tl,yb,bl,yb+hb);doc.line(tr,yb,br,yb+hb);
  const qy=yb-2.4*sc;doc.setLineWidth(.25);doc.line(x0,qy,x1,qy);doc.line(x0,qy-1,x0,qy+1);doc.line(x1,qy-1,x1,qy+1);
  tx(Ln+' mm',(x0+x1)/2,qy-.9,9*sc,1,'center');
  if(cl)tx(Math.abs(cl)+'°',x0-1,yb+hb/2+1,7*sc,0,'right');if(cr)tx(Math.abs(cr)+'°',x1+1,yb+hb/2+1,7*sc,0);
}
function labDrawPl(doc,x,y,w,h,j,it,border){
  const p=it.r,sc=Math.max(.7,Math.min(1.6,Math.min(w/70,h/36))),pad=2.2*sc;
  const tx=(t,px,py,sz,b,al)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(sz);doc.setTextColor(0);doc.text(String(t),px,py,al?{align:al}:undefined)};
  const fit=(t,mw,sz,b)=>{t=String(t||'');doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(sz);if(doc.getTextWidth(t)<=mw)return t;while(t.length>1&&doc.getTextWidth(t+'.')>mw)t=t.slice(0,-1);return t+'.'};
  doc.setDrawColor(0);doc.setTextColor(0);
  if(border){doc.setLineWidth(.2);doc.rect(x+.4,y+.4,w-.8,h-.8)}
  const L0=x+pad,R0=x+w-pad,cnt=it.k+'/'+it.c;
  tx(cnt,R0,y+h*.15,8.5*sc,1,'right');
  tx(fit(j.code+(shCli(j)?'  '+shCli(j):''),R0-L0-doc.getTextWidth(cnt)-2,8*sc,1),L0,y+h*.15,8*sc,1);
  doc.setLineWidth(.25);doc.line(L0,y+h*.2,R0,y+h*.2);
  const bn=String(it.n);tx(bn,L0,y+h*.46,Math.min(22*sc,h*1.05),1);
  const dx=L0+doc.getTextWidth(bn)+2.2*sc;
  const cd=p.code||'',lk=lkOk(p);let cw2=0;if(cd){doc.setFont('helvetica','bold');doc.setFontSize(9*sc);cw2=doc.getTextWidth(cd)+2}
  tx(fit(abDim(p)+(p.t?' × '+f1(+p.t):''),R0-dx-cw2,10*sc,1),dx,y+h*.35,10*sc,1);if(cd)tx(cd,R0,y+h*.35,9*sc,1,'right');
  if(lk.length)tx(fit('COLLEGATA A: '+lk.join(', '),R0-L0,7.5*sc,1),L0,y+h*.95,7.5*sc,1);
  tx(fit([p.mat,p.t?f2(abKg(p))+' kg':''].filter(Boolean).join(' · '),R0-dx,7.5*sc,0),dx,y+h*.455,7.5*sc,0);
  const pw=+p.w,pl=abL(p),rn=abRnd(p),ay=y+h*.53,ah=lk.length?h*.3:h*.4,sw=(R0-L0)*.46,sk=Math.min(sw/pw,(ah-1)/pl),dw=pw*sk,dh=pl*sk,ox=L0+(sw-dw)/2,oy=ay+(ah-dh)/2;
  doc.setLineWidth(.4);if(rn)doc.circle(ox+dw/2,oy+dh/2,dw/2,'S');else doc.rect(ox,oy,dw,dh,'S');
  (p.holes||[]).forEach(hh=>{const q=abHP(p,hh);doc.setLineWidth(.2);doc.circle(ox+q[0]*sk,oy+dh-q[1]*sk,Math.max((+hh.d||0)/2*sk,.3),'S')});
  const g={};(p.holes||[]).forEach(hh=>{g[+hh.d]=(g[+hh.d]||0)+1});const lines=Object.keys(g).sort((a,b)=>a-b).map(d=>g[d]+' × Ø'+f1(+d));
  if(!lines.length)lines.push('nessun foro');if(p.note)lines.push(p.note);
  const tx0=L0+sw+3*sc,lh=3.7*sc,max=Math.max(1,Math.floor(ah/lh));
  lines.slice(0,max).forEach((t,i)=>tx(fit(t,R0-tx0,7.5*sc,i==0&&!!(p.holes||[]).length),tx0,ay+3.2*sc+i*lh,7.5*sc,i==0&&!!(p.holes||[]).length));
}

const SH_MAXF=20*1024*1024, shFid=()=>'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const shSize=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const FDB=()=>new Promise((ok,ko)=>{try{const r=indexedDB.open('gc_files_cloud',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}});
let fPut=(id,b)=>FDB().then(db=>new Promise((ok,ko)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(b,id);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error)}));
let fGet=id=>FDB().then(db=>new Promise((ok,ko)=>{const q=db.transaction('f').objectStore('f').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)}));
let fDel=id=>FDB().then(db=>new Promise((ok,ko)=>{const t=db.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error)}));
async function shPdfAdd(f){

    SHW.start=false;SHW.imp=false;SHW.add=false;SHW.page='sheet';SHW.err='';shSave(true);shRender();toast('Disegno PDF archiviato nella scheda.');

async function shFilesAdd(list){

async function sfDown(k,i){const r=await sfGet(k,i);if(!r)return;const u=URL.createObjectURL(r.b);sfSaveAs(u,r.f.name);setTimeout(()=>URL.revokeObjectURL(u),120000)}

const shItemOpts=sel=>[...D.items].sort((a,b)=>String(a.code).localeCompare(String(b.code))).map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.code)} · ${esc(x.desc||'')}${x.dim?' · '+esc(x.dim):''}</option>`).join('');
function shMatSel(i,v){
  const r=SHW.s.rows[i];
  if(!v){delete r.item;shKeep();return}
  const it=D.items.find(x=>x.id==v);if(!it)return;
  r.mat=(it.code+' · '+(it.desc||'')).trim().replace(/ ·$/,'');r.item=it.id;
  if(!r.sec&&it.dim)r.sec=it.dim;
  shKeep();
}
const shSet=(i,k,v)=>{if(k=='mat')delete SHW.s.rows[i].item;SHW.s.rows[i][k]=(k=='qty'||k=='cl'||k=='cr')?(+v||0):v;if(k=='len'||k=='cl'||k=='cr')document.querySelectorAll(`[data-m="${i}"]`).forEach(e=>e.innerHTML=shMini(SHW.s.rows[i]));document.querySelectorAll(`[data-f="${i}_${k}"]`).forEach(e=>{if(e!==document.activeElement)e.value=v})};
function shInc(i,v){SHW.s.rows[i].inc=v?1:0;shKeep()}
const shKeep=()=>{const b=$('#dlg .db'),x=$('#shbox'),y=b?b.scrollTop:0,sl=x?x.scrollLeft:0,st=x?x.scrollTop:0;shRender();const c=$('#dlg .db');if(c)c.scrollTop=y;const x2=$('#shbox');if(x2){x2.scrollLeft=sl;x2.scrollTop=st}};
function shSel(i){SHW.sel=i;shKeep();shUp()}
function shPins(mode,sel){SHW.s.dist=true;SHW.snap=JSON.stringify(SHW.s);SHW.page='pins';SHW.mode=mode||{t:'add'};if(sel!=null)SHW.sel=sel;shRender()}
function shPinsSave(){shSave(true);SHW.multi=[];SHW.page='sheet';SHW.mode=null;SHW.snap=null;shRender();toast('Pallini salvati: ora completa i dati della distinta.')}
function shPinsCancel(){SHW.multi=[];if(SHW.snap)SHW.s=JSON.parse(SHW.snap);SHW.page='sheet';SHW.mode=null;SHW.snap=null;shRender()}
function shMultiTog(i,on){const m=new Set(SHW.multi||[]);on?m.add(i):m.delete(i);SHW.multi=[...m];shKeep()}
function shMultiAll(){const all=SHW.s.rows.map((r,i)=>r.inc?i:-1).filter(i=>i>=0),cur=new Set(SHW.multi||[]);SHW.multi=all.every(i=>cur.has(i))?[]:all;shKeep()}
function shMultiUnplace(){const m=SHW.multi||[],a=SHW.av;m.forEach(i=>{const r=SHW.s.rows[i];if(!r)return;r.refs=(r.refs||[]).filter(z=>z.v!=a);if(a==0)r.refL=null});toast('Pallini tolti da '+m.length+' posizioni (le posizioni restano nella distinta).');SHW.multi=[];shKeep()}
function shMultiDel(){const m=[...(SHW.multi||[])].sort((a,b)=>b-a);if(!m.length)return;askConfirm('Eliminare '+m.length+' posizioni dalla distinta?',()=>{m.forEach(i=>SHW.s.rows.splice(i,1));SHW.multi=[];SHW.sel=null;if(SHW.mode&&SHW.mode.t=='place')SHW.mode={t:'add'};shKeep()})}
function shSelPin(i){SHW.sel=i;shKeep()}
function shAddMode(){SHW.mode=SHW.mode&&SHW.mode.t=='add'?null:{t:'add'};shKeep()}
function sheetZoom(d){SHW.z=d?Math.min(12,Math.max(.5,(SHW.z||1)*(d>0?1.5:1/1.5))):1;shKeep()}
function sheetAv(i){SHW.av=i;SHW.mode=SHW.page=='pins'?{t:'add'}:null;SHW.sel=null;shKeep()}
function shMv(i,d){SHW.multi=[];const a=SHW.s.rows,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];if(SHW.sel===i)SHW.sel=j;else if(SHW.sel===j)SHW.sel=i;shKeep()}
function shDel(i){SHW.multi=[];SHW.s.rows.splice(i,1);if(SHW.sel===i)SHW.sel=null;else if(SHW.sel>i)SHW.sel--;if(SHW.mode&&SHW.mode.t=='place')SHW.mode={t:'add'};shKeep()}
function shAdd(){SHW.s.rows.push({inc:1,desc:'',type:'Altro',qty:1,len:'',cl:0,cr:0,sec:'',mat:'',note:'',refs:[]});SHW.sel=SHW.s.rows.length-1;shKeep()}
const shUp=()=>{const b=$('#dlg .db');if(b){SHW.back=b.scrollTop;b.scrollTop=0}};
const shDown=()=>{const b=$('#dlg .db');if(b&&SHW.back!=null){b.scrollTop=SHW.back;SHW.back=null}};
function shPlace(i){
  if(SHW.page!='pins'){const r=SHW.s.rows[i],q=(r.refs||[])[0];if(q&&!(r.refs||[]).some(z=>z.v==SHW.av))SHW.av=q.v;shPins({t:'place',i},i);return}

const RO_FN=/(bomToStock|opt[A-Z]\w*|phZv|bomAdd|bomDel|bomPick|bomUnit|sd[A-Z]\w*|qSave|qDel|fattRowDel|sal[A-Z]\w*|jh[A-Z]\w*|rvOrdAll|ordBack\w*|om[A-Z]\w*|qcostT|orderReceive|orderPick|nc[A-Z]\w*|lnk[A-Z]\w*|hrAdd|hrDel|saveJob|delJob|sh[A-Z]\w*|rv[A-Z]\w*|rcv(Undo|Open|Edit|Confirm|Manual)|phStep|ordConfirm\w*|oSave|oDel|rt[A-Z]\w*|codeAuto|mv[A-Z]\w*|po[A-Z]\w*|hSave|hDel|fatt(Undo|Save|Done)|convertQuote|qToOrder|jc[A-Z]\w*|xt(Open|Done|Cancel)|resetAll|del|sv)\(/;
const RO_TX=/^\s*(salva|crea|importa|rigenera|aggiungi|elimina|rimuovi|conferma|segna|converti|collega|nuov|\+)/i;
const DEL_FN=/(Del|del)\w*\(/, DEL_TX=/^\s*(elimina|rimuovi)/i;
const KEEP='#q,#fs,#lq,#oq,#qq,#qf';
function applyRO(root){
  if(!ME||ME.role=='admin'||!root)return;
  const ro=lv(view)<2,nd=!canDel(),np=!canPdf();
  root.querySelectorAll('button').forEach(b=>{
    if(b.closest('nav,header'))return;
    const o=b.getAttribute('onclick')||'',t=b.textContent;
    let hide=false;
    if(ro&&(RO_FN.test(o)||RO_TX.test(t)))hide=true;
    if(nd&&(DEL_FN.test(o)||DEL_TX.test(t)))hide=true;
    if(np&&/pdf/i.test(o))hide=true;
    if(b.dataset.h!=(hide?'1':'0')){b.dataset.h=hide?'1':'0';b.style.display=hide?'none':''}
  });
  if(ro)root.querySelectorAll('input,select,textarea').forEach(i=>{if(i.closest('.tools')||i.matches(KEEP)||i.type=='file'||i.disabled)return;i.disabled=true});
}
const _sm=HTMLDialogElement.prototype.showModal;
HTMLDialogElement.prototype.showModal=function(){_sm.call(this);if(this.id=='dlg')applyRO(this)};

async function pwdSave(){

  if(D.users.some(x=>x.id!=id&&x.user==us))return e('Nome utente già in uso.');
  if((!u||p)&&p.length<D.sec.minLen)return e('La password deve avere almeno '+D.sec.minLen+' caratteri.');
  if(u&&u.id==ME.id&&(ro!='admin'||!on))return e('Non puoi togliere il tuo ruolo di amministratore né disattivarti.');

    if(p){u.salt=newSalt();u.hash=await hashPw(p,u.salt);u.must=must?1:0;addLog('Password reimpostata: '+us)}else if(must)u.must=1;

// ================= COPIE DI SICUREZZA (dati + allegati) =================
const BK_K='carp_bklast';
const bkLast=()=>{try{return JSON.parse(localStorage.getItem(BK_K))||null}catch(e){return null}};
const bkSetLast=o=>{try{localStorage.setItem(BK_K,JSON.stringify(o))}catch(e){}};
const BKS={busy:0,info:null,err:''};
const bkDk=()=>!!(window.desktop&&window.desktop.bk);
let bkKeys=()=>FDB().then(db=>new Promise((ok,ko)=>{const q=db.transaction('f').objectStore('f').getAllKeys();q.onsuccess=()=>ok(q.result.map(String));q.onerror=()=>ko(q.error)}));
function bkMeta(){const m={};[D.jobs,D.xsheets].forEach(c=>(c||[]).forEach(x=>(x.docs||[]).forEach(s=>[...(s.pdfs||[]),...(s.files||[])].forEach(f=>{if(f&&f.fid)m[f.fid]={fid:f.fid,name:f.name,size:f.size,type:f.type,job:x.code||x.title||''}}))));return m}
const bkAtt=(keys,meta)=>keys.map(k=>meta[k]||{fid:k,name:k});
const bkDt=t=>{const d=new Date(t);return isNaN(d)?'':d.toLocaleDateString('it-IT')+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})};
const bkMb=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const bkHead=(keys,meta)=>'{"formato":"gc-backup","v":1,"app":'+JSON.stringify(APP_VER)+',"creato":'+JSON.stringify(new Date().toISOString())+',"azienda":'+JSON.stringify((CO().name)||'')+',"dati":'+JSON.stringify(D)+',"allegati":'+JSON.stringify(bkAtt(keys,meta));
// esegue la copia (solo programma installato): allegati nuovi + file dei dati del giorno
async function bkRun(tag){
  if(BKS.busy||!bkDk())return false;
  BKS.busy=1;bkDraw();const prev=bkLast();
  try{
    const B=window.desktop.bk,keys=await bkKeys(),meta=bkMeta();
    const miss=await B.mancanti(keys);let n=0,bytes=0;
    for(const fid of miss){const b=await fGet(fid);if(!b)continue;const buf=new Uint8Array(await b.arrayBuffer());await B.allegato(fid,(meta[fid]||{}).name||fid,buf);n++;bytes+=buf.length}
    const nome=await B.dati(bkHead(keys,meta)+'}',tag||'');
    bkSetLast({t:new Date().toISOString(),ok:1,okT:new Date().toISOString(),nome,att:keys.length,nuovi:n,bytes});
    BKS.err='';
  }catch(e){BKS.err=String(e&&e.message||e);bkSetLast({t:new Date().toISOString(),ok:0,okT:prev&&prev.okT||'',err:BKS.err})}
  BKS.busy=0;await bkInfo();bkDraw();bkWarn();
  return !BKS.err;
}
async function bkInfo(){if(bkDk()){try{BKS.info=await window.desktop.bk.info()}catch(e){}}return BKS.info}
async function bkAuto(){
  if(!bkDk()||BKS.busy||!D||!D.jobs)return;
  const I=await bkInfo();if(!I||I.auto===false)return;
  const l=bkLast();if(l&&l.okT&&new Date(l.okT).toDateString()==new Date().toDateString())return;
  if(l&&!l.ok&&l.t&&Date.now()-new Date(l.t)<10*60*1000)return;
  await bkRun('');
}
// copia manuale per il browser: un solo file (compresso) con dati e allegati
async function bkDownload(){
  if(BKS.busy)return;BKS.busy=1;bkDraw();
  try{
    const keys=await bkKeys(),meta=bkMeta(),parts=[bkHead(keys,meta)+',"blobs":{'];let first=1;
    for(const fid of keys){const b=await fGet(fid);if(!b)continue;const u=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ko(r.error);r.readAsDataURL(b)});parts.push((first?'':',')+JSON.stringify(fid)+':'+JSON.stringify(u));first=0}
    parts.push('}}');
    let blob=new Blob(parts,{type:'application/json'}),ext='json';
    if(window.CompressionStream){try{blob=await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();ext='json.gz'}catch(e){}}
    const d=new Date(),p=n=>String(n).padStart(2,'0'),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`GC-GRE.MO-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.${ext}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    bkSetLast({t:d.toISOString(),ok:1,okT:d.toISOString(),nome:a.download,att:keys.length,nuovi:keys.length,bytes:blob.size});BKS.err='';
  }catch(e){BKS.err=String(e&&e.message||e)}
  BKS.busy=0;bkDraw();bkWarn();
}
// ---- ripristino
async function bkParse(file){
  let buf=new Uint8Array(await file.arrayBuffer()),txt;
  if(buf[0]==0x1f&&buf[1]==0x8b){
    if(!window.DecompressionStream)throw new Error('Questo browser non sa aprire file compressi: usa Chrome o Edge aggiornati.');
    txt=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }else txt=new TextDecoder().decode(buf);
  return bkCheck(JSON.parse(txt));
}
function bkCheck(o){if(!o||o.formato!='gc-backup'||!o.dati||!Array.isArray(o.dati.jobs))throw new Error('Il file non è una copia di sicurezza di questo programma.');return o}
const bkDataUrl=u=>{const i=u.indexOf(','),m=/data:([^;,]*)/.exec(u.slice(0,i)),s=atob(u.slice(i+1)),a=new Uint8Array(s.length);for(let k=0;k<s.length;k++)a[k]=s.charCodeAt(k);return new Blob([a],{type:m?m[1]:''})};
async function bkApply(o,getBlob){
  try{localStorage.setItem('carp_prerestore',localStorage.getItem(KEY)||'')}catch(e){}
  let ok=0,no=0;
  for(const f of (o.allegati||[])){let b=null;try{b=await getBlob(f)}catch(e){}if(b){await fPut(f.fid,b);ok++}else no++}
  D=o.dati;localStorage.setItem(KEY,JSON.stringify(D));
  try{sessionStorage.removeItem('carp_sess')}catch(e){}
  toast('Copia ripristinata ('+ok+' allegati'+(no?', '+no+' non trovati':'')+'). Il programma si riavvia…');
  setTimeout(()=>location.reload(),1800);
}
function bkAskRestore(o,desc,getBlob){
  askConfirm('Ripristinare '+desc+'? Tutti i dati attuali vengono sostituiti da quelli della copia'+(bkDk()?' (prima ne viene salvata una copia di sicurezza)':' (scarica prima una copia se vuoi poterli recuperare)')+'. Il programma si riavvia e dovrai accedere di nuovo.',async()=>{
    try{if(bkDk()){const r=await bkRun('prima-ripristino');if(!r){toast('Copia di sicurezza non riuscita: ripristino annullato.');return}}await bkApply(o,getBlob)}catch(e){toast('Ripristino non riuscito: '+(e&&e.message||e))}});
}
async function bkRestoreFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{const o=await bkParse(f);const b=o.blobs||{};bkAskRestore(o,'la copia del '+bkDt(o.creato)+(o.azienda?' ('+o.azienda+')':''),async a=>b[a.fid]?bkDataUrl(b[a.fid]):null)}catch(e){toast('File non valido: '+(e&&e.message||e))}
}
async function bkRestoreCopy(nome){
  try{const B=window.desktop.bk,o=bkCheck(JSON.parse(await B.leggi(nome)));
    bkAskRestore(o,'la copia del '+bkDt(o.creato),async a=>{const u=await B.leggiAllegato(a.fid);return u?new Blob([u],{type:a.type||''}):null})}catch(e){toast('Copia non leggibile: '+(e&&e.message||e))}
}
async function bkPick(){try{const r=await window.desktop.bk.scegli();if(r){BKS.info=r;bkDraw();toast('Cartella delle copie cambiata.')}}catch(e){toast('Impossibile cambiare cartella.')}}
async function bkOpt(k,v){try{await window.desktop.bk.opzioni({[k]:v});await bkInfo();bkDraw()}catch(e){}}
// ---- avviso in alto se manca la copia da più di 2 giorni (solo amministratore)
function bkWarn(){
  let w=document.getElementById('bkwarn');

  const l=bkLast();let gg=null;
  if(l&&l.okT)gg=Math.floor((Date.now()-new Date(l.okT))/864e5);else if(D&&D.jobs&&D.jobs.length)gg=999;
  const show=ME&&isAdm()&&gg!==null&&gg>=2&&!document.body.classList.contains('lock');
  w.hidden=!show;if(show)w.textContent=gg>=999?'Non è mai stata fatta una copia di sicurezza. Clicca per aprire le Impostazioni.':'Nessuna copia di sicurezza da '+gg+' giorni. Clicca per aprire le Impostazioni.';
}

// ---------- registro dei movimenti di magazzino (storico giacenze) e inventario a una data
// Ogni variazione di giacenza (carico, scarico, rettifica, importazione...) viene registrata in D.sl con data e utente:
// la giacenza a una data qualsiasi è la somma delle variazioni fino a quel giorno. Il registro parte dal primo salvataggio dopo l'attivazione.
const SL_MIN=1; let slCtx='',SLS=null,invZ=false;
const slDay=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const slNid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const slStart=()=>(D.sl||[]).find(x=>x.id==='start');
function slStocks(){const m={};(D.sl||[]).forEach(e=>{if(e.id!=='start')m[e.item]=r4((m[e.item]||0)+(+e.q||0))});return m}
function slSeen(it){if(SLS&&it)SLS[it.id]=r4(+it.stock||0)}
function slDiff(){
  if(!D||!Array.isArray(D.items))return;
  if(!Array.isArray(D.sl))D.sl=[];
  const now=new Date().toISOString(),day=slDay(),who=(typeof ME!=='undefined'&&ME)?ME.user:'';
  if(!slStart()){
    if(window.GC_CLOUD&&!(typeof isAdm=='function'&&isAdm()))return;   // col server l'avvio del registro lo fa l'amministratore
    D.sl.push({id:'start',t:now,d:day,why:'Avvio del registro movimenti'});
    D.items.forEach(i=>{const s=r4(+i.stock||0);if(s)D.sl.push({id:slNid(),t:now,d:day,item:i.id,code:i.code,um:i.um,q:s,s,c:+i.cost||0,why:'Giacenza iniziale',u:who})});
    SLS={};D.items.forEach(i=>SLS[i.id]=r4(+i.stock||0));slCtx='';return}
  if(!SLS)SLS=slStocks();
  const seen=new Set();
  D.items.forEach(i=>{seen.add(String(i.id));const cur=r4(+i.stock||0),prev=SLS[i.id]||0,q=r4(cur-prev);
    if(Math.abs(q)>1e-9){D.sl.push({id:slNid(),t:now,d:day,item:i.id,code:i.code,um:i.um,q,s:cur,c:+i.cost||0,why:slCtx||(q>0?'Carico':'Scarico'),u:who});SLS[i.id]=cur}});
  Object.keys(SLS).forEach(k=>{if(!seen.has(k)){const prev=SLS[k];if(Math.abs(prev)>1e-9){const old=[...D.sl].reverse().find(e=>String(e.item)==k)||{};D.sl.push({id:slNid(),t:now,d:day,item:+k,code:old.code,um:old.um,q:-prev,s:0,c:old.c||0,why:'Articolo eliminato',u:who})}delete SLS[k]}});
  slCtx='';
}
// giacenza di ogni articolo alla fine del giorno indicato
function slAt(date){const m={},c={};(D.sl||[]).forEach(e=>{if(e.id==='start'||e.d>date)return;m[e.item]=r4((m[e.item]||0)+(+e.q||0));c[e.item]=e});return{m,c}}
const invVisible=x=>!x.out&&(invZ||(+x.stock||0)>=SL_MIN);
// ---- finestra: inventario alla data
function invOpen(){
  const st=slStart(),d=$('#dlg');d.oninput=null;d.classList.remove('wide');d.oncancel=null;
  d.innerHTML=`<div class="dh"><h2>Stampa inventario a una data</h2></div><div class="db">
  <label>Giacenze alla data (fine giornata)<input id="iv_d" type="date" value="${slDay()}" max="${slDay()}"></label>
  <label style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="iv_c" checked style="width:auto"> Raggruppa per categoria</label>
  <label style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="iv_v" checked style="width:auto"> Mostra costi e valore</label>
  <div class="full mut">Sono inclusi solo gli articoli con giacenza di almeno ${SL_MIN}. ${st?'Il registro dei movimenti è attivo dal <b>'+dt(st.d)+'</b>: per date precedenti le giacenze non sono disponibili.':'Il registro dei movimenti partirà al prossimo salvataggio: finché non c’è storico si può stampare solo la situazione di oggi.'} I costi sono quelli registrati al momento dell’ultimo movimento dell’articolo.</div><div class="full neg" id="iv_e"></div></div>
  <div class="df"><button class="b" onclick="$('#dlg').close()">Annulla</button><button class="b pri" onclick="invPdf()">Crea PDF</button></div>`;
  d.showModal();
}
async function invPdf(){
  const date=$('#iv_d').value,e=m=>{$('#iv_e').textContent=m};
  if(!date)return e('Scegli una data.');
  if(date>slDay())return e('La data non può essere nel futuro.');
  const st=slStart();
  if(st&&date<st.d)return e('Il registro dei movimenti parte dal '+dt(st.d)+': per '+dt(date)+' non ci sono dati. Scegli una data successiva.');
  if(!st&&date!==slDay())return e('Non esiste ancora uno storico: puoi stampare solo l’inventario di oggi.');
  if(!pdfReady())return;
  const byCat=$('#iv_c').checked,val=$('#iv_v').checked;
  let rows;
  if(st){const {m,c}=slAt(date);rows=Object.keys(m).map(k=>{const it=D.items.find(x=>String(x.id)==k),en=c[k];return{code:it?it.code:(en.code||'?'),desc:it?it.desc:'(articolo eliminato)',um:it?it.um:(en.um||''),cat:it?it.cat:'',s:m[k],cost:en&&en.c!=null?en.c:(it?+it.cost||0:0)}})}
  else rows=D.items.filter(x=>!x.out).map(it=>({code:it.code,desc:it.desc,um:it.um,cat:it.cat,s:+it.stock||0,cost:+it.cost||0}));
  rows=rows.filter(r=>r.s>=SL_MIN);
  if(!rows.length)return e('Alla data scelta non risultano articoli con giacenza.');
  $('#dlg').close();
  const doc=pdfDoc('Inventario al '+dt(date),rows.length+(rows.length==1?' articolo':' articoli')+'   |   Generato il '+today(),false);
  const head=['Codice','Descrizione','UM','Giacenza'].concat(val?['Costo unit.','Valore']:[]),n=head.length;
  const body=[];let tot=0;
  const line=r=>{const v=r.s*r.cost;tot+=v;return [String(r.code),String(r.desc||''),String(r.um||''),fN(r.s)].concat(val?[eur2(r.cost),eur2(v)]:[])};
  const srt=a=>a.sort((x,y)=>String(x.code).localeCompare(String(y.code),'it',{numeric:true}));
  if(byCat)catGroups(rows).forEach(g=>{const sub=g.a.reduce((t,r)=>t+r.s*r.cost,0);body.push([{content:g.n+'  ('+g.a.length+')'+(val?'   -   valore '+eur2(sub):''),colSpan:n,styles:{fontStyle:'bold',fillColor:[225,229,236]}}]);g.a.forEach(r=>body.push(line(r)))});
  else srt(rows).forEach(r=>body.push(line(r)));
  if(val)body.push([{content:'Valore totale delle giacenze',colSpan:n-1,styles:{fontStyle:'bold',halign:'right'}},{content:eur2(tot),styles:{fontStyle:'bold',halign:'right'}}]);
  const cs={3:{halign:'right'}};if(val){cs[4]={halign:'right'};cs[5]={halign:'right'}}
  pdfTbl(doc,head,body,{columnStyles:cs});
  await pdfSave(doc,'Inventario_al_'+date+'.pdf');
}
// ---- finestra: storico dei movimenti
let SLQ={a:'',b:'',q:''};
function slOpen(){SLQ={a:'',b:'',q:''};const d=$('#dlg');d.oninput=null;d.classList.add('wide');d.oncancel=null;
  d.innerHTML=`<div class="dh"><h2>Storico movimenti di magazzino</h2></div><div class="db" style="display:block">
  <div class="tools"><label style="flex-direction:row;gap:6px;align-items:center">Dal <input type="date" id="sl_a"></label><label style="flex-direction:row;gap:6px;align-items:center">al <input type="date" id="sl_b"></label><input id="sl_q" placeholder="Cerca articolo o causale" style="flex:1;min-width:180px"></div>
  <div id="sl_t"></div></div><div class="df"><button class="b" onclick="slPdf()">Esporta PDF</button><button class="b pri" onclick="$('#dlg').close()">Chiudi</button></div>`;
  ['a','b','q'].forEach(k=>$('#sl_'+k).oninput=e=>{SLQ[k]=e.target.value;slDraw()});
  d.showModal();slDraw()}
function slRows(){const q=SLQ.q.toLowerCase();return(D.sl||[]).filter(e=>e.id!=='start'&&(!SLQ.a||e.d>=SLQ.a)&&(!SLQ.b||e.d<=SLQ.b)&&(!q||((e.code||'')+' '+(e.why||'')+' '+(itm(e.item).desc||'')).toLowerCase().includes(q))).sort((x,y)=>String(y.t).localeCompare(String(x.t)))}
function slDraw(){const a=slRows(),st=slStart();
  $('#sl_t').innerHTML=(st?'':'<div class="mut" style="margin:8px 0">Il registro parte al prossimo salvataggio.</div>')+`<div class="tw"><table style="min-width:640px"><thead><tr><th>Data</th><th>Articolo</th><th>Causale</th><th style="text-align:right">Variazione</th><th style="text-align:right">Giacenza dopo</th><th>Utente</th></tr></thead><tbody>${a.slice(0,300).map(e=>`<tr><td>${esc(nowIt?nowIt(e.t):e.d)}</td><td><b>${esc(e.code||'?')}</b> <span class="mut">${esc(itm(e.item).desc||'')}</span></td><td>${esc(e.why||'')}</td><td style="text-align:right" class="${e.q<0?'neg':'pos'}">${e.q>0?'+':''}${fN(e.q)} ${esc(e.um||'')}</td><td style="text-align:right">${fN(e.s)}</td><td>${esc(e.u||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nessun movimento.</td></tr>'}</tbody></table></div>${a.length>300?`<div class="mut">Mostrati i 300 più recenti su ${a.length}: restringi le date o esporta il PDF per averli tutti.</div>`:''}`}
async function slPdf(){const a=slRows();if(!a.length)return alert('Nessun movimento da esportare.');if(!pdfReady())return;
  const doc=pdfDoc('Movimenti di magazzino',a.length+' movimenti'+(SLQ.a||SLQ.b?'   |   Periodo: '+(SLQ.a?dt(SLQ.a):'...')+' - '+(SLQ.b?dt(SLQ.b):'...'):'')+'   |   Generato il '+today(),true);
  pdfTbl(doc,['Data','Articolo','Causale','Variazione','Giacenza dopo','Utente'],a.map(e=>[nowIt?nowIt(e.t):e.d,(e.code||'?')+' '+(itm(e.item).desc||''),e.why||'',(e.q>0?'+':'')+fN(e.q)+' '+(e.um||''),fN(e.s),e.u||'']),{columnStyles:{3:{halign:'right'},4:{halign:'right'}}});
  await pdfSave(doc,'Movimenti_magazzino_'+slDay()+'.pdf')}

// ---------- Impostazioni: assegnazione rapida di categorie e prezzi a più prodotti
let BU={q:'',f:'*',sel:new Set(),mode:'set',val:'',cat:''};
const buSrt=a=>a.sort((x,y)=>String(x.code).localeCompare(String(y.code),'it',{numeric:true}));
function buRows(){const q=BU.q.toLowerCase();return buSrt(D.items.filter(i=>(BU.f=='*'||(BU.f===''?!catKey(i.cat):catKey(i.cat)==catKey(BU.f)))&&(!q||(i.code+' '+i.desc+' '+(i.cat||'')).toLowerCase().includes(q))))}
function buHtml(){
  const cs=catList(),has0=D.items.some(i=>!catKey(i.cat));
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;align-items:end;margin-bottom:10px">
  <label>Cerca<input id="bu_q" value="${esc(BU.q)}" placeholder="Codice, descrizione o categoria" oninput="buQ(this.value)"></label>
  <label>Mostra categoria<select onchange="buF(this.value)"><option value="*" ${BU.f=='*'?'selected':''}>Tutte</option>${has0?`<option value="" ${BU.f===''?'selected':''}>Senza categoria</option>`:''}${cs.filter(c=>D.items.some(i=>catKey(i.cat)==catKey(c))).map(c=>`<option ${catKey(BU.f)==catKey(c)&&BU.f!==''&&BU.f!='*'?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
  <div id="bu_t"></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:12px">
   <div class="tw" style="padding:12px 14px"><b>Assegna una categoria ai selezionati</b>
    <div class="tools" style="margin-top:8px"><input id="bu_c" list="catdl" autocomplete="off" placeholder="Scegli o scrivi una categoria" value="${esc(BU.cat)}" oninput="BU.cat=this.value" style="flex:1;min-width:160px"><button class="b pri" onclick="buCat()">Assegna</button><button class="b" onclick="buCat(1)">Togli categoria</button></div></div>
   <div class="tw" style="padding:12px 14px"><b>Cambia il prezzo unitario dei selezionati</b>
    <div class="tools" style="margin-top:8px"><select id="bu_m" onchange="BU.mode=this.value;buPh()"><option value="set" ${BU.mode=='set'?'selected':''}>Imposta il prezzo a (€)</option><option value="pct" ${BU.mode=='pct'?'selected':''}>Aumenta o diminuisci del (%)</option></select><input id="bu_v" type="number" step="any" value="${esc(BU.val)}" oninput="BU.val=this.value" style="width:130px"><button class="b pri" onclick="buPrice()">Applica</button></div>
    <div class="mut" id="bu_h" style="margin-top:6px"></div></div></div>
  <datalist id="catdl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;
}
function buPh(){const e=$('#bu_h');if(e)e.textContent=BU.mode=='pct'?'Esempio: 5 aumenta del 5%, -10 diminuisce del 10%. Si applica al costo unitario di ogni articolo selezionato.':'Il prezzo è per unità di misura dell’articolo (€/m, €/kg, €/pz...) e diventa lo stesso per tutti i selezionati.'}
function buDraw(){
  const a=buRows(),n=BU.sel.size,all=a.length&&a.every(i=>BU.sel.has(i.id));
  const e=$('#bu_t');if(!e)return;
  e.innerHTML=`<div class="tools" style="margin-bottom:6px"><b>${n}</b> ${n==1?'selezionato':'selezionati'} · ${a.length} ${a.length==1?'prodotto mostrato':'prodotti mostrati'}<span style="flex:1"></span><button class="b" onclick="buClr()" ${n?'':'disabled'}>Deseleziona tutto</button></div>
  <div class="tw" style="max-height:340px;overflow:auto"><table style="min-width:560px"><thead><tr><th style="width:34px"><input type="checkbox" ${all?'checked':''} onchange="buAll(this.checked)" title="Seleziona tutti i mostrati"></th><th>Codice</th><th>Descrizione</th><th>Categoria</th><th style="text-align:right">Prezzo unitario</th></tr></thead><tbody>${a.slice(0,500).map(i=>`<tr><td><input type="checkbox" ${BU.sel.has(i.id)?'checked':''} onchange="buTog(${i.id},this.checked)"></td><td><b>${esc(i.code)}</b></td><td>${esc(i.desc)}</td><td>${esc(catName(i.cat))||'<span class="mut">-</span>'}</td><td style="text-align:right">${eur2(i.cost)}/${esc(i.um)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nessun prodotto.</td></tr>'}</tbody></table></div>${a.length>500?`<div class="mut">Mostrati i primi 500: usa la ricerca o il filtro per restringere.</div>`:''}`;
}
function buInit(){buDraw();buPh()}
function buQ(v){BU.q=v;buDraw()}
function buF(v){BU.f=v;buDraw()}
function buTog(id,on){on?BU.sel.add(id):BU.sel.delete(id);buDraw()}
function buAll(on){buRows().forEach(i=>on?BU.sel.add(i.id):BU.sel.delete(i.id));buDraw()}
function buClr(){BU.sel.clear();buDraw()}
function buBox(){const e=$('#bubox');if(e){e.innerHTML=buHtml();buInit()}}
const buSelItems=()=>D.items.filter(i=>BU.sel.has(i.id));
function buCat(clear){
  const a=buSelItems();if(!a.length)return toast('Seleziona almeno un prodotto.');
  const c=clear?'':catName(BU.cat)||String(BU.cat||'').trim();
  if(!clear&&!c)return toast('Scrivi o scegli la categoria da assegnare.');
  askConfirm(clear?'Togliere la categoria a '+a.length+(a.length==1?' prodotto?':' prodotti?'):'Assegnare la categoria «'+c+'» a '+a.length+(a.length==1?' prodotto?':' prodotti?'),()=>{
    a.forEach(i=>{if(c)i.cat=c;else delete i.cat});addLog((clear?'Categoria tolta a ':'Categoria «'+c+'» assegnata a ')+a.length+' prodotti');save();BU.sel.clear();BU.cat='';buBox();toast('Fatto: '+a.length+(a.length==1?' prodotto aggiornato.':' prodotti aggiornati.'))})}
function buPrice(){
  const a=buSelItems();if(!a.length)return toast('Seleziona almeno un prodotto.');
  const v=parseFloat(String(BU.val).replace(',','.'));
  if(!isFinite(v)||BU.val==='')return toast('Scrivi il valore da applicare.');
  if(BU.mode=='set'&&v<0)return toast('Il prezzo non può essere negativo.');
  if(BU.mode=='pct'&&v<=-100)return toast('Una diminuzione del 100% o più azzera i prezzi: scegli un valore maggiore di -100.');
  const np=i=>Math.round((BU.mode=='set'?v:(+i.cost||0)*(1+v/100))*1e4)/1e4;
  const ex=a[0];
  askConfirm((BU.mode=='set'?'Impostare a '+eur2(v)+' il prezzo unitario di ':'Cambiare del '+(v>0?'+':'')+String(v).replace('.',',')+'% il prezzo unitario di ')+a.length+(a.length==1?' prodotto':' prodotti')+'? Esempio: '+ex.code+' passa da '+eur2(ex.cost)+' a '+eur2(np(ex))+'/'+ex.um+'.',()=>{
    a.forEach(i=>{const p=np(i);i.cost=p;i.ca=(i.uc&&+i.fc>0)?r4(p*i.fc):p});
    addLog('Prezzo unitario '+(BU.mode=='set'?'impostato a '+eur2(v):'variato del '+v+'%')+' su '+a.length+' prodotti');save();BU.sel.clear();BU.val='';buBox();toast('Prezzi aggiornati su '+a.length+(a.length==1?' prodotto.':' prodotti.'))})}

// ---------- Anagrafica: scheda di cliente / fornitore con tutto ciò che li riguarda
let AN={k:'cl',id:0,tab:''};
function anData(){
  const id=AN.id;

const AUTO_SAVE=/^(sv\(|saveJob\(|qSave\([^,]*\)$|oSave\(|hSave\(|jhSave\()/;

(function(){

})();

<script>
/* ===== MODALITÀ SERVER (Supabase): accesso, dati condivisi, allegati, utenti ===== */
(function(){
const C=window.GC_CLOUD;if(!C)return;
const API=C.url.replace(/\/+$/,''),PK=C.key,SK='gc_cloud_session',DOM='@gc-gremo.app';
const COLL=['cl','sup','items','jobs','quotes','orders','moves','hours','rcv','xsheets','sl'];
const NOCONF=new Set([...COLL,'users','roles','log']);
let SES=null,SYNC={},CONFV=null,WM='',PEND=[],pushing=0,again=0,pushT=null,pollT=null,authT=null,online=true,errCnt=0,LOADED=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const setRoles=ro=>{D.roles=ro.map(r=>({id:r.id,name:r.nome,del:r.puo_eliminare?1:0,pdf:r.puo_pdf?1:0,perm:r.perm||{}}));try{authInit()}catch(e){}};
const jstr=x=>JSON.stringify(x);
/* ---------- HTTP ---------- */
class HErr extends Error{constructor(st,msg,code){super(msg);this.status=st;this.code=code}}
async function http(path,o={}){
  const h=Object.assign({apikey:PK},o.headers||{});
  if(o.auth!==false){h.Authorization='Bearer '+((SES&&SES.access_token)||PK)}
  if(o.json!==undefined){h['Content-Type']='application/json'}
  let r;
  try{r=await fetch(API+path,{method:o.method||'GET',headers:h,body:o.json!==undefined?jstr(o.json):o.body})}
  catch(e){throw new HErr(0,'Nessuna connessione al server.','net')}
  if(r.status==401&&o.auth!==false&&SES&&!o._retry){if(await refresh())return http(path,Object.assign({},o,{_retry:1}))}
  if(!r.ok){let m='',c='';try{const j=await r.json();m=j.message||j.msg||j.error_description||j.errore||j.error||'';c=j.code||''}catch(e){}throw new HErr(r.status,m||('Errore '+r.status),c)}
  if(o.raw)return r;
  const t=await r.text();return t?JSON.parse(t):null;
}
const rest=(q,o)=>http('/rest/v1/'+q,o);
/* ---------- sessione ---------- */
function saveSes(){try{if(SES)localStorage.setItem(SK,jstr({a:SES.access_token,r:SES.refresh_token,e:SES.expires_at,u:SES.user&&SES.user.id}));else localStorage.removeItem(SK)}catch(e){}}
function setSes(j){SES={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user||(SES&&SES.user)};saveSes()}
async function refresh(){
  if(!SES||!SES.refresh_token)return false;
  try{const j=await http('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,json:{refresh_token:SES.refresh_token}});setSes(j);return true}
  catch(e){if(e.status>=400&&e.status<500){SES=null;saveSes()}return false}
}
async function ensureFresh(){if(SES&&SES.expires_at-Math.floor(Date.now()/1000)<120)await refresh()}
const emailOf=u=>{u=String(u||'').trim().toLowerCase();return u.includes('@')?u:u+DOM};
/* ---------- indicatore di stato ---------- */
function pill(t,cls){let p=document.getElementById('cst');if(!p){p=document.createElement('div');p.id='cst';p.style.cssText='position:fixed;right:12px;z-index:60;font:600 12px "IBM Plex Sans",system-ui,sans-serif;padding:4px 10px;border-radius:12px;background:#fff;border:1px solid #cdd3d8;color:#1d252c;box-shadow:0 1px 4px rgba(0,0,0,.15);pointer-events:none';document.body.appendChild(p)}
  p.style.bottom=document.getElementById('bb')?'92px':(document.getElementById('sb')?'34px':'12px');p.style.display=(ME&&!document.body.classList.contains('lock'))?'':'none';
  const col={ok:'#2f7d52',busy:'#9a6a00',off:'#b3392f'}[cls];p.innerHTML='<span style="color:'+col+'">●</span> '+t}
const stat=()=>{if(!online)return pill('Senza connessione · '+dirty()+' modifiche in attesa','off');if(pushing||dirty())return pill('Salvataggio…','busy');pill('Sincronizzato','ok')};
/* ---------- conversione D <-> righe ---------- */
const keyOf=it=>String(it.id);
function confObj(){const o={};for(const k of Object.keys(D))if(!NOCONF.has(k))o[k]=D[k];return o}
function ensureIds(coll){const a=D[coll]=D[coll]||[];let mx=Math.max(0,...a.map(x=>+x.id||0));a.forEach(x=>{if(x.id===undefined||x.id===null||x.id==='')x.id=++mx})}
function dirty(){let n=0;for(const c of COLL){const a=D[c]||[],m=SYNC[c]||{},seen=new Set();for(const it of a){const id=keyOf(it);seen.add(id);const s=m[id];if(!s||s.json!==jstr(it))n++}for(const id in m)if(!seen.has(id)&&!m[id].del)n++}
  if(isAdm()&&CONFV&&jstr(confObj())!==CONFV.json)n++;return n}
/* ---------- caricamento ---------- */
async function fetchAll(q){let out=[],off=0;for(;;){const r=await rest(q+(q.includes('?')?'&':'?')+'limit=1000&offset='+off);out=out.concat(r);if(r.length<1000)break;off+=1000}return out}
async function loadAll(){
  const rows=await fetchAll('record?select=coll,id,dati,versione,eliminato,aggiornato&order=coll.asc,aggiornato.asc');
  const nd=emptyData();delete nd.rates;SYNC={};COLL.forEach(c=>{nd[c]=[];SYNC[c]={}});CONFV=null;WM='';
  const cf={};
  for(const r of rows){
    if(!WM||r.aggiornato>WM)WM=r.aggiornato;
    if(r.coll=='conf'){if(!r.eliminato){Object.assign(cf,r.dati);CONFV={v:r.versione,json:''}}continue}
    if(!COLL.includes(r.coll))continue;
    if(r.eliminato){SYNC[r.coll][r.id]={v:r.versione,json:'',del:1};continue}
    nd[r.coll].push(r.dati);SYNC[r.coll][r.id]={v:r.versione,json:jstr(r.dati)};
  }
  D=Object.assign(emptyData(),nd,cf);D.users=[];D.log=[];D.sec=D.sec||{minLen:6,maxFail:5,lockMin:5,idle:30};
  setRoles(await rest('ruoli?select=*'));
  COLL.forEach(c=>{D[c]=D[c]||[];ensureIds(c)});
  migrate();
  // la base di confronto si prende DOPO la migrazione: gli adattamenti automatici non vengono rimandati al server
  COLL.forEach(c=>D[c].forEach(it=>{const s=SYNC[c][keyOf(it)];if(s)s.json=jstr(it)}));
  try{SLS={};D.items.forEach(i=>SLS[i.id]=r4(+i.stock||0))}catch(e){}
  if(CONFV)CONFV.json=jstr(confObj());
  WM=WM?new Date(new Date(WM).getTime()-2000).toISOString():'1970-01-01T00:00:00.000Z';
}
/* ---------- salvataggio ---------- */
function schedule(){clearTimeout(pushT);pushT=setTimeout(push,500);stat()}
async function push(){
  if(!ME||!LOADED)return;if(pushing){again=1;return}
  pushing=1;stat();let denied=0,conflicts=[],netErr=false;
  try{
    await ensureFresh();
    for(const c of COLL){
      ensureIds(c);const a=D[c],m=SYNC[c]=SYNC[c]||{},seen=new Set();
      for(const it of a.slice()){
        const id=keyOf(it);seen.add(id);const js=jstr(it),s=m[id];
        if(s&&!s.del&&s.json===js)continue;
        try{
          if(!s||s.del&&!s.revive){
            if(s&&s.del){const r=await rest('record?coll=eq.'+c+'&id=eq.'+encodeURIComponent(id)+'&versione=eq.'+s.v,{method:'PATCH',json:{dati:it,eliminato:false,versione:s.v},headers:{Prefer:'return=representation'}});
              if(!r||!r.length)throw new HErr(409,'conflitto','P0001');m[id]={v:r[0].versione,json:js}}
            else{const r=await rest('record',{method:'POST',json:{coll:c,id,dati:it},headers:{Prefer:'return=representation'}});m[id]={v:r[0].versione,json:js}}
          }else{
            const r=await rest('record?coll=eq.'+c+'&id=eq.'+encodeURIComponent(id)+'&versione=eq.'+s.v,{method:'PATCH',json:{dati:it,versione:s.v},headers:{Prefer:'return=representation'}});
            if(!r||!r.length){const cur=await rest('record?coll=eq.'+c+'&id=eq.'+encodeURIComponent(id)+'&select=versione,dati,eliminato');
              if(cur&&cur.length&&cur[0].versione!==s.v)throw new HErr(409,'conflitto','P0001');throw new HErr(403,'permesso','42501')}
            m[id]={v:r[0].versione,json:js}
          }
        }catch(e){
          if(e.status===0)throw e;
          if(e.status===409&&e.code==='23505'){await renumber(c,it);again=1;continue}
          if(e.code==='P0001'||e.status===409){conflicts.push([c,id,it]);await takeServer(c,id)}
          else if(e.status===403||e.code==='42501'||/row-level|permission/i.test(e.message||'')){denied++;await takeServer(c,id,true)}
          else throw e;
        }
      }
      for(const id of Object.keys(m)){
        if(seen.has(id)||m[id].del)continue;
        try{const r=await rest('record?coll=eq.'+c+'&id=eq.'+encodeURIComponent(id)+'&versione=eq.'+m[id].v,{method:'PATCH',json:{eliminato:true,versione:m[id].v},headers:{Prefer:'return=representation'}});
          if(!r||!r.length){denied++;await takeServer(c,id,true)}else m[id]={v:r[0].versione,json:'',del:1}}
        catch(e){if(e.status===0)throw e;if(e.code==='42501'||e.status===403||/permesso|permission/i.test(e.message||'')){denied++;await takeServer(c,id,true)}else if(e.code==='P0001'){conflicts.push([c,id,null]);await takeServer(c,id)}else throw e}
      }
    }
    if(isAdm()){const o=confObj(),js=jstr(o);
      if(!CONFV||CONFV.json!==js){try{
        if(!CONFV){const r=await rest('record',{method:'POST',json:{coll:'conf',id:'main',dati:o},headers:{Prefer:'return=representation'}});CONFV={v:r[0].versione,json:js}}
        else{const r=await rest('record?coll=eq.conf&id=eq.main&versione=eq.'+CONFV.v,{method:'PATCH',json:{dati:o,versione:CONFV.v},headers:{Prefer:'return=representation'}});
          if(!r||!r.length){const cur=await rest('record?coll=eq.conf&id=eq.main&select=versione,dati');if(cur&&cur.length){Object.assign(D,cur[0].dati);CONFV={v:cur[0].versione,json:jstr(confObj())};conflicts.push(['conf','main',null])}}
          else CONFV={v:r[0].versione,json:js}}
      }catch(e){if(e.status===0)throw e;if(e.status===409&&!CONFV){await loadConfOnly()}else throw e}}}
    online=true;errCnt=0;
  }catch(e){
    if(e.status===0){online=false;netErr=true}else{console.error('Sincronizzazione',e);errCnt++;toast('Salvataggio sul server non riuscito: '+(e.message||e))}
  }
  pushing=0;
  if(conflicts.length){toast('Alcune voci sono state modificate da un altro utente nel frattempo: sono state ricaricate dal server e le tue ultime modifiche a quelle voci non sono state salvate. Controlla e rifai la modifica.');render()}
  else if(denied){toast('Non hai il permesso di modificare questi dati: la modifica è stata annullata.');render()}
  stat();
  if(again&&!netErr){again=0;schedule()}
}
async function loadConfOnly(){const cur=await rest('record?coll=eq.conf&id=eq.main&select=versione,dati');if(cur&&cur.length){Object.assign(D,cur[0].dati);CONFV={v:cur[0].versione,json:jstr(confObj())}}}
async function takeServer(c,id,quiet){
  const cur=await rest('record?coll=eq.'+c+'&id=eq.'+encodeURIComponent(id)+'&select=versione,dati,eliminato');
  const a=D[c],i=a.findIndex(x=>keyOf(x)==id);
  if(cur&&cur.length&&!cur[0].eliminato){if(i>=0)a[i]=cur[0].dati;else a.push(cur[0].dati);if(c=='items'&&typeof slSeen=='function')slSeen(cur[0].dati);SYNC[c][id]={v:cur[0].versione,json:jstr(cur[0].dati)}}
  else{if(i>=0)a.splice(i,1);SYNC[c][id]={v:cur&&cur.length?cur[0].versione:1,json:'',del:1}}
}
async function renumber(c,it){
  const rem=await rest('record?coll=eq.'+c+'&select=id&order=id.desc&limit=200');
  const mx=Math.max(0,...rem.map(r=>+r.id||0),...D[c].map(x=>+x.id||0));const old=it.id;it.id=mx+1;
  toast('Un altro utente ha creato nello stesso momento un elemento con lo stesso numero: il tuo è stato rinumerato ('+old+' → '+it.id+').');
}
/* ---------- aggiornamento dagli altri utenti ---------- */
const busyUI=()=>!!document.querySelector('dialog[open]')||(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&document.activeElement.closest('#main'));
async function poll(){
  if(!ME||!LOADED||pushing)return;
  try{
    await ensureFresh();
    const q='record?aggiornato=gt.'+encodeURIComponent(WM)+'&select=coll,id,dati,versione,eliminato,aggiornato&order=aggiornato.asc';
    const rows=await fetchAll(q);
    if(!online){online=true;schedule()}
    for(const r of rows){if(!WM||r.aggiornato>WM)WM=new Date(new Date(r.aggiornato).getTime()-2000).toISOString();PEND.push(r)}
    applyPend();
  }catch(e){if(e.status===0){online=false}else console.error('Aggiornamento',e)}
  stat();
}
function applyPend(){
  if(!PEND.length||busyUI()||pushing)return;

  try{
    for(const f of (o.allegati||[])){let b=null;try{b=await getBlob(f)}catch(e){}if(b){await fPut(f.fid,b);ok++}else no++}
    COLL.forEach(c=>{if(c=='sl'&&!Array.isArray(d.sl))return;D[c]=JSON.parse(jstr(d[c]||[]));ensureIds(c)});
    for(const k of Object.keys(d))if(!NOCONF.has(k))D[k]=JSON.parse(jstr(d[k]));
    try{migrate()}catch(e){}
    schedule();const fin=await waitSync();
    try{addLog('Ripristino: '+desc)}catch(e){}
    await loadAll();render();
    toast((fin?'Fatto: ':'Quasi fatto (alcune modifiche sono ancora in invio): ')+'dati caricati sul server ('+ok+' allegati'+(no?', '+no+' non trovati':'')+').');
  }catch(e){toast('Operazione non riuscita: '+(e.message||e)+'. Controlla lo stato e riprova.')}
};
async function safetyCopy(){
  try{if(typeof bkDk=='function'&&bkDk()){const r=await bkRun('prima-ripristino');return !!r}}catch(e){return false}
  try{await bkDownload();return true}catch(e){return false}
}
function askRestore(o,desc,getBlob){
  askConfirm('Caricare sul server '+desc+'? I dati attuali del server vengono sostituiti da quelli della copia per TUTTI gli utenti (prima viene salvata una copia di sicurezza di quelli attuali).',async()=>{
    if(!await safetyCopy())return toast('Copia di sicurezza dei dati attuali non riuscita: operazione annullata.');
    await cloudRestore(o,getBlob,desc)})
}
// accetta sia le copie di questo programma sia il semplice file dati del vecchio programma
async function readAny(file){
  try{return await bkParse(file)}catch(e){
    try{const t=await file.text();const j=JSON.parse(t);if(j&&Array.isArray(j.jobs))return {formato:'gc-backup',dati:j,allegati:[],creato:new Date().toISOString()}}catch(x){}
    throw e}
}
bkRestoreFile=async function(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{const o=await readAny(f);const b=o.blobs||{};askRestore(o,'la copia del '+bkDt(o.creato)+(o.azienda?' ('+o.azienda+')':''),async a=>b[a.fid]?bkDataUrl(b[a.fid]):null)}catch(e){toast('File non valido: '+(e.message||e))}};
window.cloudImportFile=bkRestoreFile;
bkRestoreCopy=async function(nome){
  try{const B=window.desktop.bk,o=bkCheck(JSON.parse(await B.leggi(nome)));
    askRestore(o,'la copia «'+nome+'»',async a=>{const u=await B.leggiAllegato(a.fid);return u?new Blob([u],{type:a.type||''}):null})}catch(e){toast('Copia non leggibile: '+(e.message||e))}};
// dati rimasti in questo computer dal programma precedente (senza server): dati + allegati
function oldIdb(){return new Promise(ok=>{try{const q=indexedDB.open('gc_files');q.onerror=()=>ok(null);q.onupgradeneeded=()=>{q.transaction.abort();ok(null)};q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('f')){db.close();return ok(null)}
  const t=db.transaction('f'),st=t.objectStore('f'),out={};const c=st.openCursor();c.onsuccess=()=>{const cu=c.result;if(cu){out[cu.key]=cu.value;cu.continue()}else{db.close();ok(out)}};c.onerror=()=>{db.close();ok(null)}}}catch(e){ok(null)}})}
window.cloudImportLocal=async function(){
  let raw=null;try{raw=localStorage.getItem('carp_proto_v2')}catch(e){}
  if(!raw)return toast('Su questo computer non ci sono dati del programma precedente.');
  let dati;try{dati=JSON.parse(raw)}catch(e){return toast('I dati locali non sono leggibili.')}
  if(!dati||!Array.isArray(dati.jobs))return toast('I dati locali non sono validi.');
  const idb=await oldIdb()||{};const fids=Object.keys(idb);
  const o={formato:'gc-backup',dati,allegati:fids.map(fid=>({fid})),creato:new Date().toISOString()};
  askRestore(o,'i dati di questo computer ('+(dati.jobs.length)+' commesse, '+fids.length+' allegati)',async a=>{const v=idb[a.fid];return v instanceof Blob?v:(v&&v.blob instanceof Blob?v.blob:null)});
};
/* ---------- scheda «Server» nelle Impostazioni ---------- */
const _sv=settingsView;
settingsView=function(){
  const card=`<div class="tw" style="padding:14px 16px;margin-bottom:16px"><h3 style="margin:0 0 4px">Server condiviso</h3><div class="mut" style="margin-bottom:10px">I dati sono salvati sul server e condivisi con tutti gli utenti collegati.</div>
  <div>Server: <code>${esc(API.replace(/^https?:\/\//,''))}</code> · utente: <b>${esc(ME.name)}</b></div>
  <div class="tools" style="margin-top:10px"><button class="b" onclick="cloudImportLocal()">Porta sul server i dati di questo computer</button> <label class="b" style="cursor:pointer;display:inline-block">Carica da un file di copia…<input type="file" accept=".json,.gz,application/json,application/gzip" hidden onchange="cloudImportFile(this)"></label></div>
  <div class="mut">Serve la prima volta, per portare sul server i dati del programma usato finora (anche da un file di copia). Sostituisce i dati del server; prima ne viene salvata una copia.</div></div>`;
  return card+_sv.apply(this,arguments)};
const _ba=bkAuto;bkAuto=async function(){if(!LOADED)return;return _ba.apply(this,arguments)};
/* ---------- avvio ---------- */
(async function boot(){
  ME=null;
  try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s&&s.r){SES={access_token:s.a,refresh_token:s.r,expires_at:s.e,user:{id:s.u}}}}catch(e){}
  if(SES){
    lockUI(true);$('#lg').innerHTML='<div class="lgc"><p class="mut">Connessione al server…</p></div>';
    try{if(SES.expires_at-Math.floor(Date.now()/1000)<120){if(!await refresh())throw new HErr(401,'')}
      const u=await http('/auth/v1/user');SES.user=u;await enterCloud();return}
    catch(e){if(e.status!==0){SES=null;saveSes()}else{showLoginCloud();setTimeout(()=>{const x=$('#lge');if(x)x.textContent='Server non raggiungibile: controlla la connessione.'},60);return}}
  }
  showLoginCloud();
})();
setInterval(()=>{if(ME)stat()},4000);
})();
</script>
<script>
/* ===== VARIANTE UFFICIO · barra multifunzione, barra di stato, scorciatoie ===== */
(function(){
const IC={dash:'M3 12l9-8 9 8M5 10v10h14V10',jobs:'M4 6h16M4 12h16M4 18h10',quotes:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6',ordc:'M5 4h14v16H5zM9 9h6M9 13h6',sheets:'M4 4h16v16H4zM4 12h16M12 4v16',fatt:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',items:'M3 8l9-5 9 5v12H3zM9 20v-7h6v7',prod:'M12 3l9 5v8l-9 5-9-5V8zM12 12l9-4M12 12v9M12 12L3 8',orders:'M3 5h3l2 11h10l2-8H7',hours:'M12 7v5l3 2M21 12a9 9 0 11-18 0 9 9 0 0118 0z',cl:'M16 11a4 4 0 10-8 0 4 4 0 008 0zM4 21c1-4 4-6 8-6s7 2 8 6',sup:'M3 7h11v9H3zM14 10h4l3 3v3h-7zM7 19a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM17 19a1.5 1.5 0 100-3 1.5 1.5 0 000 3z',imp:'M12 15a3 3 0 100-6 3 3 0 000 6zM12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1',usr:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',nuovo:'M12 5v14M5 12h14',pdf:'M6 3h9l4 4v14H6zM14 3v5h5',stats:'M4 20V10M10 20V4M16 20v-8M22 20H2',cerca:'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4'};
const G=[['Cruscotto',[['dash','Cruscotto'],['stats','Statistiche']]],['Commesse',[['jobs','Commesse'],['sheets','Schede'],['quotes','Preventivi'],['ordc','Ordini cl.'],['fatt','Fattura']]],['Magazzino',[['items','Inventario'],['prod','Prodotti'],['orders','Ordini']]],['Personale',[['hours','Ore']]],['Anagrafica',[['cl','Clienti'],['sup','Fornitori']]]];
const ico=(d,c)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
function first(sel,rx){const l=[...document.querySelectorAll(sel)];return rx?l.find(b=>rx.test(b.textContent)):l[0]}
function nuovo(){const b=first('#main button.pri')||first('#main .tools button.b',/^\s*(\+|Nuov|Aggiung|Registra|Crea)/i);if(b)b.click();else if(typeof toast=='function')toast('In questa schermata non c’è nulla da creare.')}
function pdf(){const b=first('#main button',/PDF/i);if(b)b.click();else toast('In questa schermata non c’è un PDF da esportare.')}
function cerca(){const i=document.querySelector('#main input[type=text],#main input:not([type])')||document.querySelector('#main input[type=search]');if(i){i.focus();i.select()}}
window._rbNuovo=nuovo;window._rbPdf=pdf;window._rbCerca=cerca;
function build(){
  if(!ME)return;
  let rb=document.getElementById('rb');
  if(!rb){rb=document.createElement('div');rb.id='rb';document.querySelector('header').insertAdjacentElement('afterend',rb)}
  const vis=v=>v=='usr'?isAdm():v=='stats'?lv('dash')>0:lv(v)>0;
  let h=`<div class="g gr"><div class="bt"><button onclick="_rbNuovo()" title="Nuovo (Ctrl+N)">${ico(IC.nuovo)}Nuovo</button><button onclick="_rbPdf()" class="o" title="Esporta PDF">${ico(IC.pdf)}PDF</button><button onclick="_rbCerca()" title="Cerca (Ctrl+F)">${ico(IC.cerca)}Cerca</button></div><small>Azioni</small></div>`;
  G.forEach(([t,l])=>{const b=l.filter(x=>vis(x[0]));if(b.length)h+=`<div class="g"><div class="bt">${b.map(x=>`<button data-rb="${x[0]}" onclick="goView('${x[0]}')">${ico(IC[x[0]])}${x[1]}</button>`).join('')}</div><small>${t}</small></div>`});

  if(s.length)h+=`<div class="g"><div class="bt">${s.map(x=>`<button data-rb="${x[0]}" onclick="goView('${x[0]}')">${ico(IC[x[0]])}${x[1]}</button>`).join('')}</div><small>Sistema</small></div>`;
  rb.innerHTML=h;
  let sb=document.getElementById('sb');
  if(!sb){sb=document.createElement('div');sb.id='sb';document.body.appendChild(sb)}

}
function label(){if(view=='stats')return 'Cruscotto › Statistiche';for(const t of tabs){if(t.g){const i=t.it.find(x=>x[0]==view);if(i)return t.l+' › '+i[1]}else if(t[0]==view)return t[1]}return ''}
function upd(){
  if(!ME)return;
  document.querySelectorAll('#rb button[data-rb]').forEach(b=>b.classList.toggle('on',b.dataset.rb==view));
  const sb=document.getElementById('sb');if(!sb)return;
  const n=document.querySelectorAll('#main tbody tr').length;
  sb.innerHTML=`<span>Pronto</span><span>${label()}</span>${n?`<span>${n} righe</span>`:''}<span class="r hide">Utente: ${esc(ME.name)} · ${window.GC_CLOUD?"Dati condivisi sul server":"Dati salvati su questo computer"}</span>`;
}
const _ds=dashStats;dashStats=function(){return view=='stats'?_ds.apply(this,arguments):''};
const _bn=buildNav;buildNav=function(){_bn.apply(this,arguments);const f=document.querySelector('#nav>button[data-v="dash"]');if(f&&lv('dash')>0)f.insertAdjacentHTML('afterend','<button data-v="stats">Statistiche</button>');build()};
const _rn=render;render=function(){
  if(ME&&view=='stats'&&lv('dash')>0){qvw='';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v=='stats'));$('#main').innerHTML=_ds();upd();return}
  _rn.apply(this,arguments);upd()};
new MutationObserver(()=>{clearTimeout(window._sbT);window._sbT=setTimeout(upd,60)}).observe(document.getElementById('main'),{childList:true,subtree:true});
document.addEventListener('keydown',e=>{if(!ME||!(e.ctrlKey||e.metaKey))return;if(e.key=='n'||e.key=='N'){e.preventDefault();nuovo()}else if(e.key=='f'||e.key=='F'){if(document.querySelector('#main input')){e.preventDefault();cerca()}}});
if(ME){build();render()}
})();
