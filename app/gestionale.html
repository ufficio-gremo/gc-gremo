*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
header{background:var(--steel);color:var(--steel-ink);padding:14px 20px 0;border-bottom:4px solid var(--acc)}

nav{display:flex;gap:2px;flex-wrap:wrap}.dd{position:relative}.ddm{position:absolute;top:100%;left:0;z-index:20;min-width:180px;background:var(--steel);border:1px solid #3a4a56;border-top:3px solid var(--acc);box-shadow:0 6px 16px rgba(0,0,0,.35);display:flex;flex-direction:column}.ddm[hidden]{display:none}.ddm button{margin-bottom:0;text-align:left;border-bottom:0;border-left:3px solid transparent}.ddm button.on{border-left-color:var(--acc)}

.cd.we{background:rgba(127,127,127,.09)}.cd.tdy{border:2px solid var(--acc)}.cd .dn{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}.cd .dn small{color:var(--mut);font-weight:600}

.kpi{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--steel);padding:12px 16px;border-radius:4px}
.kpi.late{border-left-color:var(--bad)}.kpi.acc{border-left-color:var(--acc)}
.kpi b{display:block;font:700 32px "Barlow Condensed",sans-serif}.kpi span{color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px}
.panel h2{font-size:20px;margin-bottom:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.b{cursor:pointer;font-weight:600}button.pri{background:var(--steel);color:#fff;border-color:var(--steel)}
button.dng{color:var(--bad)}button.b:disabled{opacity:.5;cursor:not-allowed}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--mut);font-size:13px;background:var(--soft)}
tr.grp td{background:var(--soft);font-weight:700;border-top:2px solid var(--line);padding:8px 10px}tr.grp small{font-weight:500;color:var(--mut);margin-left:6px}.cchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.cchips button{border:1px solid var(--line);background:var(--bg,#fff);border-radius:14px;padding:3px 11px;font-size:13px;cursor:pointer}.cchips button.on{background:var(--pri,#1f3a5f);color:#fff;border-color:transparent}
tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:12px;font-weight:600;background:var(--soft);border:1px solid var(--line)}
.tag.late{color:var(--bad);border-color:var(--bad)}.tag.ce{color:var(--ok);border-color:var(--ok)}.p1{color:var(--bad);font-weight:600}
.bar{height:8px;background:var(--soft);border:1px solid var(--line);border-radius:2px;min-width:90px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}.mut{color:var(--mut)}
#ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.ph{display:flex;flex-direction:column;gap:2px;margin:0}.ph span{font-size:12px;color:var(--mut)}
.ph button{width:100%;padding:5px 8px;font-size:13px}.s0{color:var(--mut)}.s1{color:var(--warn);border-color:var(--acc)!important}.s2{color:var(--ok);border-color:var(--ok)!important}
.fase{display:flex;align-items:center;gap:10px;margin:6px 0}.fase span:first-child{width:150px}.fase .bar{flex:1}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:0;width:min(780px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(10,15,20,.55)}
.xclose{position:sticky;top:6px;float:right;z-index:6;width:34px;height:34px;margin:6px 8px -40px 0;border:0;border-radius:6px;background:transparent;color:var(--mut,#566079);font-size:26px;line-height:1;cursor:pointer}.xclose:hover{background:var(--soft);color:var(--ink)}dialog .dh{padding-right:52px}
.dh{padding:14px 20px;border-bottom:1px solid var(--line)}.dh h2{font-size:22px}
.db{padding:16px 20px;overflow:auto;max-height:68vh;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.db label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}.db label input,.db label select,.db label textarea{width:100%;box-sizing:border-box;resize:vertical}

.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}.df .l{margin-right:auto}
.sum{grid-column:1/-1;background:var(--soft);padding:10px 12px;border-radius:4px;display:flex;gap:8px 20px;flex-wrap:wrap}
.chk{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap}
.bom{display:grid;gap:8px}
.bl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--soft);align-items:end}
.bl .w2{grid-column:span 2}.bl .bt{font-size:13px;color:var(--mut)}.bl .bt b{display:block;font-size:15px;color:var(--ink)}
.bl .ba{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.bl .ba button{padding:5px 10px;font-size:13px}.bl .ba .gap{flex:1}
.empty{padding:24px;text-align:center;color:var(--mut)}
.rs td.n,.rs th.n{text-align:right;white-space:nowrap}
.rs td.sec{background:var(--soft);font-weight:600;color:var(--mut);font-size:13px}
.rsn{padding:10px 12px;font-size:13px;color:var(--mut);border-top:1px solid var(--line)}
dialog.wide{width:min(1180px,96vw)}
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;padding:16px 20px}
.rvp{max-height:68vh;overflow:auto;border:1px solid var(--line);border-radius:4px;background:#fff}
.rvp img{width:100%;display:block;border-bottom:1px solid var(--line)}
.rvf{max-height:68vh;overflow:auto;padding-right:4px}
.rvn{background:var(--soft);border-left:4px solid var(--acc);padding:8px 10px;margin-bottom:10px;border-radius:4px}
.rvh{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.rvh label,.bl label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}
.rvh label input,.rvh label select,.bl label input,.bl label select{width:100%}
.rvf>#rvl{display:grid;gap:8px;margin-bottom:10px}
.bl label.cb,.rvf>label.cb{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:600}
.bl label.cb{grid-column:1/-1}.bl label.cb input,.rvf>label.cb input{width:auto}
.rvf>label.cb{display:flex;font-size:13px}
@media(max-width:820px){.rv{grid-template-columns:1fr}.rvp{max-height:34vh}.rvf{max-height:none}}
#toast:not(.on),#toast:empty{display:none!important}
#toast{position:fixed;inset:auto auto 24px 50%;transform:translateX(-50%);margin:0;border:0;border-left:5px solid var(--acc);background:var(--steel);color:#fff;padding:12px 18px;border-radius:6px;max-width:min(560px,92vw);box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:14px}
footer{max-width:1100px;margin:0 auto;padding:0 20px 24px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#me{position:absolute;right:20px;top:14px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.mut2{color:#aebcc6}
header{position:relative}
#lg{position:fixed;inset:0;background:var(--bg,#eef0f2);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}#lg[hidden]{display:none}
.lgc{background:var(--card,#fff);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:4px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.lgc label{display:flex;flex-direction:column;font-size:13px;gap:4px}.lgc input{width:100%;box-sizing:border-box;padding:8px}.lgc p{margin:0}
body.lock header,body.lock main,body.lock footer,body.lock #bkwarn{display:none}
@media(max-width:700px){#me{position:static;margin-bottom:8px;justify-content:flex-start}}
table.dt{width:100%;min-width:1100px;table-layout:fixed;font-size:14px}
table.dt td,table.dt th{padding:6px 6px;vertical-align:middle}
table.dt th{font-size:12px;text-transform:uppercase;letter-spacing:.03em}
table.dt input:not([type=checkbox]){height:36px;font-size:14px;padding:4px 8px;border:1px solid #b9c2c9;border-radius:3px;width:100%;box-sizing:border-box;background:#fff}
table.dt input:not([type=checkbox]):focus{outline:2px solid var(--acc);border-color:var(--acc)}
table.dt tbody tr:nth-child(even){background:#f6f8f9}table.dt tr.sel{background:#fdf0c4!important;box-shadow:inset 4px 0 0 var(--acc)}table.dt tr.off{opacity:.5}
.pn{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border:2px solid #000;border-radius:50%;font-weight:700;font-size:16px;background:#fff}
dialog.full{width:98vw;max-width:98vw}
.pi{display:flex;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;cursor:pointer;background:#fff}.pi.sel{background:#fdf0c4;border-color:var(--acc)}.pi .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi .b{padding:4px 8px;font-size:12px}
th.bsc,td.bsc{width:38px;min-width:38px;max-width:38px;padding-left:10px!important;padding-right:4px!important;text-align:center}
.bsc input{width:18px;height:18px;cursor:pointer;accent-color:var(--acc,#e8772e)}
tr.bss,tr.bss td{background:rgba(232,119,46,.16)!important}
#bsbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:flex;gap:10px;align-items:center;background:#1f2a44;color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#bsbar[hidden]{display:none}#bsbar .b{white-space:nowrap}
.msw{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:4px;overflow:hidden;margin-right:8px;vertical-align:middle}
.msw button{background:transparent;border:0;color:inherit;padding:4px 12px;font:600 13px inherit;cursor:pointer;opacity:.75}.msw button.on{background:var(--acc);color:#1d252c;opacity:1}
#dlg .bt>b{display:block}
.tag.ok{background:rgba(47,125,82,.14);border-color:var(--ok);color:var(--ok)}
</style>
<style id="variante">

function repData(y){

    const m=Array(12).fill(0);rows.forEach(r=>r.m.forEach((v,i)=>m[i]+=v));
    const tot=m.reduce((a,b)=>a+b,0);
    return{op:n,type:opT(n),rows,m,tot,cost:tot*rate(n)};
  }).filter(o=>o.tot>0);
  const m=Array(12).fill(0);ops.forEach(o=>o.m.forEach((v,i)=>m[i]+=v));

const rcvJobQty=(jid,item)=>D.rcv.reduce((a,r)=>a+(r.jx?r.lines.filter(l=>l.job==jid&&l.item==item).reduce((b,l)=>b+l.qty,0):0),0);
function syncOrders(j){
  const need=new Map(), res={c:0,u:0,r:0};
  [...(j.bom||[]),...(j.xBom||[])].forEach(l=>{
    const it=l.item?D.items.find(x=>x.id==l.item):null;
    if(!it&&!String(l.desc||'').trim())return;
    const key=it?'i'+it.id:'f|'+String(l.desc).trim().toLowerCase()+'|'+(l.um||'');
    if(!need.has(key))need.set(key,{it,desc:String(l.desc||'').trim(),um:l.um||'pz',qty:0,cost:+l.cost||0});
    need.get(key).qty+=it?lqB(l):(+l.qty||0);
  });
  const drafts=D.orders.filter(o=>o.auto&&o.job==j.id&&o.status=='Bozza');
  const kept=o=>(o.status=='Ordinato')||(o.status=='Bozza'&&!o.auto), cov=o=>o.split?(o.split[j.id]||0):(o.job==j.id?o.qty:0);
  need.forEach((n,key)=>{
    let cover;
    if(n.it){
      const taken=D.moves.filter(m=>m.job==j.id&&m.item==n.it.id).reduce((a,m)=>a+m.qty,0);
      n.qty=Math.max(0,n.qty-taken-rcvJobQty(j.id,n.it.id));
      // la giacenza serve prima alle commesse create prima di questa e ancora aperte
      const resv=D.jobs.slice(0,Math.max(0,D.jobs.findIndex(x=>x.id==j.id))).filter(k=>!LOCKED.includes(k.status)).reduce((a,k)=>{
        const nd=[...(k.bom||[]),...(k.xBom||[])].filter(l=>l.item==n.it.id).reduce((t,l)=>t+lqB(l),0),tk=D.moves.filter(m=>m.job==k.id&&m.item==n.it.id).reduce((t,m)=>t+m.qty,0);
        return a+Math.max(0,nd-tk-rcvJobQty(k.id,n.it.id))},0);
      cover=Math.max(0,n.it.stock-resv)+D.orders.filter(o=>o.item==n.it.id&&kept(o)).reduce((a,o)=>a+cov(o),0);
    }else cover=D.orders.filter(o=>!o.item&&o.key==key&&(kept(o)||o.status=='Ricevuto')).reduce((a,o)=>a+cov(o),0);
    const short=Math.round((n.qty-cover)*1000)/1000, dr=drafts.find(o=>o.key==key);
    if(short>0){
      if(dr){if(dr.qty!=short){dr.qty=short;res.u++}}
      else{const d=new Date(j.due+'T12:00:00');d.setDate(d.getDate()-7);const due=d.toISOString().slice(0,10)<TODAY?TODAY:d.toISOString().slice(0,10);
        const dsp=n.it?(n.it.sup||0):0, ex=D.orders.find(o=>o.auto&&o.job==j.id&&o.status=='Bozza'&&o.po&&ordSup(o)==dsp&&D.orders.filter(x=>x.po==o.po).every(x=>x.job==j.id));
        let pp,pn0,pd;if(ex){pp=ex.po;pn0=ex.poNum;pd=ex.poDate}else{pp=Date.now()+Math.floor(Math.random()*1e6);pn0=poNext();pd=TODAY}
        D.orders.push({po:pp,poNum:pn0,poDate:pd,id:Date.now()+Math.floor(Math.random()*1e6),item:n.it?n.it.id:0,desc:n.it?'':n.desc,um:n.it?'':n.um,sup:n.it?0:0,qty:short,price:n.it?n.it.cost:n.cost,job:j.id,due,status:'Bozza',auto:true,key,note:'Creato dai materiali della commessa '+j.code});res.c++}
    }else if(dr){D.orders=D.orders.filter(o=>o!==dr);res.r++}
  });
  drafts.forEach(dr=>{if(!need.has(dr.key)&&D.orders.includes(dr)){D.orders=D.orders.filter(o=>o!==dr);res.r++}});
  return res;
}

function omMerge(){
  if(OM.size<2){toast('Spunta almeno due ordini da unire.');return}
  const ids=[...OM],ls=D.orders.filter(o=>OM.has(o.po)&&o.status=='Bozza');
  const keep=ls.slice().sort((a,b)=>(a.poNum||'').localeCompare(b.poNum||''))[0];
  const sps=[...new Set(ls.map(ordSup))],cs=sps.length==1?sps[0]:0;
  ls.forEach(o=>{o.po=keep.po;o.poNum=keep.poNum;o.poDate=keep.poDate;o.sup=cs});
  // articoli con lo stesso codice (o stessa voce libera): una sola riga con le quantità sommate
  const mk=o=>o.item?'i'+o.item:'f|'+(o.code?'c'+String(o.code).trim().toLowerCase():'d'+String(o.desc||'').trim().toLowerCase())+'|'+nu(o.um||'');
  const gm=new Map();ls.forEach(o=>{const k=mk(o);if(!gm.has(k))gm.set(k,[]);gm.get(k).push(o)});
  let nm0=0;
  gm.forEach(a=>{if(a.length<2)return;const k0=a[0];nm0+=a.length-1;
    const q=a.reduce((t,o)=>t+o.qty,0),tot=a.reduce((t,o)=>t+o.qty*o.price,0),sp={};
    a.forEach(o=>{const m=o.split||{[o.job||0]:o.qty};Object.keys(m).forEach(j=>sp[j]=r4((sp[j]||0)+m[j]))});
    const same=a.every(o=>o.uIn!==undefined&&nu(o.uIn)==nu(a[0].uIn));
    if(same){const qi=a.reduce((t,o)=>t+o.qIn,0);k0.qIn=r4(qi);k0.pIn=r4(a.reduce((t,o)=>t+o.qIn*o.pIn,0)/qi)}else{delete k0.qIn;delete k0.uIn;delete k0.pIn}

    k0.lnote=[...new Set(a.map(o=>o.lnote).filter(Boolean))].join(' / ');
    k0.due=a.map(o=>o.due).sort()[0];
    const js=Object.keys(sp);k0.job=js.length==1?+js[0]:0;if(js.length>1)k0.split=sp;else delete k0.split;
    k0.auto=false;k0.src=1;
    a.slice(1).forEach(o=>{D.orders=D.orders.filter(x=>x!==o)})});
  save();const pid=keep.po;$('#dlg').close();render();ordView(pid);if(!cs){PO.sup=0;poForm()}toast('Ordini uniti in '+keep.poNum+(nm0?': '+nm0+(nm0==1?' riga con lo stesso codice è stata sommata':' righe con lo stesso codice sono state sommate'):'')+(cs?'.':'. Fornitori diversi: scegli il fornitore e salva.'));
}

  const e=E[k], old=id?D[e.c].find(x=>x.id==id):null, r={};
  for(const f of e.f){
    const v=$('#'+f.k).value;
    if(f.t=='item'){const it=findItem(v);if(!it){alert('Articolo non trovato: digita un codice presente in Inventario.');return}r[f.k]=it.id}
    else r[f.k]=(f.t=='number'||f.id)?+v:v;
  }
  if(e.c=='items'&&r.uc!==undefined){
    if(String(r.uc).trim()&&nu(r.uc)==nu(r.um)){r.uc='';r.fc=0;r.pc=0}
    if(String(r.uc).trim()){
      if(!(+r.pc>0)&&!(+r.fc>0)&&nu(r.uc)=='kg'&&+r.kg>0)r.pc=+r.kg;
      if(+r.pc>0)r.fc=1/+r.pc;
      else if(+r.fc>0)r.pc=0;
      else{alert('Indica la conversione: quante '+String(r.uc).trim()+' ci sono in 1 '+r.um+' (oppure quante '+r.um+' sono 1 '+String(r.uc).trim()+').');return}
    }else{r.pc=0;r.fc=0}
  }
  if(r.ca!==undefined)r.cost=(r.uc&&+r.fc>0)?r4((+r.ca||0)/+r.fc):(+r.ca||0);
  if(e.req&&!String(r[e.req]).trim()){alert('Compila il campo obbligatorio prima di salvare.');return}
  if(e.c=='items'&&D.items.some(x=>x.id!=id&&x.code.trim().toLowerCase()==String(r.code).trim().toLowerCase())){alert('Esiste già un articolo con il codice «'+String(r.code).trim()+'»: scegli un codice diverso.');return}
  if(old){e.ap&&e.ap(old,-1);Object.assign(old,r);e.ap&&e.ap(old,1)}else{r.id=Date.now();D[e.c].push(r);e.ap&&e.ap(r,1)}
  save();$('#dlg').close();render();
}

function bomCode(k,i,v){
  const l=cur[k][i], t=v.trim().toLowerCase();
  if(!t){l.item=0;l.bad='';bomHtml(k);sum();return}
  // prima il codice esatto, poi una ricerca parziale su codice e descrizione se dà un solo risultato
  let it=D.items.find(x=>x.code.toLowerCase()==t);
  if(!it){const m=D.items.filter(x=>(x.code+' '+x.desc).toLowerCase().includes(t));if(m.length==1)it=m[0]}
  if(it){l.item=it.id;l.desc=it.desc;l.um=it.um;l.cost=it.cost;l.bad=''}
  else{l.item=0;l.bad='Codice «'+v.trim()+'» non trovato in magazzino: la riga resta una voce libera.'}
  bomHtml(k);sum();
}
function bomUnit(k,i,u){
  const l=cur[k][i],it=itm(l.item);if(!it.id)return;
  const a=bpu(it,l.um),b=bpu(it,u);if(!a||!b){l.um=u;bomHtml(k);sum();return}
  l.qty=r4((+l.qty||0)*a/b);l.cost=r4((+l.cost||0)*b/a);l.um=u;bomHtml(k);sum();
}

function bomToStock(k,i){

  if(ex){l.item=ex.id;l.desc=ex.desc;l.um=ex.um;l.bad='';bomHtml(k);sum();toast('Esisteva già l’articolo '+ex.code+': la riga ora è collegata al magazzino.');return}

  const it={id:Date.now(),code,desc:d,um:l.um||'pz',stock:0,min:0,cost:+l.cost||0,sup:0};
  D.items.push(it);l.item=it.id;l.bad='';save();bomHtml(k);sum();

function bomPick(k,i){

  const res=Math.max(lqB(l)-withdrawn(l,k),0), q=Math.min(res,it.stock);

}

function pdfDoc(title,sub,land){

  doc.pw=doc.internal.pageSize.getWidth();
  doc.setTextColor(0,0,0);doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text(title,14,13);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...PC.mu);doc.text(sub,14,19.5);
  {const i=coInfo();let rx=doc.pw-14;doc.setTextColor(0,0,0);
   if(i.logo){const hh=15,ww=Math.min(hh*i.logo.w/i.logo.h,36),h2=Math.min(hh,ww*i.logo.h/i.logo.w);
     try{doc.addImage(i.logo.d,'PNG',rx-ww,6+(hh-h2)/2,ww,h2)}catch(e){}rx-=ww+5}
   if(i.name){doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(i.name,rx,9.5,{align:'right'});
     doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...PC.mu);let y=13.5;[i.addr,i.fisc,i.cont].filter(Boolean).forEach(t=>{doc.text(t,rx,y,{align:'right'});y+=3.4})}}
  doc.setDrawColor(0,0,0);doc.setLineWidth(.8);doc.line(14,23.5,doc.pw-14,23.5);
  doc.setTextColor(...PC.tx);doc.y=32;return doc;
}

function pdfNote(doc,t){

function pdfFoot(doc){

async function pvJs(){

async function pvOpen(){

  d.innerHTML=`<div class="pvh"><b title="${esc(PV.name)}">${esc(PV.name)}</b><span style="flex:1"></span><button class="b pri" onclick="pvPrint()">Stampa</button><button class="b" onclick="pvSave()">Salva sul PC</button><button class="b" onclick="document.getElementById('pvd').close()">Chiudi</button></div>
   <div class="pvb" id="pvb"><div style="padding:40px;text-align:center;color:#fff">Preparo l’anteprima…</div></div>`;
  d.showModal();const my=PV;

    if(!await pvJs())throw new Error('lettore non disponibile');
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(my.buf.slice(0))}).promise;if(PV!==my)return;my.pdf=pdf;

      const m=document.createElement('div');m.style.cssText='color:#fff;font-size:12px;padding:6px 0';m.textContent='Anteprima semplificata (il lettore PDF non si carica). Puoi comunque stampare o salvare.';b.insertBefore(m,f)}
  }
}

const CODE_PFX=[['TUBOL','TUB'],['TUBO','TUB'],['LAMIER','LAM'],['PIATT','PIA'],['TOND','TON'],['ANGOL','ANG'],['GRIGLIAT','GRIG'],['BULLON','BUL'],['VITE','VIT'],['VITI','VIT'],['DAD','DAD'],['RONDEL','RON'],['FILO','FIL'],['SCATOL','SCA'],['FLANG','FLA'],['TIRAFOND','TIR'],['PROFIL','PRO'],['RETE','RET'],['BARRA','BAR'],['QUADR','QUA'],['CANAL','CAN'],['ELETTROD','ELE'],['DISCO','DIS'],['VERNIC','VER'],['ZINC','ZIN'],['PIASTR','PIA'],['STAFF','STA'],['CERNIER','CER'],['CANCELL','CAN'],['GRIGL','GRIG']];
const CODE_STOP=new Set(['DI','DA','IN','CON','PER','SP','SPESSORE','CL','TIPO','DEL','DELLA','E','A','IL','LA']);
function smartCode(desc){
  const t=String(desc||'').toUpperCase().replace(/[×*]/g,'X').replace(/,/g,'.').replace(/\s+/g,' ').trim();
  if(!t)return '';
  const num=n=>String(parseFloat(n));
  const prof=/\b(HEA|HEB|HEM|IPE|IPN|UPN|UPE|UNP|NP)\s*-?\s*(\d{2,4})\b/.exec(t);
  if(prof)return prof[1]+'-'+prof[2];
  const words=t.replace(/[^A-Z0-9ØÀ-Ü ]/g,' ').split(' ').filter(w=>w.length>=3&&!CODE_STOP.has(w)&&!/^\d/.test(w));
  let pfx='';
  for(const w of words){const m=CODE_PFX.find(p=>w.startsWith(p[0]));if(m){pfx=m[1];break}}
  if(!pfx&&words[0])pfx=words[0].slice(0,3);
  let suf='';
  let m=/\bM\s?(\d{1,3})(?:\s*X\s*(\d+(?:\.\d+)?))?\b/.exec(t);
  if(m)suf='M'+m[1]+(m[2]?'X'+num(m[2]):'');
  else if((m=/(\d+(?:\.\d+)?(?:\s*X\s*\d+(?:\.\d+)?)+)/.exec(t))){let p=m[1].split(/\s*X\s*/).map(num);if(p.length>1&&p[0]==p[1])p.splice(1,1);suf=p.join('X')}
  else if((m=/(?:\bSP\.?|SPESSORE|\bS\.)\s*(\d+(?:\.\d+)?)/.exec(t)))suf=num(m[1]);
  else if((m=/[Ø]\s*(\d+(?:\.\d+)?)|\bD(?:IAM)?\.?\s*(\d+(?:\.\d+)?)/.exec(t)))suf='D'+num(m[1]||m[2]);
  else{const toks=(t.match(/\b[A-Z]{1,3}\d{1,3}\b/g)||[]).filter(x=>!/^S\d{3}/.test(x));
    if(toks.length)suf=toks[0];else if((m=/\b(\d+(?:\.\d+)?)\b/.exec(t)))suf=num(m[1])}
  return (pfx+(suf?'-'+suf:'')).replace(/[^A-Z0-9Ø.\-X]/g,'').slice(0,20)||'';
}

const genCode=d=>smartCode(d)||String(d||'').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,14).replace(/-+$/,'')||'ART-NUOVO';

async function pdfRead(file){
  if(!window.pdfjsLib)throw new Error('pdfjs');
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const use=Math.min(pdf.numPages,4), pages=[], blobs=[], out=[];
  for(let p=1;p<=use;p++){
    const pg=await pdf.getPage(p), vp=pg.getViewport({scale:1.5});
    const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    pages.push(cv.toDataURL('image/jpeg',.85));
    blobs.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)));
    const tc=await pg.getTextContent(), rows={};
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)});
    out.push(Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean).join('\n'));
  }
  return {name:file.name,n:pdf.numPages,pages,blobs,text:out.join('\n\n')};
}

  if(!os.length)return null;

}

function rcvConfirm(force){

    if(!(l.qty>0)){alert('Controlla la quantità di: '+(l.desc||l.code||'riga senza nome'));return}

  }

    const f=(!isNew&&l.um&&nu(l.um)!=nu(it.um)&&bpu(it,l.um))||1, qB=r4((+l.qty||0)*f), pB=r4((+l.price||0)/f);
    const parts=(R.jmode=='line'&&l.alloc&&l.alloc.length>1)?(()=>{const t=l.alloc.reduce((a,x)=>a+x.q,0)||1;let rem=+l.qty;return l.alloc.map((x,ix)=>{const q=ix==l.alloc.length-1?r4(rem):r4(l.qty*x.q/t);rem=r4(rem-q);return{job:x.job,q}})})():[{job:R.jmode=='doc'?R.job:(R.jmode=='line'?(+l.job||0):0),q:+l.qty}];
    const qStock=r4(parts.filter(pt=>!pt.job).reduce((a,pt)=>a+pt.q,0)*f); // solo la parte senza commessa entra in giacenza
    slCtx='Carico merce';it.stock=r4(it.stock+qStock);delete it.out; if(R.upd&&l.price>0){it.cost=pB;it.ca=(it.uc&&+it.fc>0)?r4(pB*it.fc):pB}
    parts.forEach((pt,ix)=>rec.lines.push({item:it.id,code:it.code,desc:l.desc||it.desc,qty:parts.length>1?r4(pt.q*f):qB,um:f!=1?it.um:(l.um||it.um),price:pB,qIn:pt.q,uIn:l.um||it.um,pIn:+l.price||0,created:isNew&&ix==0,job:pt.job}));
  });

function bulgePts(x1,y1,x2,y2,b){
  const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy);if(!d)return[];
  const f=(d/2)*(1-b*b)/(2*b),cx=(x1+x2)/2+(-dy/d)*f,cy=(y1+y2)/2+(dx/d)*f,r=Math.hypot(x1-cx,y1-cy),a1=Math.atan2(y1-cy,x1-cx),sw=4*Math.atan(b);
  const n=Math.max(2,Math.ceil(Math.abs(sw)/(Math.PI/18))),o=[];for(let i=1;i<n;i++){const a=a1+sw*i/n;o.push(cx+r*Math.cos(a),cy+r*Math.sin(a))}return o}
function dxfParse(txt){
  if(/^AutoCAD Binary DXF/.test(txt))throw new Error('Il file è un DXF binario: salvalo come DXF in formato testo (ASCII).');
  const L=txt.split(/\r?\n/),ents=[],layers={},skip={},SK=new Set(['SPLINE','ELLIPSE','INSERT','HATCH','SOLID','3DFACE','TRACE','RAY','XLINE','LEADER']);
  let sec='',cur=null,pol=null,z='';
  const add=e=>{ents.push(e);layers[e.ly]=(layers[e.ly]||0)+1};
  const polyEnt=(ly,v,cl)=>{
    if(v.length<2)return;const p=[],n=v.length;
    for(let i=0;i<n;i++){p.push(v[i].x,v[i].y);if(v[i].b&&(i<n-1||cl)){const w=v[(i+1)%n];p.push(...bulgePts(v[i].x,v[i].y,w.x,w.y,v[i].b))}}
    if(!cl&&n>2&&Math.hypot(v[0].x-v[n-1].x,v[0].y-v[n-1].y)<1e-9){p.length-=2;cl=1}
    add({t:'P',ly,c:cl?1:0,p})};
  const fin=()=>{
    if(!cur)return;const c=cur;cur=null;
    if(c.t=='LINE')add({t:'P',ly:c.ly,c:0,p:[c.x1,c.y1,c.x2,c.y2]});
    else if(c.t=='LWPOLYLINE')polyEnt(c.ly,c.v,c.f&1);
    else if(c.t=='POLYLINE'){c.v=[];pol=c}
    else if(c.t=='VERTEX'){if(pol&&!((c.f||0)&(16|64|128)))pol.v.push({x:c.x,y:c.y,b:c.b||0})}
    else if(c.t=='CIRCLE')add({t:'C',ly:c.ly,p:[c.x,c.y],r:c.r});
    else if(c.t=='ARC'){let s=((c.a2-c.a1)%360+360)%360;if(!s)s=360;const n=Math.max(2,Math.ceil(s/10)),p=[];for(let i=0;i<=n;i++){const a=(c.a1+s*i/n)*Math.PI/180;p.push(c.x+c.r*Math.cos(a),c.y+c.r*Math.sin(a))}add({t:'P',ly:c.ly,c:0,p})}};
  for(let i=0;i+1<L.length;i+=2){
    const code=parseInt(L[i]),val=L[i+1].trim();
    if(code===0){
      fin();
      if(val=='SEQEND'){if(pol){polyEnt(pol.ly,pol.v,pol.f&1);pol=null}}
      else if(val=='SECTION'){z='SECTION'}
      else if(val=='ENDSEC'){sec='';pol=null}
      else if(sec=='ENTITIES'){
        if(['LINE','LWPOLYLINE','POLYLINE','VERTEX','CIRCLE','ARC'].includes(val))cur={t:val,ly:'0',v:[],f:0};
        else if(SK.has(val))skip[val]=(skip[val]||0)+1}
      if(val!='SECTION')z='';
    }else if(z=='SECTION'&&code===2){sec=val;z=''}
    else if(cur){
      const n=parseFloat(val),t=cur.t;
      if(code===8)cur.ly=val;else if(code===70)cur.f=parseInt(val)||0;
      else if(t=='LINE'){if(code==10)cur.x1=n;else if(code==20)cur.y1=n;else if(code==11)cur.x2=n;else if(code==21)cur.y2=n}
      else if(t=='LWPOLYLINE'){if(code==10)cur.v.push({x:n,y:0,b:0});else if(code==20&&cur.v.length)cur.v[cur.v.length-1].y=n;else if(code==42&&cur.v.length)cur.v[cur.v.length-1].b=n}
      else if(t=='VERTEX'){if(code==10)cur.x=n;else if(code==20)cur.y=n;else if(code==42)cur.b=n}
      else if(t=='CIRCLE'||t=='ARC'){if(code==10)cur.x=n;else if(code==20)cur.y=n;else if(code==40)cur.r=n;else if(code==50)cur.a1=n;else if(code==51)cur.a2=n}
    }
  }
  fin();
  if(!ents.length)throw new Error('Nel file non ho trovato linee, polilinee, cerchi o archi da leggere.');
  return{ents,layers,skip};
}
// ---- viste (più disegni nello stesso file)
function shViews(ents){
  const bbs=ents.map(ebb),all=ents.map((e,i)=>i);if(!all.length)return[];
  const ext=ix=>{let a=1e18,b=1e18,c=-1e18,d=-1e18;ix.forEach(i=>{const q=bbs[i];a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3])});return[a,b,c,d]};
  const cl=(ix,ax,gap)=>{const s=[...ix].sort((p,q)=>bbs[p][ax]-bbs[q][ax]),o=[];let g=[s[0]],end=bbs[s[0]][ax+2];
    for(let k=1;k<s.length;k++){const i=s[k];if(bbs[i][ax]-end>gap){o.push(g);g=[i];end=bbs[i][ax+2]}else{g.push(i);end=Math.max(end,bbs[i][ax+2])}}o.push(g);return o};
  const sp=(ix,dep)=>{const b=ext(ix),gap=.05*Math.max(b[2]-b[0],b[3]-b[1]);if(dep>3||!(gap>0))return[ix];
    for(const ax of[1,0]){const g=cl(ix,ax,gap);if(g.length>1)return g.flatMap(x=>sp(x,dep+1))}return[ix]};
  let vs=sp(all,0).filter(g=>g.length>=Math.max(3,ents.length*.02));
  if(!vs.length||vs.length>12)vs=[all];
  return vs.map(ix=>({ix,bb:ext(ix),n:ix.length})).sort((a,b)=>b.n-a.n||b.bb[3]-a.bb[3]);
}
const shGuess=ents=>{let a=1e18,b=1e18,c=-1e18,d=-1e18;ents.forEach(e=>{const q=ebb(e);a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3])});const m=Math.max(c-a,d-b);return m<=60?1000:m<=600?10:1};
// ---- suggerimento righe della distinta
function shSuggest(ents,W,H){
  const mx=Math.max(W,H),R=Math.round,rows=[],cl={},ci={},segs={H:[],V:[]},oth={};
  ents.forEach(e=>{
    if(e.t=='C'){const d=R(e.r*2),k=d;const o=(ci[k]=ci[k]||{n:0,d,r:[]});o.n++;o.r.push([e.p[0],e.p[1]]);return}
    const[x0,y0,x1,y1]=e.p.length?ebb(e):[0,0,0,0],w=x1-x0,h=y1-y0,n=e.p.length/2;
    if(e.c&&n>=3){if(w>.4*W&&h>.4*H&&n>4&&false)return;const k=R(w)+'x'+R(h)+'x'+n;const o=(cl[k]=cl[k]||{n:0,w,h,r:[]});o.n++;o.r.push([(e.p[0]+e.p[2])/2,(e.p[1]+e.p[3])/2]);return}
    for(let i=0;i+3<e.p.length;i+=2){const ax=e.p[i],ay=e.p[i+1],bx=e.p[i+2],by=e.p[i+3],dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);
      if(len<.03*mx)continue;
      if(Math.abs(dy)<.5)segs.H.push({a:Math.min(ax,bx),b:Math.max(ax,bx),c:(ay+by)/2});
      else if(Math.abs(dx)<.5)segs.V.push({a:Math.min(ay,by),b:Math.max(ay,by),c:(ax+bx)/2});
      else{let g=Math.atan2(dy,dx)*180/Math.PI;g=((R(g/5)*5)%180+180)%180;const k=g+'|'+R(len);const o=(oth[k]=oth[k]||{n:0,len,g,r:[]});o.n++;o.r.push([(ax+bx)/2,(ay+by)/2])}}
  });
  const out=[];
  // elementi chiusi
  Object.values(cl).sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h)).forEach(c=>{
    const L=Math.max(c.w,c.h),S=Math.min(c.w,c.h);
    const ty=L>=.8*mx&&S<.12*L?'Traverso':L<60?'Accessorio':S<.12*L?'Piatto':'Altro';
    out.push({inc:1,desc:ty=='Traverso'?'Traverso '+R(L):'Elemento '+R(c.w)+' x '+R(c.h),type:ty,qty:c.n,len:R(L),sec:R(c.w)+' x '+R(c.h),mat:'',note:'',_r:c.r})});
  Object.values(ci).sort((a,b)=>b.d-a.d).forEach(c=>out.push({inc:1,desc:'Foro / tondo Ø '+c.d,type:'Foro',qty:c.n,len:'',sec:'Ø '+c.d,mat:'',note:'',_r:c.r}));
  // profili disegnati con due linee parallele
  ['H','V'].forEach(o=>{
    const s=segs[o].sort((p,q)=>p.c-q.c),used=new Set(),mem=[];
    for(let i=0;i<s.length;i++){if(used.has(i))continue;
      for(let j=i+1;j<s.length&&s[j].c-s[i].c<=30;j++){if(used.has(j))continue;const d=s[j].c-s[i].c;
        if(d>=.5&&Math.abs(s[i].a-s[j].a)<=1.5&&Math.abs(s[i].b-s[j].b)<=1.5){used.add(i);used.add(j);mem.push({a:s[i].a,b:s[i].b,c:(s[i].c+s[j].c)/2,w:d});break}}}
    mem.sort((p,q)=>p.c-q.c||p.a-q.a);
    const ch=[];mem.forEach(m=>{const l=ch.find(x=>Math.abs(x.c-m.c)<=1.5&&Math.abs(x.w-m.w)<=1.5&&m.a-x.b<=30&&m.a>=x.a);if(l)l.b=Math.max(l.b,m.b);else ch.push({...m})});
    const gr={};ch.forEach(m=>{const len=R(m.b-m.a),k=R(len/2)+'|'+R(m.w);const q=(gr[k]=gr[k]||{n:0,len,w:m.w,r:[]});q.n++;q.r.push(o=='H'?{h:1,a:m.a,b:m.b,c:m.c}:{v:1,a:m.a,b:m.b,c:m.c})});
    Object.values(gr).sort((a,b)=>b.len-a.len).forEach(g=>{
      const ty=o=='H'?(g.len>=.8*W?'Traverso':'Profilo'):(g.len>=.8*H?'Montante':'Montante');
      out.push({inc:1,desc:(ty=='Montante'?'Montante':ty=='Traverso'?'Traverso':'Profilo')+(o=='H'?' orizzontale ':' verticale ')+g.len,type:ty,qty:g.n,len:g.len,sec:'largh. '+R(g.w*10)/10,mat:'',note:'',_r:g.r})});
    // linee singole non accoppiate
    const free={};s.forEach((x,i)=>{if(used.has(i))return;const len=R(x.b-x.a),k=len;const q=(free[k]=free[k]||{n:0,len,r:[],o});q.n++;q.r.push(o=='H'?{h:1,a:x.a,b:x.b,c:x.c}:{v:1,a:x.a,b:x.b,c:x.c})});
    Object.values(free).sort((a,b)=>b.len-a.len).slice(0,6).forEach(g=>out.push({inc:0,desc:'Linea '+(g.o=='H'?'orizzontale ':'verticale ')+g.len,type:'Profilo',qty:g.n,len:g.len,sec:'',mat:'',note:'da verificare',_r:g.r}))});
  Object.values(oth).sort((a,b)=>b.len-a.len).slice(0,6).forEach(g=>out.push({inc:0,desc:'Linea inclinata '+g.len+' ('+g.g+'°)',type:'Profilo',qty:g.n,len:g.len,sec:'',mat:'',note:'da verificare',_r:g.r}));
  // ordina: prima le righe incluse
  const fin=out.filter(r=>r.inc).concat(out.filter(r=>!r.inc)).slice(0,40),M=Math.max(1,fin.filter(r=>r.inc).length);
  const pk=(rs,tx)=>{let best=null,bd=1e18;rs.forEach(q=>{let x,y,d;
    if(Array.isArray(q)){x=q[0];y=q[1];d=Math.abs(x-tx)}

    if(d<bd){bd=d;best=[Math.round(x*10)/10,Math.round(y*10)/10]}});return best};
  let k=0;fin.forEach(r=>{const tx=r.inc?W*(k++ +.5)/M:W/2;r.ref=pk(r._r,tx);r.refL=pk(r._r,0);delete r._r});
  return fin;
}

function labDraw(doc,x,y,w,h,j,it,border){
  const r=it.r,sc=Math.max(.7,Math.min(1.6,Math.min(w/70,h/36))),pad=2.2*sc;

  const fit=(t,mw,sz,b)=>{t=String(t||'');doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(sz);if(doc.getTextWidth(t)<=mw)return t;while(t.length>1&&doc.getTextWidth(t+'.')>mw)t=t.slice(0,-1);return t+'.'};
  doc.setDrawColor(0);doc.setTextColor(0);

  doc.setLineWidth(.25);doc.line(L0,y+h*.2,R0,y+h*.2);

  tx(fit(r.desc||'-',R0-dx-cw2,10*sc,1),dx,y+h*.35,10*sc,1);if(cd)tx(cd,R0,y+h*.35,9*sc,1,'right');
  if(lk.length)tx(fit('COLLEGATO A: '+lk.join(', '),R0-L0,7.5*sc,1),L0,y+h*.95,7.5*sc,1);
  tx(fit([r.type,r.mat,r.sec].filter(Boolean).join(' · '),R0-dx,7.5*sc,0),dx,y+h*.455,7.5*sc,0);
  // schizzo del pezzo con misura e angoli
  const Ln=r.len===''||r.len==null?'':String(r.len).trim(),ay=y+h*.53,ah=lk.length?h*.3:h*.42;
  if(!Ln){tx('misura da definire',(L0+R0)/2,ay+ah/2,7.5*sc,0,'center');return}
  const cl=+r.cl||0,cr=+r.cr||0,hb=Math.min(5*sc,ah*.34),x0=L0+8*sc,x1=R0-8*sc,yb=ay+ah-hb-.8,
    t=a=>Math.min(Math.abs(Math.tan(Math.min(Math.abs(a),80)*Math.PI/180))*hb,(x1-x0)*.3),oL=t(cl),oR=t(cr),
    tl=x0+(cl<0?oL:0),bl=x0+(cl>0?oL:0),tr=x1-(cr<0?oR:0),br=x1-(cr>0?oR:0);
  doc.setLineWidth(.45);doc.line(tl,yb,tr,yb);doc.line(bl,yb+hb,br,yb+hb);doc.line(tl,yb,bl,yb+hb);doc.line(tr,yb,br,yb+hb);
  const qy=yb-2.4*sc;doc.setLineWidth(.25);doc.line(x0,qy,x1,qy);doc.line(x0,qy-1,x0,qy+1);doc.line(x1,qy-1,x1,qy+1);
  tx(Ln+' mm',(x0+x1)/2,qy-.9,9*sc,1,'center');
  if(cl)tx(Math.abs(cl)+'°',x0-1,yb+hb/2+1,7*sc,0,'right');if(cr)tx(Math.abs(cr)+'°',x1+1,yb+hb/2+1,7*sc,0);
}
function labDrawPl(doc,x,y,w,h,j,it,border){

const BK_K='carp_bklast';
const bkLast=()=>{try{return JSON.parse(localStorage.getItem(BK_K))||null}catch(e){return null}};
const bkSetLast=o=>{try{localStorage.setItem(BK_K,JSON.stringify(o))}catch(e){}};
const BKS={busy:0,info:null,err:''};
const bkDk=()=>!!(window.desktop&&window.desktop.bk);
let bkKeys=()=>FDB().then(db=>new Promise((ok,ko)=>{const q=db.transaction('f').objectStore('f').getAllKeys();q.onsuccess=()=>ok(q.result.map(String));q.onerror=()=>ko(q.error)}));
function bkMeta(){const m={};[D.jobs,D.xsheets].forEach(c=>(c||[]).forEach(x=>(x.docs||[]).forEach(s=>[...(s.pdfs||[]),...(s.files||[])].forEach(f=>{if(f&&f.fid)m[f.fid]={fid:f.fid,name:f.name,size:f.size,type:f.type,job:x.code||x.title||''}}))));return m}
const bkAtt=(keys,meta)=>keys.map(k=>meta[k]||{fid:k,name:k});
const bkDt=t=>{const d=new Date(t);return isNaN(d)?'':d.toLocaleDateString('it-IT')+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})};
const bkMb=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
const bkHead=(keys,meta)=>'{"formato":"gc-backup","v":1,"app":'+JSON.stringify(APP_VER)+',"creato":'+JSON.stringify(new Date().toISOString())+',"azienda":'+JSON.stringify((CO().name)||'')+',"dati":'+JSON.stringify(D)+',"allegati":'+JSON.stringify(bkAtt(keys,meta));
// esegue la copia (solo programma installato): allegati nuovi + file dei dati del giorno
async function bkRun(tag){
  if(BKS.busy||!bkDk())return false;
  BKS.busy=1;bkDraw();const prev=bkLast();
  try{
    const B=window.desktop.bk,keys=await bkKeys(),meta=bkMeta();
    const miss=await B.mancanti(keys);let n=0,bytes=0;
    for(const fid of miss){const b=await fGet(fid);if(!b)continue;const buf=new Uint8Array(await b.arrayBuffer());await B.allegato(fid,(meta[fid]||{}).name||fid,buf);n++;bytes+=buf.length}
    const nome=await B.dati(bkHead(keys,meta)+'}',tag||'');
    bkSetLast({t:new Date().toISOString(),ok:1,okT:new Date().toISOString(),nome,att:keys.length,nuovi:n,bytes});
    BKS.err='';
  }catch(e){BKS.err=String(e&&e.message||e);bkSetLast({t:new Date().toISOString(),ok:0,okT:prev&&prev.okT||'',err:BKS.err})}
  BKS.busy=0;await bkInfo();bkDraw();bkWarn();
  return !BKS.err;
}
async function bkInfo(){if(bkDk()){try{BKS.info=await window.desktop.bk.info()}catch(e){}}return BKS.info}
async function bkAuto(){
  if(!bkDk()||BKS.busy||!D||!D.jobs)return;
  const I=await bkInfo();if(!I||I.auto===false)return;
  const l=bkLast();if(l&&l.okT&&new Date(l.okT).toDateString()==new Date().toDateString())return;
  if(l&&!l.ok&&l.t&&Date.now()-new Date(l.t)<10*60*1000)return;
  await bkRun('');
}
// copia manuale per il browser: un solo file (compresso) con dati e allegati
async function bkDownload(){
  if(BKS.busy)return;BKS.busy=1;bkDraw();
  try{
    const keys=await bkKeys(),meta=bkMeta(),parts=[bkHead(keys,meta)+',"blobs":{'];let first=1;
    for(const fid of keys){const b=await fGet(fid);if(!b)continue;const u=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ko(r.error);r.readAsDataURL(b)});parts.push((first?'':',')+JSON.stringify(fid)+':'+JSON.stringify(u));first=0}
    parts.push('}}');
    let blob=new Blob(parts,{type:'application/json'}),ext='json';
    if(window.CompressionStream){try{blob=await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob();ext='json.gz'}catch(e){}}
    const d=new Date(),p=n=>String(n).padStart(2,'0'),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`GC-GRE.MO-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.${ext}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    bkSetLast({t:d.toISOString(),ok:1,okT:d.toISOString(),nome:a.download,att:keys.length,nuovi:keys.length,bytes:blob.size});BKS.err='';
  }catch(e){BKS.err=String(e&&e.message||e)}
  BKS.busy=0;bkDraw();bkWarn();
}
// ---- ripristino
async function bkParse(file){
  let buf=new Uint8Array(await file.arrayBuffer()),txt;
  if(buf[0]==0x1f&&buf[1]==0x8b){
    if(!window.DecompressionStream)throw new Error('Questo browser non sa aprire file compressi: usa Chrome o Edge aggiornati.');
    txt=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }else txt=new TextDecoder().decode(buf);
  return bkCheck(JSON.parse(txt));
}
function bkCheck(o){if(!o||o.formato!='gc-backup'||!o.dati||!Array.isArray(o.dati.jobs))throw new Error('Il file non è una copia di sicurezza di questo programma.');return o}
const bkDataUrl=u=>{const i=u.indexOf(','),m=/data:([^;,]*)/.exec(u.slice(0,i)),s=atob(u.slice(i+1)),a=new Uint8Array(s.length);for(let k=0;k<s.length;k++)a[k]=s.charCodeAt(k);return new Blob([a],{type:m?m[1]:''})};
async function bkApply(o,getBlob){
  try{localStorage.setItem('carp_prerestore',localStorage.getItem(KEY)||'')}catch(e){}
  let ok=0,no=0;
  for(const f of (o.allegati||[])){let b=null;try{b=await getBlob(f)}catch(e){}if(b){await fPut(f.fid,b);ok++}else no++}
  D=o.dati;localStorage.setItem(KEY,JSON.stringify(D));
  try{sessionStorage.removeItem('carp_sess')}catch(e){}
  toast('Copia ripristinata ('+ok+' allegati'+(no?', '+no+' non trovati':'')+'). Il programma si riavvia…');
  setTimeout(()=>location.reload(),1800);
}
function bkAskRestore(o,desc,getBlob){
  askConfirm('Ripristinare '+desc+'? Tutti i dati attuali vengono sostituiti da quelli della copia'+(bkDk()?' (prima ne viene salvata una copia di sicurezza)':' (scarica prima una copia se vuoi poterli recuperare)')+'. Il programma si riavvia e dovrai accedere di nuovo.',async()=>{
    try{if(bkDk()){const r=await bkRun('prima-ripristino');if(!r){toast('Copia di sicurezza non riuscita: ripristino annullato.');return}}await bkApply(o,getBlob)}catch(e){toast('Ripristino non riuscito: '+(e&&e.message||e))}});
}
async function bkRestoreFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{const o=await bkParse(f);const b=o.blobs||{};bkAskRestore(o,'la copia del '+bkDt(o.creato)+(o.azienda?' ('+o.azienda+')':''),async a=>b[a.fid]?bkDataUrl(b[a.fid]):null)}catch(e){toast('File non valido: '+(e&&e.message||e))}
}
async function bkRestoreCopy(nome){
  try{const B=window.desktop.bk,o=bkCheck(JSON.parse(await B.leggi(nome)));

// ---------- registro dei movimenti di magazzino (storico giacenze) e inventario a una data
// Ogni variazione di giacenza (carico, scarico, rettifica, importazione...) viene registrata in D.sl con data e utente:
// la giacenza a una data qualsiasi è la somma delle variazioni fino a quel giorno. Il registro parte dal primo salvataggio dopo l'attivazione.
const SL_MIN=1; let slCtx='',SLS=null,invZ=false;
const slDay=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const slNid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const slStart=()=>(D.sl||[]).find(x=>x.id==='start');
function slStocks(){const m={};(D.sl||[]).forEach(e=>{if(e.id!=='start')m[e.item]=r4((m[e.item]||0)+(+e.q||0))});return m}
function slSeen(it){if(SLS&&it)SLS[it.id]=r4(+it.stock||0)}
function slDiff(){
  if(!D||!Array.isArray(D.items))return;
  if(!Array.isArray(D.sl))D.sl=[];
  const now=new Date().toISOString(),day=slDay(),who=(typeof ME!=='undefined'&&ME)?ME.user:'';
  if(!slStart()){
    if(window.GC_CLOUD&&!(typeof isAdm=='function'&&isAdm()))return;   // col server l'avvio del registro lo fa l'amministratore
    D.sl.push({id:'start',t:now,d:day,why:'Avvio del registro movimenti'});
    D.items.forEach(i=>{const s=r4(+i.stock||0);if(s)D.sl.push({id:slNid(),t:now,d:day,item:i.id,code:i.code,um:i.um,q:s,s,c:+i.cost||0,why:'Giacenza iniziale',u:who})});
    SLS={};D.items.forEach(i=>SLS[i.id]=r4(+i.stock||0));slCtx='';return}
  if(!SLS)SLS=slStocks();
  const seen=new Set();
  D.items.forEach(i=>{seen.add(String(i.id));const cur=r4(+i.stock||0),prev=SLS[i.id]||0,q=r4(cur-prev);
    if(Math.abs(q)>1e-9){D.sl.push({id:slNid(),t:now,d:day,item:i.id,code:i.code,um:i.um,q,s:cur,c:+i.cost||0,why:slCtx||(q>0?'Carico':'Scarico'),u:who});SLS[i.id]=cur}});
  Object.keys(SLS).forEach(k=>{if(!seen.has(k)){const prev=SLS[k];if(Math.abs(prev)>1e-9){const old=[...D.sl].reverse().find(e=>String(e.item)==k)||{};D.sl.push({id:slNid(),t:now,d:day,item:+k,code:old.code,um:old.um,q:-prev,s:0,c:old.c||0,why:'Articolo eliminato',u:who})}delete SLS[k]}});
  slCtx='';
}

function srtDo(){
  const old=document.getElementById('srtbar');
  if(!ME||!SRT_VIEWS.has(view)){if(old)old.remove();return}
  const L=srtTables();if(!L.length){if(old)old.remove();return}

  const html=`<span class="mut" style="font-size:12px">Ordina per</span><select onchange="srtSet(this.value)" style="width:auto;min-width:0;height:34px">${names.map(n=>`<option ${n==st.k?'selected':''}>${esc(n)}</option>`).join('')}</select><button class="b" onclick="srtDir()" title="Inverti l’ordine">${st.d>0?'↑ Crescente':'↓ Decrescente'}</button>`;

    const tb=x.t.tBodies[0],rows=[...tb.rows],isData=r=>!r.querySelector('td[colspan]')&&r.cells.length>c.i;
    const keys=[c,x.cols.find(z=>z.i!=c.i&&z.date!=c.date)].filter(Boolean);
    // le righe di intestazione di gruppo o di totale restano al loro posto: si ordinano le righe dati comprese tra una e l'altra
    const runs=[];let cur=null;rows.forEach(r=>{if(isData(r)){if(!cur){cur={rows:[],next:null};runs.push(cur)}cur.rows.push(r)}else{if(cur)cur.next=r;cur=null}});
    runs.forEach(run=>{
      if(run.rows.length<2)return;
      const un=[];run.rows.forEach(r=>{const g=r.dataset&&r.dataset.g,l=un[un.length-1];if(g&&l&&l.g==g)l.rs.push(r);else un.push({g,rs:[r]})});
      if(un.length<2)return;
      const rec=un.map((u,k)=>({r:u.rs[0],rs:u.rs,k,v:keys.map(z=>srtVal(u.rs[0].cells[z.i],z.date))}));
      rec.sort((a,b)=>{for(let q=0;q<keys.length;q++){const A=a.v[q],B=b.v[q];if(A===B)continue;if(!A)return 1;if(!B)return-1;

      if(rec.every((o,k)=>o.k==k))return;

    });
  });

async function bilExp(){
  const t=$('#bxT').value,f=$('#bxF').value,to=$('#bxTo').value;
  if(!f||!to){alert('Inserisci la data iniziale e quella finale.');return}
  if(f>to){alert('La data iniziale è successiva a quella finale.');return}
  if(!pdfReady())return;
  $('#dlg').close();
  const per='Dal '+dt(f)+' al '+dt(to),gen='   |   Generato il '+today(),fn=f+'_'+to;
  const ord=m=>Object.values(m).filter(o=>o.d||o.a).sort((a,b)=>a.p.code.localeCompare(b.p.code));
  const by=(S,ty)=>{const sg=accSegno(ty);return ord(S).filter(o=>o.p.type==ty).map(o=>({p:o.p,v:r2(sg*(o.d-o.a))}))};
  const sm=l=>r2(l.reduce((s,x)=>s+x.v,0)),rw=l=>l.length?l.map(x=>[x.p.code+' · '+x.p.name,pe(x.v)]):[['-','']];
  if(t=='ver'){
    const L=ord(accSaldi(to,f));let td=0,ta=0,sd=0,sa=0;
    const body=L.map(o=>{const s=r2(o.d-o.a);td+=o.d;ta+=o.a;if(s>0)sd+=s;else sa-=s;return[o.p.code+' '+o.p.name,PDC_T[o.p.type]||'',pe(o.d),pe(o.a),s>0?pe(s):'',s<0?pe(-s):'']});
    if(L.length)body.push([pL('Totale'),pL(''),pL(pe(r2(td))),pL(pe(r2(ta))),pL(pe(r2(sd))),pL(pe(r2(sa)))]);
    return aPdf('Bilancio di verifica',per+gen,['Conto','Tipo','Totale dare','Totale avere','Saldo dare','Saldo avere'],body,'Bilancio_verifica_'+fn,aRO([2,3,4,5]));
  }
  if(t=='ce'){
    const S=accSaldi(to,f),R=by(S,'R'),C=by(S,'C'),ut=r2(sm(R)-sm(C));
    const doc=pdfDoc('Conto economico',per+gen,false);
    pdfTbl(doc,['Voce','Importo'],[[pL('RICAVI'),pL('')],...rw(R),[pB('Totale ricavi'),pB(pe(sm(R)))],[pL('COSTI'),pL('')],...rw(C),[pB('Totale costi'),pB(pe(sm(C)))],[pL(ut>=0?'UTILE DEL PERIODO':'PERDITA DEL PERIODO'),pL(pe(Math.abs(ut)))]],aRO([1]));
    return pdfSave(doc,'Conto_economico_'+fn+'.pdf');
  }
  const S=accSaldi(to),A=by(S,'A'),P=by(S,'P'),N=by(S,'N'),res=m=>r2(sm(by(m,'R'))-sm(by(m,'C')));
  const utT=res(S),utP=res(accSaldi(to,f)),utE=r2(utT-utP),pas=r2(sm(P)+sm(N)+utT),dif=r2(sm(A)-pas);
  const lab=(v,s)=>(v>=0?'Utile ':'Perdita ')+s;
  const doc=pdfDoc('Stato patrimoniale','Situazione al '+dt(to)+'   |   Movimenti del periodo: '+per.toLowerCase()+gen,false);
  const pb=[[pL('PASSIVITÀ E PATRIMONIO NETTO'),pL('')],...(P.length||N.length?rw([...P,...N]):[['-','']])];
  if(utE)pb.push([lab(utE,'esercizi precedenti'),pe(Math.abs(utE))]);
  pb.push([lab(utP,'del periodo'),pe(Math.abs(utP))],[pB('Totale passività e patrimonio netto'),pB(pe(pas))]);
  pdfTbl(doc,['Voce','Importo'],[[pL('ATTIVITÀ'),pL('')],...rw(A),[pB('Totale attività'),pB(pe(sm(A)))],...pb,[pB('Quadratura (attività − passività)'),pB(Math.abs(dif)<0.005?'quadra':pe(dif))]],aRO([1]));
  return pdfSave(doc,'Stato_patrimoniale_'+to+'.pdf');
}

// ===================== SIMULAZIONE DEL REDDITO (in tempo reale) =====================
// Prospetto dell'anno scelto, calcolato solo dai dati registrati (fatture, prima nota, cespiti, scritture) e dalle
// caratteristiche fiscali impostate in Contabilità › Impostazioni. Nessuno scenario: si aggiorna a ogni modifica.
const FX_DEF=()=>({forma:'srl',ires:24,irap:3.9,irapDed:0,perdite:0,crediti:0,dist:0,ritDiv:26,reg:1.73,com:0.8,
  sc:[[28000,23],[50000,35],[1e12,43]],inps:{art:24,com:24.48,min:18555,max:120607,soglia:55448,extra:1},
  soci:[{n:'Titolare',q:100,altri:0,oneri:0,detr:0,inps:'art'}]});
const FORME={srl:'S.r.l. (società di capitali)',spa:'S.p.A. (società di capitali)',snc:'S.n.c. (società di persone)',sas:'S.a.s. (società di persone)',ditta:'Ditta individuale'};
const fxCap=f=>f.forma=='srl'||f.forma=='spa';
function FX(){const d=FX_DEF(),f=(CS().fx)||{},m=Object.assign(d,f);m.inps=Object.assign(FX_DEF().inps,f.inps||{});if(!Array.isArray(m.sc)||!m.sc.length)m.sc=FX_DEF().sc;if(!Array.isArray(m.soci)||!m.soci.length)m.soci=FX_DEF().soci;return m}
const fxW=()=>{const c=CS();if(!c.fx)c.fx=FX();if(!c.fx.inps)c.fx.inps=FX_DEF().inps;return c.fx};
function fxSet(k,v){fxW()[k]=v;csSave()}
function fxInps(k,v){fxW().inps[k]=+v||0;csSave()}
function fxSc(i,j,v){const f=fxW();f.sc[i][j]=j==0&&(+v||0)==0?1e12:(+v||0);csSave()}
function fxSocio(i,k,v){const f=fxW();f.soci[i][k]=(k=='n'||k=='inps')?v:(+v||0);csSave()}
function fxSocioAdd(){const f=fxW();f.soci.push({n:'Socio '+(f.soci.length+1),q:0,altri:0,oneri:0,detr:0,inps:'art'});csSave()}
function fxSocioDel(i){const f=fxW();if(f.soci.length<2){alert('Serve almeno un socio o titolare.');return}f.soci.splice(i,1);csSave()}
function fxCalc(){
  const f=FX(),M=CS().map,y=cYr||String(new Date().getFullYear()),y0=y+'-01-01',y1=y+'-12-31',cap=fxCap(f);
  const ric=[],cos=[],months=Array.from({length:12},()=>({r:0,c:0}));
  jrnl().forEach(e=>{if(e.date<y0||e.date>y1)return;
    const inv=e.src.t=='inv'?D.inv.find(x=>x.id==e.src.id):null,ces=e.src.t=='ces'?D.ces.find(x=>x.id==e.src.id):null,mi=+e.date.slice(5,7)-1;
    e.righe.forEach(r=>{const p=pdcBy(r.c);if(!p)return;
      if(p.type=='R'){const v=r2(r.a-r.d);ric.push({date:e.date,desc:e.desc,name:aPKName(e.pk),p,v,src:e.src,inv});months[mi].r+=v}
      else if(p.type=='C'){const v=r2(r.d-r.a);let ded=null;
        if(inv&&inv.ded!=null&&inv.ded!=='')ded=+inv.ded;else if(ces)ded=(ces.ded!=null&&ces.ded!=='')?+ces.ded:cesCat(ces).ded;
        if(ded==null||isNaN(ded))ded=p.ded==null?100:+p.ded;
        cos.push({date:e.date,desc:e.desc,name:aPKName(e.pk),p,v,ded:Math.max(0,Math.min(100,ded)),src:e.src});months[mi].c+=v}})});
  const nonReg=aToReg().filter(r=>(r.date||'').slice(0,4)==y);
  nonReg.forEach(r=>{const p=pdcBy(M.ricavi)||{code:M.ricavi,name:'Ricavi',type:'R'};ric.push({virtual:1,date:r.date,desc:'Fattura '+(r.num||'')+' · '+r.desc.slice(0,70),name:cn(r.client),p,v:r.net,src:{t:'inv0'}});months[+r.date.slice(5,7)-1].r+=r.net});
  const sum=(l,k)=>r2(l.reduce((t,x)=>t+x[k],0)),R=sum(ric,'v'),C=sum(cos,'v'),ris=r2(R-C);
  const indeduc=r2(cos.reduce((t,x)=>t+x.v*(1-x.ded/100),0)),redFisc=r2(ris+indeduc);
  const pers=r2(cos.filter(x=>x.p.code==(M.pers||'550')).reduce((t,x)=>t+x.v,0));
  const offs=r2(Math.min(+f.perdite||0,Math.max(0,redFisc)*0.8)),imponibile=r2(Math.max(0,redFisc-offs));
  const irapBase=r2(Math.max(0,ris+pers-(+f.irapDed||0))),irap=r2(irapBase*f.irap/100);
  const ritSub=r2(D.inv.filter(i=>i.dir=='E'&&(i.date||'')>=y0&&(i.date||'')<=y1).reduce((t,i)=>t+aRit(i),0));
  const acc=r2(-D.cmov.filter(m=>m.cat=='Versamento imposte sul reddito'&&m.date>=y0&&m.date<=y1).reduce((t,m)=>t+m.amt,0));
  const irpef=x=>{let t=0,prev=0;for(const[lim,r] of f.sc){if(x>prev)t+=(Math.min(x,lim)-prev)*r/100;prev=lim}return t};
  const inpsCalc=(base,tipo)=>{if(!tipo||tipo=='no')return{fisso:0,ecc:0};const I=f.inps,al=(tipo=='com'?I.com:I.art)/100,fisso=r2(al*I.min),b=Math.min(Math.max(base,0),I.max);let ecc=0;
    if(b>I.min){ecc=al*(b-I.min);if(b>I.soglia)ecc+=I.extra/100*(b-I.soglia)}return{fisso,ecc:r2(ecc)}};
  let ires=0,soci=[],impRed=0,contrib=0,dist=0,ritDiv=0;
  if(cap){ires=r2(imponibile*f.ires/100);impRed=r2(ires+irap);const net0=r2(ris-impRed);dist=r2(Math.max(0,net0)*(+f.dist||0)/100);ritDiv=r2(dist*(+f.ritDiv||0)/100)}
  else{let ir=0;soci=f.soci.map(s=>{const base=r2(imponibile*(+s.q||0)/100),ip=inpsCalc(base,s.inps),cont=r2(ip.fisso+ip.ecc),a=Math.max(0,(+s.altri||0)-(+s.oneri||0)),imp=Math.max(0,base+(+s.altri||0)-cont-(+s.oneri||0));
      const inc=r2(Math.max(0,irpef(imp)-irpef(a)-(+s.detr||0))),ad=r2((imp-a)*((+f.reg||0)+(+f.com||0))/100);ir+=inc+ad;contrib+=cont;
      return{s,base,fisso:ip.fisso,ecc:ip.ecc,cont,inc,ad,net:r2(base-inc-ad-cont),rit:r2(ritSub*(+s.q||0)/100)}});
    impRed=r2(irap+ir)}
  const tot=impRed,cred=r2(ritSub+acc+(+f.crediti||0)),saldo=r2(tot-cred),net=r2(ris-tot-contrib);
  return{f,y,cap,ric,cos,nonReg,R,C,ris,indeduc,redFisc,offs,imponibile,pers,irapBase,irap,ires,soci,impRed,contrib,dist,ritDiv,ritSub,acc,cred:r2(+f.crediti||0),saldo,net,months,tot};
}

function cesPiano(a){
  const cost=r2(a.cost),rate=(+a.pct||0)/100,out=[];if(!(cost>0)||!(rate>0)||!a.date)return out;
  const y0=+a.date.slice(0,4),yE=a.dis?+a.dis.slice(0,4):9999;let cum=0;
  for(let y=y0;y<=y0+100&&cum<cost-0.005&&y<=yE;y++){let q=cost*rate;if(y==y0&&a.half)q/=2;q=Math.min(r2(q),r2(cost-cum));cum=r2(cum+q);out.push({y,q,fondo:cum,res:r2(cost-cum)})}
  return out;
}

function xmlText(buf){
  const u=new Uint8Array(buf);let lat='';for(let k=0;k<u.length;k+=8192)lat+=String.fromCharCode.apply(null,u.subarray(k,k+8192));
  let a=lat.search(/<\?xml/),m=lat.match(/<(\w+:)?FatturaElettronica[\s>][\s\S]*<\/(\w+:)?FatturaElettronica>/);
  if(!m)throw new Error('non è una fattura elettronica');
  const st=a>=0&&a<=m.index?a:m.index,en=m.index+m[0].length;
  return new TextDecoder('utf-8').decode(u.subarray(st,en));
}
function xmlParse(txt,fname){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('XML non valido');
  const root=doc.documentElement,hd=xQ(root,'FatturaElettronicaHeader'),out=[];
  const party=(p)=>{const an=xQ(p,'DatiAnagrafici/Anagrafica');
    const nome=an?(xT(an,'Denominazione')||[xT(an,'Nome'),xT(an,'Cognome')].filter(Boolean).join(' ')):'';
    return{name:nome,piva:xT(p,'DatiAnagrafici/IdFiscaleIVA/IdCodice'),cf:xT(p,'DatiAnagrafici/CodiceFiscale')}};
  const ced=party(xQ(hd,'CedentePrestatore')),ces=party(xQ(hd,'CessionarioCommittente'));
  xA(root,'FatturaElettronicaBody').forEach(b=>{
    const g=xQ(b,'DatiGenerali/DatiGeneraliDocumento');if(!g)return;
    const td=xT(g,'TipoDocumento'),riep=xA(b,'DatiBeniServizi/DatiRiepilogo');
    let imp=0,iva=0;riep.forEach(r=>{imp+=xNum(xT(r,'ImponibileImporto'));iva+=xNum(xT(r,'Imposta'))});
    imp=r2(imp);iva=r2(iva);
    const rates=[...new Set(riep.map(r=>xNum(xT(r,'AliquotaIVA'))))];
    const rig=[];riep.forEach(r=>{const v=xNum(xT(r,'AliquotaIVA')),n=r2(xNum(xT(r,'ImponibileImporto')));const e=rig.find(x=>x.vat==v);if(e)e.net=r2(e.net+n);else rig.push({net:n,vat:v})});
    rig.sort((a,b)=>b.net-a.net);const vat=rig.length?rig[0].vat:(imp?r2(iva/imp*100):0);
    const rit=xQ(g,'DatiRitenuta'),ritA=rit?xNum(xT(rit,'AliquotaRitenuta')):0,ritI=rit?xNum(xT(rit,'ImportoRitenuta')):0;
    const ritb=ritA&&imp?Math.min(100,r2(ritI/(ritA/100)/imp*100)):100;
    const lines=xA(b,'DatiBeniServizi/DettaglioLinee'),pays=xA(b,'DatiPagamento/DettaglioPagamento').map(p=>xT(p,'DataScadenzaPagamento')).filter(Boolean).sort();
    const causale=xA(g,'Causale').map(c=>c.textContent.trim()).join(' ');
    const d1=lines[0]?xT(lines[0],'Descrizione'):'';
    out.push({file:fname,td,nc:(td=='TD04'||td=='TD08')?1:0,num:xT(g,'Numero'),date:xT(g,'Data'),net:imp,vat,rig:rig.length>1?rig:null,rates,rit:ritA,ritb,
      due:pays.length?pays[pays.length-1]:'',tot:xNum(xT(g,'ImportoTotaleDocumento')),
      desc:(d1||causale)+(lines.length>1?' (+'+(lines.length-1)+(lines.length==2?' riga)':' righe)'):''),
      split:riep.some(r=>xT(r,'EsigibilitaIVA')=='S'),ced,ces});
  });
  return out;
}
function xFind(p,col){

async function xmlRead(files){

  return{s,sig,conf:sig.length>=3?'a':(sig.length==2&&sig.includes('importo'))?'a':sig.length==2?'m':'b'};

function ecMatch(rows,existing){
  ecWeights();

  const rules=(CS().ecRules||{});
  rows.forEach(r=>{
    r.cands=[];r.act='x';r.tag='';r.cat=r.cat||'';r.conf='b';r.pn='';r.rit=0;r.cpt=ecCpt(r);
    const dir=r.amt>0?'E':'R',list=ecInvOpen(dir).filter(i=>rem[i.id]>0.004),A=Math.abs(r.amt);
    const cx={refs:ecRefs(r.desc),dt:ecTok(r.desc),dc:ecN(r.desc).replace(/ /g,''),cpk:ecN(r.cpt).slice(0,28)};if(cx.cpk.length<5)cx.cpk='';
    const sc=list.map(i=>({i,...ecScore(r,i,rem,cx)})).filter(x=>x.s>=50||x.sig.includes('numero')).sort((a,b)=>b.s-a.s||(a.i.date<b.i.date?-1:1));
    let matched=false;

      const b=sc[0].i,amb=sc.length>1&&sc[1].s>=sc[0].s-5&&Math.abs(rem[sc[1].i.id]-rem[b.id])<0.011;
      r.cands=sc.slice(0,3).map(x=>[x.i.id]);r.act='i:'+b.id;r.conf=amb?'b':sc[0].conf;matched=true;
      r.tag='abbinata · '+({a:'affidabile',m:'probabile',b:'da verificare'}[r.conf])+' ('+sc[0].sig.join(' + ')+')'+(amb?' · più fatture con lo stesso importo':'');
      if(r.gross&&Math.abs(r.gross-A)>0.004&&!(+b.rit>0)&&Math.abs(r.gross-rem[b.id])<0.011&&Math.abs(A-rem[b.id])>0.011){r.rit=r2(r.gross-A);r.tag+=' · ritenuta '+eur2(r.rit)+' da impostare sulla fattura'}
      else if(A<rem[b.id]-0.011&&sc[0].sig.includes('numero'))r.tag+=' · pagamento parziale';
      rem[b.id]=Math.max(0,r2(rem[b.id]-A-(r.rit||0)))}
    if(!matched&&!sc.length||!matched&&!sc[0].sig.includes('importo')){ // una sola operazione che salda più fatture
      const pool=cx.refs.size?list.filter(i=>ecCore(i).some(c=>cx.refs.has(c))):list.filter(i=>ecPartyScore(cx.dt,aParty(i))>=0.6);
      const g=pool.slice(0,10);let f=null;
      for(let a=0;a<g.length&&!f;a++)for(let b=a+1;b<g.length&&!f;b++){if(Math.abs(rem[g[a].id]+rem[g[b].id]-A)<0.011)f=[g[a],g[b]];
        for(let c=b+1;c<g.length&&!f;c++){if(Math.abs(rem[g[a].id]+rem[g[b].id]+rem[g[c].id]-A)<0.011)f=[g[a],g[b],g[c]];
          for(let d=c+1;d<g.length&&!f;d++)if(Math.abs(rem[g[a].id]+rem[g[b].id]+rem[g[c].id]+rem[g[d].id]-A)<0.011)f=[g[a],g[b],g[c],g[d]]}}
      if(f){r.act='i:'+f.map(x=>x.id).join(',');r.cands=[f.map(x=>x.id)];f.forEach(x=>rem[x.id]=0);r.conf=cx.refs.size?'a':'m';r.tag='abbinata · '+(r.conf=='a'?'affidabile':'probabile')+' (somma di '+f.length+' fatture)';matched=true}
      else if(sc.length&&sc[0].s>=50){const b=sc[0].i;r.cands=sc.slice(0,3).map(x=>[x.i.id]);r.act='i:'+b.id;r.conf='b';r.tag='abbinata · da verificare ('+sc[0].sig.join(' + ')+') · importo diverso: pagamento parziale o più fatture';rem[b.id]=Math.max(0,r2(rem[b.id]-A));matched=true}
    }

      if(!cat){const kw=EC_KW.find(([re,c])=>re.test(T)&&opts.includes(c));if(kw){cat=kw[1];why='categoria suggerita dalla descrizione';r.conf='m'}}
      if(!cat){const col=r.amt<0?'sup':'cl',pc=D[col].map(p=>({p,s:(p.bk&&cx.cpk&&p.bk.includes(cx.cpk))?1:ecPartyScore(cx.dt,p.n)})).filter(x=>x.s>=0.6).sort((a,b)=>b.s-a.s)[0];
        if(pc){cat=r.amt<0?'Pagamento fornitore':'Incasso cliente';r.pn=pc.p.n;why=(r.amt<0?'fornitore ':'cliente ')+pc.p.n+' riconosciuto, ma nessuna fattura aperta da abbinare';r.conf='m'}}
      if(cat&&ecSrc=='pdf'){r.act='n';r.cat=cat;r.tag=why}
      else r.tag=cx.refs.size?'rif. fattura '+[...cx.refs].slice(0,4).join(', ')+': non presente in contabilità':(ecSrc=='pdf'?'da classificare':'nessuna fattura trovata');

      if(ex){r.cm=ex.id;if(ex.inv){r.act='x';r.tag='già registrato';r.cands=[]}else if(r.act=='x'||r.act=='n'){r.act=r.act=='n'?'x':r.act;r.tag='già in prima nota'}else r.tag+=' · collega al movimento esistente'}}
    if(D.cmov.some(m=>m.ec&&m.ec==ecKey(r))){r.act='x';r.tag='già importato';r.cm=null}
  });
}

function hrHol(y){ // festività nazionali italiane (con Pasquetta)
  if(_hrH[y])return _hrH[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1,pa=y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0');
  const s=new Set(['01-01','01-06','04-25','05-01','06-02','08-15','11-01','12-08','12-25','12-26'].map(x=>y+'-'+x));s.add(aAdd(pa,1));return _hrH[y]=s;
}

function hrBal(e,Y,M,k){ // ferie (ore) o ROL (ore): residuo iniziale + maturato - goduto
  const hd=hrHd(e),ann=k=='fer'?(+e.fer||0)*hd:(+e.rol||0),r0=e.r0||{};

  let open=(+r0.y==y0)?(+r0[k]||0):0,out={open:0,accr:0,used:0,res:0};const rs=D.hrd.filter(r=>r.emp==e.id);
  for(let y=y0;y<=Y;y++){
    const mm=y==Y?M:12;let n=0;
    for(let m=1;m<=mm;m++){const st=y+'-'+String(m).padStart(2,'0')+'-01',en=y+'-'+String(m).padStart(2,'0')+'-'+new Date(y,m,0).getDate();if((!e.from||en>=e.from)&&(!e.to||st<=e.to))n++}

}

async function anAdd(files){
  const okLib=await anLib();
  for(const f of [...files]){
    const buf=await f.arrayBuffer(),h=new Uint8Array(buf.slice(0,5));
    if(String.fromCharCode(...h)!='%PDF-'){alert('«'+f.name+'» non è un PDF.');continue}
    if(buf.byteLength>25*1048576){alert('«'+f.name+'» supera i 25 MB.');continue}
    let p=0;if(okLib){try{p=(await PDFLib.PDFDocument.load(buf,{ignoreEncryption:true})).getPageCount()}catch(e){alert('«'+f.name+'» non si apre: potrebbe essere protetto o danneggiato.');continue}}
    const u=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{await anPut('a:'+u,buf)}catch(e){alert('Non riesco a memorizzare l’allegato su questo computer.');continue}

  $('#anAll').innerHTML=anAllHtml();
}

    schedule();const fin=await waitSync();
    try{addLog('Ripristino: '+desc)}catch(e){}
    await loadAll();render();
    toast((fin?'Fatto: ':'Quasi fatto (alcune modifiche sono ancora in invio): ')+'dati caricati sul server ('+ok+' allegati'+(no?', '+no+' non trovati':'')+').');
  }catch(e){toast('Operazione non riuscita: '+(e.message||e)+'. Controlla lo stato e riprova.')}
};
async function safetyCopy(){
  try{if(typeof bkDk=='function'&&bkDk()){const r=await bkRun('prima-ripristino');return !!r}}catch(e){return false}
  try{await bkDownload();return true}catch(e){return false}
}
function askRestore(o,desc,getBlob){
  askConfirm('Caricare sul server '+desc+'? I dati attuali del server vengono sostituiti da quelli della copia per TUTTI gli utenti (prima viene salvata una copia di sicurezza di quelli attuali).',async()=>{
    if(!await safetyCopy())return toast('Copia di sicurezza dei dati attuali non riuscita: operazione annullata.');
    await cloudRestore(o,getBlob,desc)})
}
// accetta sia le copie di questo programma sia il semplice file dati del vecchio programma
async function readAny(file){
  try{return await bkParse(file)}catch(e){
    try{const t=await file.text();const j=JSON.parse(t);if(j&&Array.isArray(j.jobs))return {formato:'gc-backup',dati:j,allegati:[],creato:new Date().toISOString()}}catch(x){}
    throw e}
}
bkRestoreFile=async function(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{const o=await readAny(f);const b=o.blobs||{};askRestore(o,'la copia del '+bkDt(o.creato)+(o.azienda?' ('+o.azienda+')':''),async a=>b[a.fid]?bkDataUrl(b[a.fid]):null)}catch(e){toast('File non valido: '+(e.message||e))}};
window.cloudImportFile=bkRestoreFile;
bkRestoreCopy=async function(nome){
  try{const B=window.desktop.bk,o=bkCheck(JSON.parse(await B.leggi(nome)));
    askRestore(o,'la copia «'+nome+'»',async a=>{const u=await B.leggiAllegato(a.fid);return u?new Blob([u],{type:a.type||''}):null})}catch(e){toast('Copia non leggibile: '+(e.message||e))}};
// dati rimasti in questo computer dal programma precedente (senza server): dati + allegati
function oldIdb(){return new Promise(ok=>{try{const q=indexedDB.open('gc_files');q.onerror=()=>ok(null);q.onupgradeneeded=()=>{q.transaction.abort();ok(null)};q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('f')){db.close();return ok(null)}
  const t=db.transaction('f'),st=t.objectStore('f'),out={};const c=st.openCursor();c.onsuccess=()=>{const cu=c.result;if(cu){out[cu.key]=cu.value;cu.continue()}else{db.close();ok(out)}};c.onerror=()=>{db.close();ok(null)}}}catch(e){ok(null)}})}
window.cloudImportLocal=async function(){
  let raw=null;try{raw=localStorage.getItem('carp_proto_v2')}catch(e){}
  if(!raw)return toast('Su questo computer non ci sono dati del programma precedente.');
  let dati;try{dati=JSON.parse(raw)}catch(e){return toast('I dati locali non sono leggibili.')}
  if(!dati||!Array.isArray(dati.jobs))return toast('I dati locali non sono validi.');
  const idb=await oldIdb()||{};const fids=Object.keys(idb);
  const o={formato:'gc-backup',dati,allegati:fids.map(fid=>({fid})),creato:new Date().toISOString()};
  askRestore(o,'i dati di questo computer ('+(dati.jobs.length)+' commesse, '+fids.length+' allegati)',async a=>{const v=idb[a.fid];return v instanceof Blob?v:(v&&v.blob instanceof Blob?v.blob:null)});
};

  <div class="mut">Serve la prima volta, per portare sul server i dati del programma usato finora (anche da un file di copia). Sostituisce i dati del server; prima ne viene salvata una copia.</div></div>`;

(async function boot(){

  }
  showLoginCloud();
})();
setInterval(()=>{if(ME)stat()},4000);
})();
