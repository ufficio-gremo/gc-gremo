# Crea l'installer Windows e lo pubblica come "Release": i programmi installati lo trovano da soli.
# Si avvia quando viene aggiornato il ramo "release" (oppure a mano dalla scheda Actions).
# La versione pubblicata è quella scritta in package.json.
name: Pubblica versione
on:
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Costruisce e pubblica l'installer
        run: npm run pubblica
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
